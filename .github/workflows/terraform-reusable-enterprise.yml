name: Terraform Enterprise Reusable

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
      command:
        required: true
        type: string
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -lock-timeout=5m

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.command == 'plan'
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Upload Terraform Plan
        if: inputs.command == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan
          retention-days: 7

      - name: Download Terraform Plan
        if: inputs.command == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: ${{ inputs.working_directory }}

      - name: Terraform Apply
        if: inputs.command == 'apply'
        run: terraform apply -lock-timeout=5m -auto-approve tfplan

      - name: Terraform State Verify
        if: inputs.command == 'apply'
        run: terraform state list
