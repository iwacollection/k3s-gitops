name: Terraform Production Policy Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  terraform-policy-gate:
    name: Terraform Production Safety Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Check Critical Safety Rules
        run: |
          test -f infrastructure/terraform/policy/terraform-plan-risk-check.py || exit 1
          echo "Terraform production policy gate passed"
