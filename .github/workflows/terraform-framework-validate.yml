name: Terraform Framework Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/terraform/**'
      - 'enterprise-cicd/iac-catalog/**'
      - 'enterprise-cicd/iac-requests/**'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - '.github/workflows/terraform-framework-validate.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise-cicd/terraform/**'
      - 'enterprise-cicd/iac-catalog/**'
      - 'enterprise-cicd/iac-requests/**'
      - 'enterprise-cicd/contracts/environment-bindings.json'

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Terraform format check
        run: terraform fmt -check -recursive enterprise-cicd/terraform

  validate-stacks:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        stack:
          - enterprise-cicd/terraform/stacks/platform/identity
          - enterprise-cicd/terraform/stacks/platform/acr
          - enterprise-cicd/terraform/stacks/platform/connectivity
          - enterprise-cicd/terraform/stacks/platform/aks
          - enterprise-cicd/terraform/stacks/platform/observability
          - enterprise-cicd/terraform/stacks/platform/aks-observability
          - enterprise-cicd/terraform/stacks/workloads/storage
          - enterprise-cicd/terraform/stacks/workloads/key-vault
          - enterprise-cicd/terraform/stacks/workloads/managed-identity
          - enterprise-cicd/terraform/stacks/workloads/service-bus
          - enterprise-cicd/terraform/stacks/workloads/managed-redis
          - enterprise-cicd/terraform/stacks/workloads/postgresql-flexible
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Init and validate ${{ matrix.stack }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ matrix.stack }}" init -backend=false -input=false
          terraform -chdir="${{ matrix.stack }}" validate

  render-requests:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render standard catalog examples and every submitted IaC request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-rendered

          python enterprise-cicd/iac-catalog/render_request.py \
            --request enterprise-cicd/iac-requests/dev/payment-acr.example.json \
            --name-prefix plat \
            --output /tmp/iac-rendered/acr.json

          for service in storage key-vault managed-identity service-bus managed-redis postgresql-flexible; do
            python enterprise-cicd/iac-catalog/render_request.py \
              --request "enterprise-cicd/iac-catalog/services/$service/v1/request.example.json" \
              --output "/tmp/iac-rendered/$service.json"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/iac-rendered')
          acr = json.load(open(root/'acr.json'))
          kv = json.load(open(root/'key-vault.json'))
          bus = json.load(open(root/'service-bus.json'))
          redis = json.load(open(root/'managed-redis.json'))
          pg = json.load(open(root/'postgresql-flexible.json'))
          assert acr['sku'] == 'Standard'
          assert kv['public_network_access_enabled'] is False and kv['private_dns_zone_name'] == 'privatelink.vaultcore.azure.net'
          assert bus['sku'] == 'Premium' and bus['public_network_access_enabled'] is False
          assert bus['private_dns_zone_name'] == 'privatelink.servicebus.windows.net'
          assert redis['public_network_access'] == 'Disabled' and redis['private_dns_zone_name'] == 'privatelink.redis.azure.net'
          assert pg['private_dns_zone_name'].endswith('.postgres.database.azure.com')
          assert pg['delegated_subnet_name'] == 'snet-postgresql'
          print('Seven IaC catalog renderers are valid.')
          PY

          request_count=0
          while IFS= read -r request; do
            request_count=$((request_count + 1))
            directory_environment="$(basename "$(dirname "$request")")"
            declared_environment="$(python - "$request" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print(json.load(fh).get('spec', {}).get('environment', ''))
          PY
          )"

            if [ "$directory_environment" != "$declared_environment" ]; then
              echo "IaC request environment mismatch: path=$directory_environment spec=$declared_environment file=$request" >&2
              exit 1
            fi

            output="/tmp/iac-rendered/submitted-${request_count}.json"
            extra_args=()
            if [ "$(python - "$request" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print((json.load(fh).get('spec') or {}).get('service', ''))
          PY
          )" = "acr" ]; then
              extra_args=(--name-prefix plat)
            fi

            echo "Validating governed IaC request: $request"
            python enterprise-cicd/iac-catalog/render_request.py \
              --request "$request" \
              --output "$output" \
              "${extra_args[@]}"
          done < <(find enterprise-cicd/iac-requests -mindepth 2 -maxdepth 2 -type f -name '*.json' | sort)

          if [ "$request_count" -eq 0 ]; then
            echo 'No IaC request manifests were discovered.' >&2
            exit 1
          fi
          echo "Validated $request_count submitted IaC request manifest(s)."

  policy-contracts:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL PROD remains blocked until Entra DBA binding exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('enterprise-cicd/iac-catalog/services/postgresql-flexible/v1/request.example.json')
          data = json.loads(src.read_text())
          data['spec']['environment'] = 'prod'
          data['spec']['parameters'].update({
              'sku': 'GP_Standard_D4s_v3',
              'backupRetentionDays': 35,
              'geoRedundantBackup': True,
              'highAvailabilityMode': 'ZoneRedundant',
          })
          Path('/tmp/postgresql-prod.json').write_text(json.dumps(data))
          PY
          if python enterprise-cicd/iac-catalog/render_request.py --request /tmp/postgresql-prod.json --output /tmp/postgresql-prod.tfvars.json; then
            echo 'PostgreSQL PROD request should remain blocked until Entra DBA binding is configured.' >&2
            exit 1
          fi

  no-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert validation workflow never applies infrastructure
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[[:space:]])terraform([[:space:]]+-chdir=[^[:space:]]+[[:space:]]+)?apply([[:space:]]|$)' .github/workflows/terraform-framework-validate.yml; then
            echo 'Terraform Apply is forbidden in framework validation.' >&2
            exit 1
          fi

  real-dev-plan-readiness:
    name: Real Azure DEV plan readiness
    needs: render-requests
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect E2E free IaC request
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          REQUEST='enterprise-cicd/iac-requests/dev/platform-free-managed-identity.json'
          if [ -f "$REQUEST" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo "request=$REQUEST" >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve DEV OIDC identity
        if: steps.detect.outputs.enabled == 'true'
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          CLIENT_ID="$(jq -r '.environments.dev.identities.githubOidc.clientId // empty' "$BINDING")"
          TENANT_ID="$(jq -r '.environments.dev.identities.githubOidc.tenantId // empty' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.dev.identities.githubOidc.subscriptionId // empty' "$BINDING")"
          PRINCIPAL_ID="$(jq -r '.environments.dev.identities.githubOidc.principalId // empty' "$BINDING")"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID" && test -n "$PRINCIPAL_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

      - name: Azure login with DEV GitHub OIDC
        if: steps.detect.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ steps.auth.outputs.client_id }}
          tenant-id: ${{ steps.auth.outputs.tenant_id }}
          subscription-id: ${{ steps.auth.outputs.subscription_id }}

      - name: Collect Azure RBAC and state readiness evidence
        if: steps.detect.outputs.enabled == 'true'
        shell: bash
        env:
          PRINCIPAL_ID: ${{ steps.auth.outputs.principal_id }}
          SUBSCRIPTION_ID: ${{ steps.auth.outputs.subscription_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-evidence
          az account show --query '{subscription:name,subscriptionId:id,tenantId:tenantId}' -o json | tee /tmp/iac-evidence/account.json
          az role assignment list --assignee-object-id "$PRINCIPAL_ID" --all \
            --query '[].{role:roleDefinitionName,scope:scope}' -o json \
            | tee /tmp/iac-evidence/rbac.json || echo '[]' > /tmp/iac-evidence/rbac.json

          if az group show --name rg-platform-cicd -o json >/tmp/iac-evidence/state-rg.json 2>/tmp/iac-evidence/state-rg.err; then
            az storage account list --resource-group rg-platform-cicd \
              --query '[].{name:name,allowSharedKeyAccess:allowSharedKeyAccess,location:location}' -o json \
              | tee /tmp/iac-evidence/state-storage.json || true
          else
            printf '{"exists":false,"resourceGroup":"rg-platform-cicd"}\n' > /tmp/iac-evidence/state-rg.json
            printf '[]\n' > /tmp/iac-evidence/state-storage.json
          fi

          if az group show --name rg-iac-free-lab-dev -o json >/tmp/iac-evidence/target-rg.json 2>/dev/null; then
            true
          else
            printf '{"exists":false,"resourceGroup":"rg-iac-free-lab-dev"}\n' > /tmp/iac-evidence/target-rg.json
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.detect.outputs.enabled == 'true'
        with:
          terraform_version: '1.15.8'

      - name: Render request and run real Azure Terraform plan without backend writes
        if: steps.detect.outputs.enabled == 'true'
        shell: bash
        env:
          ARM_USE_CLI: 'true'
          ARM_SUBSCRIPTION_ID: ${{ steps.auth.outputs.subscription_id }}
          ARM_TENANT_ID: ${{ steps.auth.outputs.tenant_id }}
          ARM_SKIP_PROVIDER_REGISTRATION: 'true'
        run: |
          set -euo pipefail
          REQUEST='${{ steps.detect.outputs.request }}'
          STACK='enterprise-cicd/terraform/stacks/workloads/managed-identity'
          python enterprise-cicd/iac-catalog/render_request.py \
            --request "$REQUEST" \
            --output /tmp/request.tfvars.json
          cat /tmp/request.tfvars.json | tee /tmp/iac-evidence/rendered-tfvars.json

          terraform -chdir="$STACK" init -backend=false -input=false
          terraform -chdir="$STACK" plan \
            -refresh=false \
            -lock=false \
            -input=false \
            -var-file=/tmp/request.tfvars.json \
            -out=/tmp/dev.tfplan
          terraform -chdir="$STACK" show -json /tmp/dev.tfplan > /tmp/iac-evidence/plan.json

          python - <<'PY' | tee /tmp/iac-evidence/plan-summary.json
          import json
          p=json.load(open('/tmp/iac-evidence/plan.json'))
          changes=[]
          for rc in p.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              changes.append({'address':rc.get('address'),'actions':actions})
          creates=[x for x in changes if x['actions']==['create']]
          destructive=[x for x in changes if 'delete' in x['actions']]
          assert not destructive, destructive
          assert len(creates)==2, creates
          print(json.dumps({'creates':creates,'destructive':destructive,'status':'passed'}, indent=2))
          PY

      - name: Publish real plan readiness evidence
        if: ${{ always() && steps.detect.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: iac-free-managed-identity-dev-plan-readiness
          path: /tmp/iac-evidence
          if-no-files-found: error
          retention-days: 7

  framework-gate:
    if: ${{ always() }}
    needs:
      - fmt
      - validate-stacks
      - render-requests
      - policy-contracts
      - no-apply
      - real-dev-plan-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Require all Terraform framework checks
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.fmt.result }}' = success
          test '${{ needs.validate-stacks.result }}' = success
          test '${{ needs.render-requests.result }}' = success
          test '${{ needs.policy-contracts.result }}' = success
          test '${{ needs.no-apply.result }}' = success
          test '${{ needs.real-dev-plan-readiness.result }}' = success
