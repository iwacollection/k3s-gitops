name: Terraform Framework Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/terraform/**'
      - 'enterprise-cicd/iac-catalog/**'
      - 'enterprise-cicd/iac-requests/**'
      - '.github/workflows/terraform-framework-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'enterprise-cicd/terraform/**'
      - 'enterprise-cicd/iac-catalog/**'
      - 'enterprise-cicd/iac-requests/**'

permissions:
  contents: read

jobs:
  validate-framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform format check
        run: terraform fmt -check -recursive enterprise-cicd/terraform

      - name: Validate governed root stacks
        shell: bash
        run: |
          set -euo pipefail
          stacks=(
            enterprise-cicd/terraform/stacks/platform/identity
            enterprise-cicd/terraform/stacks/platform/acr
            enterprise-cicd/terraform/stacks/platform/connectivity
            enterprise-cicd/terraform/stacks/platform/aks
            enterprise-cicd/terraform/stacks/workloads/storage
            enterprise-cicd/terraform/stacks/workloads/key-vault
            enterprise-cicd/terraform/stacks/workloads/managed-identity
            enterprise-cicd/terraform/stacks/workloads/service-bus
          )
          for stack in "${stacks[@]}"; do
            echo "==> $stack"
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done

      - name: Render standard developer IaC requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-rendered
          python enterprise-cicd/iac-catalog/render_request.py --request enterprise-cicd/iac-requests/dev/payment-acr.example.json --name-prefix plat --output /tmp/iac-rendered/acr.json
          for service in storage key-vault managed-identity service-bus; do
            python enterprise-cicd/iac-catalog/render_request.py --request "enterprise-cicd/iac-catalog/services/$service/v1/request.example.json" --output "/tmp/iac-rendered/$service.json"
          done

      - name: Verify preview services reject PROD until private networking exists
        shell: bash
        run: |
          set -euo pipefail
          for service in key-vault service-bus; do
            python - "$service" <<'PY'
          import json, sys
          from pathlib import Path
          service = sys.argv[1]
          src = Path(f'enterprise-cicd/iac-catalog/services/{service}/v1/request.example.json')
          data = json.loads(src.read_text())
          data['spec']['environment'] = 'prod'
          Path(f'/tmp/{service}-prod.json').write_text(json.dumps(data))
          PY
            if python enterprise-cicd/iac-catalog/render_request.py --request "/tmp/$service-prod.json" --output "/tmp/$service-prod.tfvars.json"; then
              echo "$service PROD request should have been blocked." >&2
              exit 1
            fi
          done

      - name: Assert no apply is executed by validation workflow
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[[:space:]])terraform([[:space:]]+-chdir=[^[:space:]]+[[:space:]]+)?apply([[:space:]]|$)' .github/workflows/terraform-framework-validate.yml; then
            echo 'terraform apply is forbidden in framework validation.' >&2
            exit 1
          fi
