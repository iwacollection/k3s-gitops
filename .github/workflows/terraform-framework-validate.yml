name: Terraform Framework Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/terraform/**'
      - 'enterprise-cicd/iac-catalog/**'
      - 'enterprise-cicd/iac-requests/**'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - '.github/workflows/terraform-framework-validate.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise-cicd/terraform/**'
      - 'enterprise-cicd/iac-catalog/**'
      - 'enterprise-cicd/iac-requests/**'
      - 'enterprise-cicd/contracts/environment-bindings.json'

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Terraform format check
        run: terraform fmt -check -recursive enterprise-cicd/terraform

  validate-stacks:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        stack:
          - enterprise-cicd/terraform/stacks/platform/identity
          - enterprise-cicd/terraform/stacks/platform/acr
          - enterprise-cicd/terraform/stacks/platform/connectivity
          - enterprise-cicd/terraform/stacks/platform/aks
          - enterprise-cicd/terraform/stacks/platform/observability
          - enterprise-cicd/terraform/stacks/workloads/storage
          - enterprise-cicd/terraform/stacks/workloads/key-vault
          - enterprise-cicd/terraform/stacks/workloads/managed-identity
          - enterprise-cicd/terraform/stacks/workloads/service-bus
          - enterprise-cicd/terraform/stacks/workloads/managed-redis
          - enterprise-cicd/terraform/stacks/workloads/postgresql-flexible
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Init and validate ${{ matrix.stack }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ matrix.stack }}" init -backend=false -input=false
          terraform -chdir="${{ matrix.stack }}" validate

  render-requests:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render standard developer IaC requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-rendered
          python enterprise-cicd/iac-catalog/render_request.py \
            --request enterprise-cicd/iac-requests/dev/payment-acr.example.json \
            --name-prefix plat \
            --output /tmp/iac-rendered/acr.json

          for service in storage key-vault managed-identity service-bus managed-redis postgresql-flexible; do
            python enterprise-cicd/iac-catalog/render_request.py \
              --request "enterprise-cicd/iac-catalog/services/$service/v1/request.example.json" \
              --output "/tmp/iac-rendered/$service.json"
          done

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/iac-rendered')
          acr = json.load(open(root/'acr.json'))
          kv = json.load(open(root/'key-vault.json'))
          bus = json.load(open(root/'service-bus.json'))
          redis = json.load(open(root/'managed-redis.json'))
          pg = json.load(open(root/'postgresql-flexible.json'))
          assert acr['sku'] == 'Standard'
          assert kv['public_network_access_enabled'] is False and kv['private_dns_zone_name'] == 'privatelink.vaultcore.azure.net'
          assert bus['sku'] == 'Premium' and bus['public_network_access_enabled'] is False
          assert bus['private_dns_zone_name'] == 'privatelink.servicebus.windows.net'
          assert redis['public_network_access'] == 'Disabled' and redis['private_dns_zone_name'] == 'privatelink.redis.azure.net'
          assert pg['private_dns_zone_name'].endswith('.postgres.database.azure.com')
          assert pg['delegated_subnet_name'] == 'snet-postgresql'
          print('Seven IaC catalog renderers are valid.')
          PY

  policy-contracts:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PostgreSQL PROD remains blocked until Entra DBA binding exists
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src = Path('enterprise-cicd/iac-catalog/services/postgresql-flexible/v1/request.example.json')
          data = json.loads(src.read_text())
          data['spec']['environment'] = 'prod'
          data['spec']['parameters'].update({
              'sku': 'GP_Standard_D4s_v3',
              'backupRetentionDays': 35,
              'geoRedundantBackup': True,
              'highAvailabilityMode': 'ZoneRedundant',
          })
          Path('/tmp/postgresql-prod.json').write_text(json.dumps(data))
          PY
          if python enterprise-cicd/iac-catalog/render_request.py --request /tmp/postgresql-prod.json --output /tmp/postgresql-prod.tfvars.json; then
            echo 'PostgreSQL PROD request should remain blocked until Entra DBA binding is configured.' >&2
            exit 1
          fi

  no-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert validation workflow never applies infrastructure
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(^|[[:space:]])terraform([[:space:]]+-chdir=[^[:space:]]+[[:space:]]+)?apply([[:space:]]|$)' .github/workflows/terraform-framework-validate.yml; then
            echo 'Terraform Apply is forbidden in framework validation.' >&2
            exit 1
          fi

  framework-gate:
    if: ${{ always() }}
    needs:
      - fmt
      - validate-stacks
      - render-requests
      - policy-contracts
      - no-apply
    runs-on: ubuntu-latest
    steps:
      - name: Require all Terraform framework checks
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.fmt.result }}' = success
          test '${{ needs.validate-stacks.result }}' = success
          test '${{ needs.render-requests.result }}' = success
          test '${{ needs.policy-contracts.result }}' = success
          test '${{ needs.no-apply.result }}' = success
