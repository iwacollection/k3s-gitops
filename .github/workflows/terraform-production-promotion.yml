name: Terraform Production Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: prod

permissions:
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan_artifact: tfplan
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Plan
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infrastructure/terraform/environments/${{ inputs.environment }}/tfplan

  apply:
    name: Approved Terraform Apply
    needs: plan
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply Approved Plan
        working-directory: infrastructure/terraform/environments/${{ inputs.environment }}
        run: terraform apply tfplan
