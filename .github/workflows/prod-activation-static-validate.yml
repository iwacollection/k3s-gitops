name: PROD Activation Static Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/activation/prod/**'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/**'
      - 'enterprise-cicd/gitops/environments/prod/**'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-prod.example.json'
      - '.github/workflows/platform-smoke-prod-observe.yml'
      - '.github/workflows/prod-activation-static-validate.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise-cicd/activation/prod/**'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/**'
      - 'enterprise-cicd/gitops/environments/prod/**'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-prod.example.json'
      - '.github/workflows/platform-smoke-prod-observe.yml'
      - '.github/workflows/prod-activation-static-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate PROD activation and same-digest promotion contract
        run: python enterprise-cicd/activation/prod/validate_prod_activation.py

      - name: Validate activation shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n enterprise-cicd/activation/prod/bootstrap-prod-identity.sh
          bash -n enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/bootstrap-flux-aks-prod.sh

      - name: Assert activation scripts default to PLAN ONLY
        shell: bash
        run: |
          set -euo pipefail
          identity=enterprise-cicd/activation/prod/bootstrap-prod-identity.sh
          flux=enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/bootstrap-flux-aks-prod.sh
          grep -F 'APPLY=0' "$identity"
          grep -F 'APPLY=0' "$flux"
          grep -F 'PLAN ONLY' "$identity"
          grep -F 'PLAN ONLY' "$flux"

      - name: Assert PROD Observe cannot write Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/platform-smoke-prod-observe.yml
          if grep -nE 'kubectl[[:space:]]+(apply|create|patch|delete|replace)|helm[[:space:]]+(upgrade|install)|terraform[[:space:]]+apply' "$workflow"; then
            echo 'PROD observer contains forbidden mutation command.' >&2
            exit 1
          fi
          grep -F 'environment: prod' "$workflow"
          grep -F 'sameDigestFromTest:true' "$workflow"

      - name: Assert PROD Flux root does not own Namespace
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'namespace.yaml' enterprise-cicd/gitops/environments/prod/kustomization.yaml
          grep -F '"namespaceManagement": "arm"' enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/cluster.json
          grep -F '"namespaceManifestForbiddenInFluxRoot": true' enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/cluster.json

      - name: Assert PROD bootstrap avoids broken k8s-configuration CLI extension
        shell: bash
        run: |
          set -euo pipefail
          flux=enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/bootstrap-flux-aks-prod.sh
          if grep -F 'az k8s-configuration' "$flux"; then
            echo 'PROD Flux activation must use ARM REST, not the incompatible local k8s-configuration extension.' >&2
            exit 1
          fi
          grep -F 'api-version=${FLUX_API_VERSION}' "$flux"
          grep -F 'api-version=${MANAGED_NAMESPACE_API_VERSION}' "$flux"
