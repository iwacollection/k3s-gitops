name: Terraform Production Risk Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/**terraform**'

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Terraform validation placeholder
        run: |
          echo "Run terraform init/validate in target environment"

      - name: Production safety rules
        run: |
          echo "Require plan artifact, approval and reviewed apply"
