name: Terraform Production Risk Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/terraform/**'
      - '.github/workflows/**terraform**'

permissions:
  contents: read

jobs:
  risk-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Terraform validation
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform validate

      - name: Terraform plan
        run: |
          cd infrastructure/terraform
          terraform plan -out=tfplan

      - name: Convert plan to json
        run: |
          cd infrastructure/terraform
          terraform show -json tfplan > plan.json

      - name: Production risk analysis
        run: |
          python3 scripts/terraform/safety/plan-risk-analyzer.py infrastructure/terraform/plan.json

      - name: Block unsafe terraform settings
        run: |
          if grep -R "prevent_destroy[[:space:]]*=[[:space:]]*false" infrastructure/terraform; then
            echo "prevent_destroy=false is forbidden in production"
            exit 1
          fi

      - name: Production flow enforcement
        run: |
          echo "Required flow: plan artifact -> risk check -> approval -> apply approved plan"
