name: Azure TEST Identity Gate v2

on:
  workflow_dispatch:
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
    paths:
      - '.github/workflows/azure-test-identity-gate-v2.yml'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/azure-test-identity-gate-v2.yml'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'

permissions:
  contents: read
  id-token: write

jobs:
  test-identity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve TEST identity and artifact contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          RELEASE=enterprise-cicd/release-requests/platform-smoke-api-to-dev.json

          CLIENT_ID="$(jq -r '.environments.test.identities.githubOidc.clientId // empty' "$BINDING")"
          PRINCIPAL_ID="$(jq -r '.environments.test.identities.githubOidc.principalId // empty' "$BINDING")"
          TENANT_ID="$(jq -r '.environments.test.identities.githubOidc.tenantId // empty' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.test.identities.githubOidc.subscriptionId // empty' "$BINDING")"
          DEV_PRINCIPAL_ID="$(jq -r '.environments.dev.identities.githubOidc.principalId // empty' "$BINDING")"
          ARTIFACT_REPOSITORY="$(jq -r '.spec.artifactRepository' "$RELEASE")"
          ARTIFACT_DIGEST="$(jq -r '.spec.artifactDigest' "$RELEASE")"

          test -n "$CLIENT_ID"
          test -n "$PRINCIPAL_ID"
          test -n "$TENANT_ID"
          test -n "$SUBSCRIPTION_ID"
          test "$PRINCIPAL_ID" != "$DEV_PRINCIPAL_ID"
          test "$ARTIFACT_DIGEST" = 'sha256:b0faf7a8f90618cd7a6b081085d3af3ca666afa015aac9827f71cf198816e2ba'

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_repository=$ARTIFACT_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Azure login with TEST OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.contract.outputs.client_id }}
          tenant-id: ${{ steps.contract.outputs.tenant_id }}
          subscription-id: ${{ steps.contract.outputs.subscription_id }}

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Set non-admin AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: group-test
          cluster-name: k8s-test-cicd
          admin: 'false'
          use-kubelogin: 'true'

      - name: Prove TEST read-only boundary and artifact access
        id: verify
        shell: bash
        env:
          ACR_NAME: acrcicdc12c3a3699d8
          ARTIFACT_REPOSITORY: ${{ steps.contract.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ steps.contract.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p test-identity-gate

          DEPLOYMENT_READ="$(kubectl auth can-i get deployments.apps --namespace cicd-test 2>&1 || true)"
          ENDPOINT_READ="$(kubectl auth can-i get endpointslices.discovery.k8s.io --namespace cicd-test 2>&1 || true)"
          DEPLOYMENT_CREATE="$(kubectl auth can-i create deployments.apps --namespace cicd-test 2>&1 || true)"
          DEPLOYMENT_PATCH="$(kubectl auth can-i patch deployments.apps --namespace cicd-test 2>&1 || true)"
          DEPLOYMENT_DELETE="$(kubectl auth can-i delete deployments.apps --namespace cicd-test 2>&1 || true)"

          echo "deployment_read=$DEPLOYMENT_READ"
          echo "endpoint_read=$ENDPOINT_READ"
          echo "deployment_create=$DEPLOYMENT_CREATE"
          echo "deployment_patch=$DEPLOYMENT_PATCH"
          echo "deployment_delete=$DEPLOYMENT_DELETE"

          grep -Eq '^yes([[:space:]]|$)' <<<"$DEPLOYMENT_READ"
          grep -Eq '^yes([[:space:]]|$)' <<<"$ENDPOINT_READ"
          grep -Eq '^no([[:space:]-]|$)' <<<"$DEPLOYMENT_CREATE"
          grep -Eq '^no([[:space:]-]|$)' <<<"$DEPLOYMENT_PATCH"
          grep -Eq '^no([[:space:]-]|$)' <<<"$DEPLOYMENT_DELETE"

          ACR_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${ARTIFACT_REPOSITORY#*.azurecr.io/}@$ARTIFACT_DIGEST" --query digest -o tsv)"
          test "$ACR_DIGEST" = "$ARTIFACT_DIGEST"

          jq -n \
            --arg principalId '${{ steps.contract.outputs.principal_id }}' \
            --arg deploymentRead "$DEPLOYMENT_READ" \
            --arg endpointRead "$ENDPOINT_READ" \
            --arg deploymentCreate "$DEPLOYMENT_CREATE" \
            --arg deploymentPatch "$DEPLOYMENT_PATCH" \
            --arg deploymentDelete "$DEPLOYMENT_DELETE" \
            --arg digest "$ARTIFACT_DIGEST" \
            '{apiVersion:"platform.activation/v1",kind:"TestIdentityGate",metadata:{environment:"test"},spec:{passed:true,testOidcLogin:true,testPrincipalId:$principalId,namespace:"cicd-test",checks:{deploymentRead:$deploymentRead,endpointSliceRead:$endpointRead,deploymentCreate:$deploymentCreate,deploymentPatch:$deploymentPatch,deploymentDelete:$deploymentDelete,artifactDigest:$digest,artifactRead:true}}}' \
            > test-identity-gate/gate.json

          cat test-identity-gate/gate.json

      - name: Upload TEST identity gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-identity-gate-${{ github.run_id }}
          path: test-identity-gate/
          if-no-files-found: error
          retention-days: 90
