name: GitOps Platform Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/gitops/**'
      - 'enterprise-cicd/promotion/**'
      - 'enterprise-cicd/release-requests/**'
      - 'enterprise-cicd/release-catalog/**'
      - 'enterprise-cicd/activation/test/**'
      - 'enterprise-cicd/testing/contracts/validate_gitops_platform.py'
      - 'enterprise-cicd/testing/contracts/validate_test_activation.py'
      - '.github/workflows/gitops-promotion.yml'
      - '.github/workflows/azure-test-readiness-inventory.yml'
      - '.github/workflows/platform-smoke-test-observe.yml'
      - '.github/workflows/gitops-platform-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'enterprise-cicd/gitops/**'
      - 'enterprise-cicd/promotion/**'
      - 'enterprise-cicd/release-requests/**'
      - 'enterprise-cicd/activation/test/**'
      - 'enterprise-cicd/testing/contracts/validate_test_activation.py'
      - '.github/workflows/gitops-promotion.yml'
      - '.github/workflows/azure-test-readiness-inventory.yml'
      - '.github/workflows/platform-smoke-test-observe.yml'

permissions:
  contents: read

jobs:
  validate-gitops-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitOps control contracts
        run: python enterprise-cicd/testing/contracts/validate_gitops_platform.py

      - name: Validate TEST activation contracts
        run: python enterprise-cicd/testing/contracts/validate_test_activation.py

      - name: Compile promotion and TEST activation validators
        run: python -m py_compile enterprise-cicd/promotion/render_gitops_overlay.py enterprise-cicd/release-catalog/render_release.py enterprise-cicd/testing/contracts/validate_test_activation.py

      - name: Validate guarded Flux and TEST activation script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n enterprise-cicd/gitops/clusters/aks-automatic-lab/bootstrap-flux-aks.sh
          bash -n enterprise-cicd/gitops/clusters/aks-automatic-lab-test/bootstrap-flux-aks-test.sh
          bash -n enterprise-cicd/activation/test/bootstrap-test-identity.sh

      - name: Render governed DEV promotion fixture
        shell: bash
        run: |
          set -euo pipefail
          python enterprise-cicd/promotion/render_gitops_overlay.py \
            --request enterprise-cicd/release-requests/go-smoke-to-dev.example.json

          kubectl kustomize enterprise-cicd/gitops/environments/dev > /tmp/gitops-dev.yaml
          grep -F 'example.azurecr.io/go-smoke@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' /tmp/gitops-dev.yaml
          grep -F 'namespace: cicd-dev' /tmp/gitops-dev.yaml

      - name: Ensure promotion changes Git only
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/gitops-promotion.yml
          if grep -nE 'kubectl[[:space:]]+apply|helm[[:space:]]+(upgrade|install)|az[[:space:]]+aks[[:space:]]+get-credentials' "$workflow"; then
            echo 'Promotion workflow must not directly deploy to AKS.' >&2
            exit 1
          fi
          grep -F 'gh pr create' "$workflow"
