name: Platform Build Images Publish

on:
  workflow_dispatch:
    inputs:
      acr_name:
        description: Target Azure Container Registry name without azurecr.io
        required: true
        type: string
      github_environment:
        description: Protected GitHub Environment mapped to the platform OIDC binding
        required: true
        default: dev
        type: string
      confirm_publish:
        description: Explicitly allow immutable platform build images to be pushed
        required: true
        default: false
        type: boolean
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
    paths:
      - enterprise-cicd/activation/requests/platform-build-images-dev.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      acr_name: ${{ steps.request.outputs.acr_name }}
      github_environment: ${{ steps.request.outputs.github_environment }}
      confirm_publish: ${{ steps.request.outputs.confirm_publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve audited activation request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACR_NAME: ${{ inputs.acr_name }}
          INPUT_ENVIRONMENT: ${{ inputs.github_environment }}
          INPUT_CONFIRM: ${{ inputs.confirm_publish }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            REQUEST=enterprise-cicd/activation/requests/platform-build-images-dev.json
            test -f "$REQUEST"
            ACR_NAME="$(jq -r '.acrName // empty' "$REQUEST")"
            PLATFORM_ENVIRONMENT="$(jq -r '.githubEnvironment // empty' "$REQUEST")"
            CONFIRM="$(jq -r '.confirmPublish // false' "$REQUEST")"
            REQUEST_ID="$(jq -r '.requestId // empty' "$REQUEST")"
            test -n "$REQUEST_ID"
          else
            ACR_NAME="$INPUT_ACR_NAME"
            PLATFORM_ENVIRONMENT="$INPUT_ENVIRONMENT"
            CONFIRM="$INPUT_CONFIRM"
          fi
          test -n "$ACR_NAME"
          case "$PLATFORM_ENVIRONMENT" in dev|test|prod) ;; *) echo "Unsupported environment: $PLATFORM_ENVIRONMENT" >&2; exit 1 ;; esac
          test "$CONFIRM" = "true"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "github_environment=$PLATFORM_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "confirm_publish=true" >> "$GITHUB_OUTPUT"

  preflight:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate build image catalog before Azure access
        shell: bash
        run: python enterprise-cicd/activation/validate_readiness.py

  publish:
    if: ${{ needs.resolve.outputs.confirm_publish == 'true' }}
    needs:
      - resolve
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve.outputs.github_environment }}
    strategy:
      fail-fast: false
      matrix:
        image_key:
          - java21-maven:v1
          - python-uv:v1
          - go-builder:v1
          - cpp-cmake-conan:v1
    steps:
      - uses: actions/checkout@v4

      - name: Resolve governed OIDC identity
        id: auth
        shell: bash
        env:
          PLATFORM_ENVIRONMENT: ${{ needs.resolve.outputs.github_environment }}
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          CLIENT_ID="$(jq -r --arg env "$PLATFORM_ENVIRONMENT" '.environments[$env].identities.githubOidc.clientId // empty' "$BINDING")"
          TENANT_ID="$(jq -r --arg env "$PLATFORM_ENVIRONMENT" '.environments[$env].identities.githubOidc.tenantId // empty' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r --arg env "$PLATFORM_ENVIRONMENT" '.environments[$env].identities.githubOidc.subscriptionId // empty' "$BINDING")"
          PRINCIPAL_ID="$(jq -r --arg env "$PLATFORM_ENVIRONMENT" '.environments[$env].identities.githubOidc.principalId // empty' "$BINDING")"
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID" && test -n "$PRINCIPAL_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.auth.outputs.client_id }}
          tenant-id: ${{ steps.auth.outputs.tenant_id }}
          subscription-id: ${{ steps.auth.outputs.subscription_id }}

      - name: Resolve immutable image contract
        id: image
        shell: bash
        env:
          IMAGE_KEY: ${{ matrix.image_key }}
          ACR_NAME: ${{ needs.resolve.outputs.acr_name }}
        run: |
          set -euo pipefail
          CATALOG=enterprise-cicd/build-images/versions.json
          CONTEXT="$(jq -r --arg key "$IMAGE_KEY" '.images[$key].context // empty' "$CATALOG")"
          DOCKERFILE="$(jq -r --arg key "$IMAGE_KEY" '.images[$key].dockerfile // "Dockerfile"' "$CATALOG")"
          NAME="${IMAGE_KEY%:*}"
          VERSION="${IMAGE_KEY##*:}"
          REPOSITORY="build/${NAME}"
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          test -n "$CONTEXT" && test -f "$CONTEXT/$DOCKERFILE"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Refuse mutable overwrite
        shell: bash
        env:
          ACR_NAME: ${{ needs.resolve.outputs.acr_name }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          if az acr repository show --name "$ACR_NAME" --image "$REPOSITORY:$VERSION" >/dev/null 2>&1; then
            echo "Immutable platform image already exists: $REPOSITORY:$VERSION" >&2
            exit 1
          fi

      - name: Build and push versioned platform image
        shell: bash
        env:
          ACR_NAME: ${{ needs.resolve.outputs.acr_name }}
          LOGIN_SERVER: ${{ steps.image.outputs.login_server }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
          CONTEXT: ${{ steps.image.outputs.context }}
          DOCKERFILE: ${{ steps.image.outputs.dockerfile }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          IMAGE="$LOGIN_SERVER/$REPOSITORY:$VERSION"
          docker build --pull --file "$CONTEXT/$DOCKERFILE" --tag "$IMAGE" "$CONTEXT"
          docker push "$IMAGE"

      - name: Record immutable digest evidence
        shell: bash
        env:
          ACR_NAME: ${{ needs.resolve.outputs.acr_name }}
          LOGIN_SERVER: ${{ steps.image.outputs.login_server }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          DIGEST="$(az acr repository show --name "$ACR_NAME" --image "$REPOSITORY:$VERSION" --query digest -o tsv)"
          test -n "$DIGEST"
          {
            echo '## Published platform build image'
            echo "- Image: \`$LOGIN_SERVER/$REPOSITORY:$VERSION\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Azure principal: \`${{ steps.auth.outputs.principal_id }}\`"
            echo '- Mutable overwrite: forbidden'
          } >> "$GITHUB_STEP_SUMMARY"
