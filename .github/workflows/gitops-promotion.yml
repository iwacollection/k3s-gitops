name: GitOps Promotion

on:
  workflow_dispatch:
    inputs:
      release_request:
        description: Real committed release request under enterprise-cicd/release-requests/; example files are forbidden
        required: true
        type: string
  workflow_call:
    inputs:
      release_request:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gitops-promotion-${{ inputs.release_request }}
  cancel-in-progress: false

jobs:
  render-and-open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release-control source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release request and immutable promotion lineage
        id: request
        shell: bash
        env:
          REQUEST: ${{ inputs.release_request }}
        run: |
          set -euo pipefail
          case "$REQUEST" in
            enterprise-cicd/release-requests/*.example.json)
              echo "Example Release Requests are documentation fixtures and cannot be promoted." >&2
              exit 1
              ;;
            enterprise-cicd/release-requests/*.json) ;;
            *)
              echo "Release request must be a committed JSON file under enterprise-cicd/release-requests/." >&2
              exit 1
              ;;
          esac

          test -f "$REQUEST"
          test "$(jq -r .apiVersion "$REQUEST")" = "platform.release/v1"
          test "$(jq -r .kind "$REQUEST")" = "Release"

          DIGEST="$(jq -r .spec.artifactDigest "$REQUEST")"
          REPOSITORY="$(jq -r .spec.artifactRepository "$REQUEST")"
          FROM="$(jq -r .spec.from "$REQUEST")"
          ENVIRONMENT="$(jq -r .spec.to "$REQUEST")"
          APPLICATION="$(jq -r .metadata.application "$REQUEST")"
          PROFILE="$(jq -r .spec.releaseProfile "$REQUEST")"
          SOURCE_REQUEST="$(jq -r '.spec.sourceReleaseRequest // empty' "$REQUEST")"

          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          case "${FROM}->${ENVIRONMENT}" in
            build->dev|dev->test|test->prod) ;;
            *) echo "Unsupported promotion transition: ${FROM}->${ENVIRONMENT}" >&2; exit 1 ;;
          esac

          case "$ENVIRONMENT" in
            dev) BASE_BRANCH="gitops/dev" ;;
            test) BASE_BRANCH="gitops/test" ;;
            prod) BASE_BRANCH="gitops/prod" ;;
            *) echo "Unsupported environment: $ENVIRONMENT" >&2; exit 1 ;;
          esac

          if [[ "$FROM" == "build" ]]; then
            if [[ -n "$SOURCE_REQUEST" ]]; then
              echo "build->dev must not declare sourceReleaseRequest." >&2
              exit 1
            fi
          else
            case "$SOURCE_REQUEST" in
              enterprise-cicd/release-requests/*.example.json|"")
                echo "${FROM}->${ENVIRONMENT} requires a real sourceReleaseRequest." >&2
                exit 1
                ;;
              enterprise-cicd/release-requests/*.json) ;;
              *) echo "Invalid sourceReleaseRequest path: $SOURCE_REQUEST" >&2; exit 1 ;;
            esac

            test -f "$SOURCE_REQUEST"
            SOURCE_APP="$(jq -r .metadata.application "$SOURCE_REQUEST")"
            SOURCE_TO="$(jq -r .spec.to "$SOURCE_REQUEST")"
            SOURCE_REPOSITORY="$(jq -r .spec.artifactRepository "$SOURCE_REQUEST")"
            SOURCE_DIGEST="$(jq -r .spec.artifactDigest "$SOURCE_REQUEST")"

            test "$SOURCE_APP" = "$APPLICATION"
            test "$SOURCE_TO" = "$FROM"
            test "$SOURCE_REPOSITORY" = "$REPOSITORY"
            test "$SOURCE_DIGEST" = "$DIGEST"

            echo "Immutable lineage verified: ${SOURCE_REQUEST} -> ${REQUEST}"
            echo "Repository: ${REPOSITORY}"
            echo "Digest: ${DIGEST}"
          fi

          cp "$REQUEST" /tmp/release-request.json
          echo "application=$APPLICATION" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Switch to protected desired-state baseline
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.request.outputs.base_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "origin/$BASE_BRANCH"
          test -z "$(git status --porcelain)"

      - name: Render governed GitOps desired state
        shell: bash
        env:
          ORIGINAL_REQUEST: ${{ inputs.release_request }}
          APP: ${{ steps.request.outputs.application }}
          ENVIRONMENT: ${{ steps.request.outputs.environment }}
        run: |
          set -euo pipefail
          python enterprise-cicd/promotion/render_gitops_overlay.py --request /tmp/release-request.json
          EVIDENCE="enterprise-cicd/gitops/environments/$ENVIRONMENT/apps/$APP/release-evidence.json"
          test -f "$EVIDENCE"
          jq --arg source "$ORIGINAL_REQUEST" '.spec.sourceRequest = $source' "$EVIDENCE" > /tmp/release-evidence.json
          mv /tmp/release-evidence.json "$EVIDENCE"

      - name: Render Kustomize and enforce immutable image
        shell: bash
        env:
          ENVIRONMENT: ${{ steps.request.outputs.environment }}
          DIGEST: ${{ steps.request.outputs.digest }}
        run: |
          set -euo pipefail
          kubectl kustomize "enterprise-cicd/gitops/environments/$ENVIRONMENT" > /tmp/rendered.yaml
          grep -F "$DIGEST" /tmp/rendered.yaml
          if grep -nE 'image: .*:latest([[:space:]]|$)' /tmp/rendered.yaml; then
            echo "Mutable latest image is forbidden in GitOps desired state." >&2
            exit 1
          fi

      - name: Open protected GitOps pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.request.outputs.application }}
          ENVIRONMENT: ${{ steps.request.outputs.environment }}
          DIGEST: ${{ steps.request.outputs.digest }}
          PROFILE: ${{ steps.request.outputs.profile }}
          REQUEST: ${{ inputs.release_request }}
          BASE_BRANCH: ${{ steps.request.outputs.base_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- enterprise-cicd/gitops; then
            echo "GitOps desired state already matches this release request."
            exit 0
          fi
          branch="gitops/${APP}/${ENVIRONMENT}/${GITHUB_RUN_ID}"
          git config user.name "enterprise-cicd-bot"
          git config user.email "enterprise-cicd-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add enterprise-cicd/gitops
          git commit -m "chore(gitops): promote ${APP} to ${ENVIRONMENT}"
          git push origin "$branch"
          cat > /tmp/gitops-pr.md <<EOF
          ## Governed GitOps promotion

          - Application: \`${APP}\`
          - Target environment: \`${ENVIRONMENT}\`
          - Desired-state branch: \`${BASE_BRANCH}\`
          - Artifact digest: \`${DIGEST}\`
          - Release profile: \`${PROFILE}\`
          - Source request: \`${REQUEST}\`

          This PR changes Git desired state only. The build/promotion job has no direct Kubernetes deployment path.
          EOF
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title "chore(gitops): promote ${APP} to ${ENVIRONMENT}" --body-file /tmp/gitops-pr.md
