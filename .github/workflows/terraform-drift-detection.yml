name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift-check:
    uses: ./.github/workflows/terraform-reusable-enterprise.yml
    with:
      working_directory: infrastructure/terraform/environments/dev
      command: plan
