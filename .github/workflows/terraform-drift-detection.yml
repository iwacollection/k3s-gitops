name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init

      - name: Terraform Refresh Plan
        working-directory: infrastructure/terraform/environments/dev
        run: terraform plan -refresh-only -out=drift.tfplan

      - name: Export Drift Report
        working-directory: infrastructure/terraform/environments/dev
        run: terraform show -json drift.tfplan > drift-plan.json

      - name: Detect Drift
        run: bash scripts/terraform/drift-detection-check.sh infrastructure/terraform/environments/dev/drift-plan.json
