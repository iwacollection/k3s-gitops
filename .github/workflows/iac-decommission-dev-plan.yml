name: IaC DEV Decommission Plan

on:
  pull_request:
    paths:
      - 'enterprise-cicd/iac-decommission/dev/**.json'
      - 'enterprise-cicd/iac-decommission/validate_decommission.py'
      - '.github/workflows/iac-decommission-dev-plan.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tombstones: ${{ steps.changed.outputs.tombstones }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Discover added DEV standard-resource tombstones only
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from pathlib import Path
          rows=subprocess.check_output(['git','diff','--name-status',os.environ['BASE_SHA'],os.environ['HEAD_SHA']],text=True).splitlines()
          standard={'managed-identity','network'}
          tombstones=[]
          for row in rows:
              parts=row.split('\t'); status,path=parts[0],parts[-1]
              if not path.startswith('enterprise-cicd/iac-decommission/dev/') or not path.endswith('.json'):
                  continue
              if status != 'A':
                  raise SystemExit(f'decommission tombstones are append-only: status={status} path={path}')
              data=json.loads(Path(path).read_text())
              service=(data.get('spec') or {}).get('service')
              if service in standard:
                  tombstones.append(path)
              else:
                  print(f'protected DEV service delegated to IaC Protected Decommission Plan: service={service} path={path}',file=__import__('sys').stderr)
          print('tombstones='+json.dumps(sorted(tombstones),separators=(',',':')))
          print('count='+str(len(tombstones)))
          PY

  binding-gate:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.binding.outputs.client_id }}
      tenant_id: ${{ steps.binding.outputs.tenant_id }}
      subscription_id: ${{ steps.binding.outputs.subscription_id }}
      state_rg: ${{ steps.binding.outputs.state_rg }}
      state_storage: ${{ steps.binding.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4
      - name: Require activated DEV Plan identity
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          B=enterprise-cicd/contracts/iac-runtime-bindings.json
          test "$(jq -r '.environments.dev.activationStatus' "$B")" = ready
          test "$(jq -r '.environments.dev.plan.githubEnvironment' "$B")" = iac-dev-plan
          test "$(jq -r '.environments.dev.plan.resourceWriteAccess' "$B")" = false
          test "$(jq -r '.environments.dev.plan.stateDataRole' "$B")" = 'Storage Blob Data Contributor'
          test "$(jq -r '.environments.dev.plan.stateScope' "$B")" = container
          test "$(jq -r '.state.sharedKeyAccess' "$B")" = false
          echo "client_id=$(jq -r '.environments.dev.plan.clientId' "$B")" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$(jq -r '.azure.tenantId // .environments.dev.plan.tenantId' "$B")" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$(jq -r '.azure.subscriptionId // .environments.dev.plan.subscriptionId' "$B")" >> "$GITHUB_OUTPUT"
          echo "state_rg=$(jq -r '.state.resourceGroup' "$B")" >> "$GITHUB_OUTPUT"
          echo "state_storage=$(jq -r '.state.storageAccount' "$B")" >> "$GITHUB_OUTPUT"

  destroy-plan:
    needs: [discover, binding-gate]
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        tombstone: ${{ fromJSON(needs.discover.outputs.tombstones) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: iac-dev-plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.binding-gate.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.binding-gate.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.binding-gate.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.binding-gate.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.binding-gate.outputs.state_storage }}
      TOMBSTONE: ${{ matrix.tombstone }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate immutable tombstone and resolve original request
        id: decom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-decommission-plan
          python enterprise-cicd/iac-decommission/validate_decommission.py --tombstone "$TOMBSTONE" --original-output /tmp/iac-decommission-plan/original-request.json --metadata-output /tmp/iac-decommission-plan/metadata.json
          SERVICE="$(jq -r '.service' /tmp/iac-decommission-plan/metadata.json)"
          case "$SERVICE" in managed-identity|network) ;; *) echo "protected service must not enter DEV standard decommission: $SERVICE" >&2; exit 1;; esac
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "request_name=$(jq -r '.requestName' /tmp/iac-decommission-plan/metadata.json)" >> "$GITHUB_OUTPUT"
          echo "stack=$(jq -r '.rootStack' /tmp/iac-decommission-plan/metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v3
        with:
          client-id: ${{ needs.binding-gate.outputs.client_id }}
          tenant-id: ${{ needs.binding-gate.outputs.tenant_id }}
          subscription-id: ${{ needs.binding-gate.outputs.subscription_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Render state and prove exclusive resource-group ownership
        env:
          STACK: ${{ steps.decom.outputs.stack }}
        shell: bash
        run: |
          set -euo pipefail
          python enterprise-cicd/iac-catalog/render_request.py --request /tmp/iac-decommission-plan/original-request.json --output /tmp/iac-decommission-plan/request.tfvars.json
          python enterprise-cicd/terraform/state/render_backend.py --scope catalog --environment dev --service '${{ steps.decom.outputs.service }}' --request '${{ steps.decom.outputs.request_name }}' --auth oidc --output /tmp/iac-decommission-plan/backend.hcl
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config=/tmp/iac-decommission-plan/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" show -json > /tmp/iac-decommission-plan/current-state.json
          RG="$(jq -r '.resource_group_name' /tmp/iac-decommission-plan/request.tfvars.json)"
          az group show -n "$RG" -o json > /tmp/iac-decommission-plan/resource-group.json
          az resource list -g "$RG" -o json > /tmp/iac-decommission-plan/azure-resources.json
          python - <<'PY' | tee /tmp/iac-decommission-plan/ownership-summary.json
          import json
          meta=json.load(open('/tmp/iac-decommission-plan/metadata.json')); state=json.load(open('/tmp/iac-decommission-plan/current-state.json')); rg=json.load(open('/tmp/iac-decommission-plan/resource-group.json')); azure=json.load(open('/tmp/iac-decommission-plan/azure-resources.json'))
          ids=set()
          def walk(m):
              for r in m.get('resources',[]):
                  rid=(r.get('values') or {}).get('id')
                  if rid: ids.add(rid.lower())
              for c in m.get('child_modules',[]): walk(c)
          walk(((state.get('values') or {}).get('root_module') or {}))
          if (rg.get('tags') or {}).get('iac_request') != meta['requestName']: raise SystemExit('resource group ownership tag mismatch')
          foreign=sorted(x['id'] for x in azure if x.get('id') and x['id'].lower() not in ids)
          if foreign: raise SystemExit(f'foreign Azure resources block resource-group decommission: {foreign}')
          print(json.dumps({'request':meta['requestName'],'resourceGroup':rg['name'],'foreignResources':[],'ownershipSafeForDestroyPlan':True},indent=2))
          PY
      - name: Generate locked destroy-only plan
        env:
          STACK: ${{ steps.decom.outputs.stack }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" plan -destroy -lock=true -lock-timeout=5m -input=false -var-file=/tmp/iac-decommission-plan/request.tfvars.json -out=/tmp/iac-decommission-plan/destroy.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-decommission-plan/destroy.tfplan > /tmp/iac-decommission-plan/plan.json
          python - <<'PY' | tee /tmp/iac-decommission-plan/plan-summary.json
          import json
          m=json.load(open('/tmp/iac-decommission-plan/metadata.json')); p=json.load(open('/tmp/iac-decommission-plan/plan.json')); changes=[]
          for rc in p.get('resource_changes',[]):
              a=rc.get('change',{}).get('actions',[])
              if a != ['no-op']: changes.append({'address':rc.get('address'),'actions':a})
          if not changes: raise SystemExit('decommission tombstone is stale: remote state has no resources to destroy')
          invalid=[x for x in changes if x['actions'] != ['delete']]
          if invalid: raise SystemExit(f'decommission plan must be delete-only: {invalid}')
          print(json.dumps({'request':m['requestName'],'service':m['service'],'changeTicket':m['changeTicket'],'changes':changes,'destroyOnly':True,'resourceMutationAllowed':False,'automaticApply':False,'status':'approved-for-decommission-review'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: iac-dev-decommission-plan-${{ steps.decom.outputs.request_name }}
          path: /tmp/iac-decommission-plan
          if-no-files-found: error
          retention-days: 90
