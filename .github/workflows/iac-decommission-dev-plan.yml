name: IaC DEV Decommission Plan

on:
  pull_request:
    paths:
      - 'enterprise-cicd/iac-decommission/dev/**.json'
      - 'enterprise-cicd/iac-decommission/validate_decommission.py'
      - '.github/workflows/iac-decommission-dev-plan.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      tombstones: ${{ steps.changed.outputs.tombstones }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Discover added DEV decommission tombstones
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          rows = subprocess.check_output(
              ['git', 'diff', '--name-status', f"{os.environ['BASE_SHA']}...HEAD"], text=True
          ).splitlines()
          tombstones = []
          for row in rows:
              parts = row.split('\t')
              status, path = parts[0], parts[-1]
              if path.startswith('enterprise-cicd/iac-decommission/dev/') and path.endswith('.json'):
                  if status != 'A':
                      raise SystemExit(f'decommission tombstones are append-only: status={status} path={path}')
                  tombstones.append(path)
          print('tombstones=' + json.dumps(sorted(tombstones), separators=(',', ':')))
          print('count=' + str(len(tombstones)))
          PY

  binding-gate:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.binding.outputs.client_id }}
      tenant_id: ${{ steps.binding.outputs.tenant_id }}
      subscription_id: ${{ steps.binding.outputs.subscription_id }}
      state_rg: ${{ steps.binding.outputs.state_rg }}
      state_storage: ${{ steps.binding.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4
      - name: Require activated DEV Plan identity
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/iac-runtime-bindings.json
          test "$(jq -r '.environments.dev.activationStatus' "$BINDING")" = ready
          test "$(jq -r '.environments.dev.plan.githubEnvironment' "$BINDING")" = iac-dev-plan
          test "$(jq -r '.environments.dev.plan.resourceWriteAccess' "$BINDING")" = false
          test "$(jq -r '.environments.dev.plan.stateDataRole' "$BINDING")" = 'Storage Blob Data Contributor'
          test "$(jq -r '.environments.dev.plan.stateScope' "$BINDING")" = container
          test "$(jq -r '.state.sharedKeyAccess' "$BINDING")" = false
          echo "client_id=$(jq -r '.environments.dev.plan.clientId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$(jq -r '.environments.dev.plan.tenantId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$(jq -r '.environments.dev.plan.subscriptionId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "state_rg=$(jq -r '.state.resourceGroup' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "state_storage=$(jq -r '.state.storageAccount' "$BINDING")" >> "$GITHUB_OUTPUT"

  destroy-plan:
    needs: [discover, binding-gate]
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix:
        tombstone: ${{ fromJSON(needs.discover.outputs.tombstones) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: iac-dev-plan
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.binding-gate.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.binding-gate.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.binding-gate.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.binding-gate.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.binding-gate.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate immutable tombstone and resolve original request
        id: decom
        shell: bash
        env:
          TOMBSTONE: ${{ matrix.tombstone }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-decommission-plan
          python enterprise-cicd/iac-decommission/validate_decommission.py \
            --tombstone "$TOMBSTONE" \
            --original-output /tmp/iac-decommission-plan/original-request.json \
            --metadata-output /tmp/iac-decommission-plan/metadata.json
          echo "service=$(jq -r '.service' /tmp/iac-decommission-plan/metadata.json)" >> "$GITHUB_OUTPUT"
          echo "request_name=$(jq -r '.requestName' /tmp/iac-decommission-plan/metadata.json)" >> "$GITHUB_OUTPUT"
          echo "stack=$(jq -r '.rootStack' /tmp/iac-decommission-plan/metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Azure login using dedicated IaC Plan OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ needs.binding-gate.outputs.client_id }}
          tenant-id: ${{ needs.binding-gate.outputs.tenant_id }}
          subscription-id: ${{ needs.binding-gate.outputs.subscription_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Render retired request and Entra-only remote backend
        shell: bash
        run: |
          set -euo pipefail
          python enterprise-cicd/iac-catalog/render_request.py \
            --request /tmp/iac-decommission-plan/original-request.json \
            --output /tmp/iac-decommission-plan/request.tfvars.json
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog \
            --environment dev \
            --service '${{ steps.decom.outputs.service }}' \
            --request '${{ steps.decom.outputs.request_name }}' \
            --auth oidc \
            --output /tmp/iac-decommission-plan/backend.hcl

      - name: Initialize state and reject foreign resource-group ownership
        shell: bash
        env:
          STACK: ${{ steps.decom.outputs.stack }}
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" init -reconfigure -input=false \
            -backend-config=/tmp/iac-decommission-plan/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" show -json > /tmp/iac-decommission-plan/current-state.json
          RG="$(jq -r '.resource_group_name' /tmp/iac-decommission-plan/request.tfvars.json)"
          az group show --name "$RG" -o json > /tmp/iac-decommission-plan/resource-group.json
          az resource list --resource-group "$RG" -o json > /tmp/iac-decommission-plan/azure-resources.json
          python - <<'PY' | tee /tmp/iac-decommission-plan/ownership-summary.json
          import json

          metadata = json.load(open('/tmp/iac-decommission-plan/metadata.json'))
          state = json.load(open('/tmp/iac-decommission-plan/current-state.json'))
          rg = json.load(open('/tmp/iac-decommission-plan/resource-group.json'))
          azure = json.load(open('/tmp/iac-decommission-plan/azure-resources.json'))

          ids = set()
          def walk(module):
              for resource in module.get('resources', []):
                  value = (resource.get('values') or {}).get('id')
                  if value:
                      ids.add(value.lower())
              for child in module.get('child_modules', []):
                  walk(child)
          root = ((state.get('values') or {}).get('root_module') or {})
          walk(root)

          foreign = sorted(
              item['id'] for item in azure
              if item.get('id') and item['id'].lower() not in ids
          )
          tags = rg.get('tags') or {}
          if tags.get('iac_request') != metadata['requestName']:
              raise SystemExit(
                  f"resource group ownership tag mismatch: expected={metadata['requestName']} actual={tags.get('iac_request')}"
              )
          if foreign:
              raise SystemExit(f'foreign Azure resources block resource-group decommission: {foreign}')

          print(json.dumps({
              'request': metadata['requestName'],
              'resourceGroup': rg['name'],
              'terraformResourceIds': len(ids),
              'azureTopLevelResources': len(azure),
              'foreignResources': [],
              'ownershipSafeForDestroyPlan': True
          }, indent=2))
          PY

      - name: Generate locked destroy-only plan
        shell: bash
        env:
          STACK: ${{ steps.decom.outputs.stack }}
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" plan \
            -destroy \
            -lock=true \
            -lock-timeout=5m \
            -input=false \
            -var-file=/tmp/iac-decommission-plan/request.tfvars.json \
            -out=/tmp/iac-decommission-plan/destroy.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-decommission-plan/destroy.tfplan \
            > /tmp/iac-decommission-plan/plan.json

      - name: Require non-empty delete-only plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/iac-decommission-plan/plan-summary.json
          import json
          metadata = json.load(open('/tmp/iac-decommission-plan/metadata.json'))
          plan = json.load(open('/tmp/iac-decommission-plan/plan.json'))
          changes = []
          for rc in plan.get('resource_changes', []):
              actions = rc.get('change', {}).get('actions', [])
              if actions != ['no-op']:
                  changes.append({'address': rc.get('address'), 'actions': actions})
          if not changes:
              raise SystemExit('decommission tombstone is stale: remote state has no resources to destroy')
          invalid = [x for x in changes if x['actions'] != ['delete']]
          if invalid:
              raise SystemExit(f'decommission plan must be delete-only: {invalid}')
          print(json.dumps({
              'request': metadata['requestName'],
              'service': metadata['service'],
              'changeTicket': metadata['changeTicket'],
              'changes': changes,
              'destroyOnly': True,
              'authorizedByImmutableTombstone': True,
              'resourceMutationAllowed': False,
              'automaticApply': False,
              'status': 'approved-for-decommission-review'
          }, indent=2))
          PY

      - name: Publish decommission Plan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iac-dev-decommission-plan-${{ steps.decom.outputs.request_name }}
          path: /tmp/iac-decommission-plan
          if-no-files-found: error
          retention-days: 90

  plan-gate:
    if: ${{ always() }}
    needs: [discover, binding-gate, destroy-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Require governed destroy-only Plan
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ needs.discover.outputs.count }}' = '0' ]; then
            echo 'No added DEV decommission tombstone requires a destroy Plan.'
            exit 0
          fi
          test '${{ needs.binding-gate.result }}' = success
          test '${{ needs.destroy-plan.result }}' = success
