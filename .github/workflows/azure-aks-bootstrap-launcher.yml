name: azure-aks-bootstrap-launcher

on:
  workflow_dispatch:
    inputs:
      azure_client_id:
        description: User-assigned managed identity client ID
        required: true
        type: string
      azure_tenant_id:
        description: Azure tenant ID
        required: true
        type: string
      azure_subscription_id:
        description: Azure subscription ID
        required: true
        type: string
      azure_acr_name:
        description: ACR name without azurecr.io
        required: true
        type: string
      source_ref:
        description: Source branch/ref containing pipeline implementation
        required: true
        default: feature/azure-enterprise-cicd-bootstrap-v1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-aks-bootstrap-cicd-dev
  cancel-in-progress: false

env:
  RESOURCE_GROUP: group-test
  AKS_CLUSTER: k8s-test-cicd
  NAMESPACE: cicd-dev
  IMAGE_NAME: enterprise-cicd-smoke
  HELM_RELEASE: enterprise-cicd-smoke
  CHART_PATH: enterprise-cicd/helm/smoke-service
  BUILD_CONTEXT: enterprise-cicd/examples/go-service

jobs:
  end-to-end-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout implementation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Login to ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name '${{ inputs.azure_acr_name }}'

      - name: Build and push immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_SERVER="${{ inputs.azure_acr_name }}.azurecr.io"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE="${LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"

          docker build \
            --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE" \
            "$BUILD_CONTEXT"
          docker push "$IMAGE"

          DIGEST="$(az acr repository show \
            --name '${{ inputs.azure_acr_name }}' \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --query digest -o tsv)"

          echo "repository=${LOGIN_SERVER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - name: Set AKS context as non-admin
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Verify deployment permission
        shell: bash
        run: |
          set -euo pipefail
          test "$(kubectl auth can-i create deployments.apps --namespace "$NAMESPACE")" = "yes"

      - name: Helm deploy exact image
        shell: bash
        run: |
          set -euo pipefail
          helm lint "$CHART_PATH"
          helm upgrade --install "$HELM_RELEASE" "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --atomic \
            --wait \
            --timeout 5m \
            --set-string image.repository='${{ steps.image.outputs.repository }}' \
            --set-string image.tag='${{ steps.image.outputs.tag }}'

      - name: Verify rollout
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/$HELM_RELEASE --namespace "$NAMESPACE" --timeout=180s
          kubectl get deployment,pod,service --namespace "$NAMESPACE" -l app.kubernetes.io/instance=$HELM_RELEASE -o wide
          echo "image_digest=${{ steps.image.outputs.digest }}"
