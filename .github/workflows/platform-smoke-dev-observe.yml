name: Platform Smoke DEV Observe

on:
  pull_request:
    paths:
      - '.github/workflows/platform-smoke-dev-observe.yml'
      - 'enterprise-cicd/activation/requests/platform-smoke-dev-observation.json'

permissions:
  contents: read
  id-token: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Resolve governed DEV observation contract
        id: target
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=enterprise-cicd/activation/requests/platform-smoke-dev-observation.json
          test -f "$REQUEST"
          BINDING="$(jq -r .clusterBinding "$REQUEST")"
          test -f "$BINDING"
          test "$(jq -r .environment "$REQUEST")" = dev
          test "$(jq -r .metadata.environment "$BINDING")" = dev
          test "$(jq -r .spec.flux.branch "$BINDING")" = gitops/dev
          DIGEST="$(jq -r .artifactDigest "$REQUEST")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "resource_group=$(jq -r .spec.azure.resourceGroup "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "cluster=$(jq -r .spec.azure.clusterName "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "flux_name=$(jq -r .spec.flux.configurationName "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "application=$(jq -r .application "$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "repository=$(jq -r .artifactRepository "$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "gitops_commit=$(jq -r .gitopsCommit "$REQUEST")" >> "$GITHUB_OUTPUT"

      - name: Resolve DEV OIDC identity
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          echo "client_id=$(jq -r '.environments.dev.identities.githubOidc.clientId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$(jq -r '.environments.dev.identities.githubOidc.tenantId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$(jq -r '.environments.dev.identities.githubOidc.subscriptionId' "$BINDING")" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.auth.outputs.client_id }}
          tenant-id: ${{ steps.auth.outputs.tenant_id }}
          subscription-id: ${{ steps.auth.outputs.subscription_id }}

      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Set read-only AKS context
        shell: bash
        env:
          RG: ${{ steps.target.outputs.resource_group }}
          CLUSTER: ${{ steps.target.outputs.cluster }}
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$RG" --name "$CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl auth can-i get deployments --namespace cicd-dev | grep -qx yes
          kubectl auth can-i get endpointslices.discovery.k8s.io --namespace cicd-dev | grep -qx yes

      - name: Wait for Flux and exact deployed digest
        shell: bash
        env:
          SUBSCRIPTION_ID: ${{ steps.auth.outputs.subscription_id }}
          RG: ${{ steps.target.outputs.resource_group }}
          CLUSTER: ${{ steps.target.outputs.cluster }}
          FLUX_NAME: ${{ steps.target.outputs.flux_name }}
          APP: ${{ steps.target.outputs.application }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          DIGEST: ${{ steps.target.outputs.digest }}
          GITOPS_COMMIT: ${{ steps.target.outputs.gitops_commit }}
        run: |
          set -euo pipefail
          mkdir -p platform-observation
          FLUX_URL="https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.ContainerService/managedClusters/$CLUSTER/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/$FLUX_NAME?api-version=2025-04-01"
          expected_image="$REPOSITORY@$DIGEST"
          passed=false
          for i in $(seq 1 60); do
            flux_json="$(az rest --method get --url "$FLUX_URL" -o json)"
            compliance="$(jq -r '.properties.complianceState // empty' <<<"$flux_json")"
            synced="$(jq -r '.properties.sourceSyncedCommitId // empty' <<<"$flux_json")"
            deployment_json="$(kubectl -n cicd-dev get deployment "$APP" -o json 2>/dev/null || true)"
            if [ -n "$deployment_json" ]; then
              image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$deployment_json")"
              desired="$(jq -r '.spec.replicas // 0' <<<"$deployment_json")"
              available="$(jq -r '.status.availableReplicas // 0' <<<"$deployment_json")"
            else
              image=""; desired=0; available=0
            fi
            echo "attempt=$i flux=$compliance synced=$synced image=$image available=$available/$desired"
            if [ "$compliance" = "Compliant" ] && [[ "$synced" == *"$GITOPS_COMMIT"* ]] && [ "$image" = "$expected_image" ] && [ "$desired" -ge 1 ] && [ "$available" -eq "$desired" ]; then
              printf '%s\n' "$flux_json" > platform-observation/flux.json
              printf '%s\n' "$deployment_json" > platform-observation/deployment.json
              passed=true
              break
            fi
            sleep 10
          done
          [ "$passed" = true ]

      - name: Verify ready EndpointSlice
        shell: bash
        env:
          APP: ${{ steps.target.outputs.application }}
        run: |
          set -euo pipefail
          kubectl -n cicd-dev get endpointslices.discovery.k8s.io --selector "kubernetes.io/service-name=$APP" -o json > platform-observation/endpoints.json
          READY_ENDPOINTS="$(jq '[.items[].endpoints[]? | select(.conditions.ready == true)] | length' platform-observation/endpoints.json)"
          test "$READY_ENDPOINTS" -ge 1
          echo "ready_endpoints=$READY_ENDPOINTS"

      - name: Emit immutable DEV verification evidence
        shell: bash
        env:
          APP: ${{ steps.target.outputs.application }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          DIGEST: ${{ steps.target.outputs.digest }}
          GITOPS_COMMIT: ${{ steps.target.outputs.gitops_commit }}
        run: |
          set -euo pipefail
          IMAGE="$(jq -r '.spec.template.spec.containers[0].image' platform-observation/deployment.json)"
          AVAILABLE="$(jq -r '.status.availableReplicas // 0' platform-observation/deployment.json)"
          READY_ENDPOINTS="$(jq '[.items[].endpoints[]? | select(.conditions.ready == true)] | length' platform-observation/endpoints.json)"
          jq -n --arg app "$APP" --arg image "$IMAGE" --arg repository "$REPOSITORY" --arg digest "$DIGEST" --arg gitopsCommit "$GITOPS_COMMIT" --argjson available "$AVAILABLE" --argjson readyEndpoints "$READY_ENDPOINTS" '{apiVersion:"platform.verification/v1",kind:"DevDeploymentVerification",application:$app,environment:"dev",gitopsCommit:$gitopsCommit,artifact:{repository:$repository,digest:$digest,deployedImage:$image},status:{availableReplicas:$available,readyEndpoints:$readyEndpoints,fluxCompliant:true,result:"passed"}}' > platform-observation/verification.json
          cat platform-observation/verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: platform-smoke-dev-verification-${{ github.run_id }}
          path: platform-observation/
          if-no-files-found: error
          retention-days: 90
