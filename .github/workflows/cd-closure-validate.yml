name: CD Closure Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/promotion/**'
      - 'enterprise-cicd/gitops/**'
      - 'enterprise-cicd/contracts/identity-contract.json'
      - 'enterprise-cicd/testing/contracts/validate_cd_closure.py'
      - '.github/workflows/reusable-aks-observation-v1.yml'
      - '.github/workflows/reusable-release-verification-v1.yml'
      - '.github/workflows/reusable-cd-post-deploy-v1.yml'
      - '.github/workflows/cd-closure-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'enterprise-cicd/promotion/**'
      - 'enterprise-cicd/gitops/**'
      - 'enterprise-cicd/contracts/identity-contract.json'
      - '.github/workflows/reusable-aks-observation-v1.yml'
      - '.github/workflows/reusable-release-verification-v1.yml'
      - '.github/workflows/reusable-cd-post-deploy-v1.yml'

permissions:
  contents: read

jobs:
  validate-cd-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile CD helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            enterprise-cicd/promotion/verification/collect_aks_observation.py \
            enterprise-cicd/promotion/verification/evaluate.py \
            enterprise-cicd/promotion/record_approved_release.py \
            enterprise-cicd/promotion/render_rollback.py \
            enterprise-cicd/testing/contracts/validate_cd_closure.py

      - name: Validate read-only observation, verification and rollback closure
        run: python enterprise-cicd/testing/contracts/validate_cd_closure.py

      - name: Enforce read-only observer and pull-only rollback
        shell: bash
        run: |
          set -euo pipefail
          observer=.github/workflows/reusable-aks-observation-v1.yml
          verifier=.github/workflows/reusable-release-verification-v1.yml
          orchestrator=.github/workflows/reusable-cd-post-deploy-v1.yml

          if grep -nE 'kubectl[[:space:]]+(apply|create|delete|patch|edit|scale)|helm[[:space:]]+(upgrade|install)|az[[:space:]]+aks[[:space:]]+update' "$observer" "$verifier" "$orchestrator"; then
            echo 'CD observation/verification workflows must not directly mutate AKS.' >&2
            exit 1
          fi

          grep -F "admin: 'false'" "$observer"
          grep -F 'azure/aks-set-context@v5' "$observer"
          grep -F 'artifactIdentityReady' enterprise-cicd/promotion/verification/collect_aks_observation.py
          grep -F 'gh pr create' "$verifier"
          grep -F 'rollbackBaseline' enterprise-cicd/promotion/render_rollback.py
          grep -F 'rebuildForbidden' enterprise-cicd/promotion/rollback/default.json

          grep -F 'needs: observe' "$orchestrator"
          grep -F 'reusable-aks-observation-v1.yml' "$orchestrator"
          grep -F 'reusable-release-verification-v1.yml' "$orchestrator"
