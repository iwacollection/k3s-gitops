name: Azure TEST Readiness Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
    paths:
      - '.github/workflows/azure-test-readiness-inventory.yml'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/contracts/environment-contract.json'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-test/**'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'
      - 'enterprise-cicd/activation/test/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/azure-test-readiness-inventory.yml'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/contracts/environment-contract.json'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-test/**'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'
      - 'enterprise-cicd/activation/test/**'

permissions:
  contents: read
  id-token: write

env:
  BINDING: enterprise-cicd/contracts/environment-bindings.json
  TEST_CLUSTER: enterprise-cicd/gitops/clusters/aks-automatic-lab-test/cluster.json
  DEV_RELEASE: enterprise-cicd/release-requests/platform-smoke-api-to-dev.json
  ACR_NAME: acrcicdc12c3a3699d8

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    outputs:
      test_identity_configured: ${{ steps.contract.outputs.test_identity_configured }}
      resource_group: ${{ steps.contract.outputs.resource_group }}
      cluster_name: ${{ steps.contract.outputs.cluster_name }}
      test_flux_exists: ${{ steps.azure.outputs.test_flux_exists }}
      test_flux_branch_match: ${{ steps.azure.outputs.test_flux_branch_match }}
      artifact_available: ${{ steps.azure.outputs.artifact_available }}
      artifact_repository: ${{ steps.contract.outputs.artifact_repository }}
      artifact_digest: ${{ steps.contract.outputs.artifact_digest }}
      dev_cluster_scope_visible: ${{ steps.k8s.outputs.cluster_scope_visible }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve contracts
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BINDING"
          test -f "$TEST_CLUSTER"
          test -f "$DEV_RELEASE"

          test "$(jq -r '.metadata.environment' "$TEST_CLUSTER")" = test
          test "$(jq -r '.spec.flux.configurationName' "$TEST_CLUSTER")" = enterprise-cicd-test
          test "$(jq -r '.spec.flux.branch' "$TEST_CLUSTER")" = gitops/test
          test "$(jq -r '.spec.azure.resourceGroup' "$TEST_CLUSTER")" = group-test
          test "$(jq -r '.spec.azure.clusterName' "$TEST_CLUSTER")" = k8s-test-cicd

          git ls-remote --exit-code --heads origin refs/heads/gitops/test >/dev/null
          git fetch origin gitops/test:refs/remotes/origin/gitops/test
          git show origin/gitops/test:enterprise-cicd/gitops/environments/test/namespace.yaml | grep -F 'name: cicd-test'

          DEV_CLIENT_ID="$(jq -r '.environments.dev.identities.githubOidc.clientId // empty' "$BINDING")"
          DEV_TENANT_ID="$(jq -r '.environments.dev.identities.githubOidc.tenantId // empty' "$BINDING")"
          DEV_SUBSCRIPTION_ID="$(jq -r '.environments.dev.identities.githubOidc.subscriptionId // empty' "$BINDING")"
          TEST_CLIENT_ID="$(jq -r '.environments.test.identities.githubOidc.clientId // empty' "$BINDING")"
          TEST_PRINCIPAL_ID="$(jq -r '.environments.test.identities.githubOidc.principalId // empty' "$BINDING")"
          TEST_TENANT_ID="$(jq -r '.environments.test.identities.githubOidc.tenantId // empty' "$BINDING")"
          TEST_SUBSCRIPTION_ID="$(jq -r '.environments.test.identities.githubOidc.subscriptionId // empty' "$BINDING")"
          TEST_RESOURCE_ID="$(jq -r '.environments.test.identities.githubOidc.resourceId // empty' "$BINDING")"
          DEV_PRINCIPAL_ID="$(jq -r '.environments.dev.identities.githubOidc.principalId // empty' "$BINDING")"

          test -n "$DEV_CLIENT_ID"
          test -n "$DEV_TENANT_ID"
          test -n "$DEV_SUBSCRIPTION_ID"

          TEST_CONFIGURED=false
          if [[ -n "$TEST_CLIENT_ID" && -n "$TEST_PRINCIPAL_ID" && -n "$TEST_TENANT_ID" && -n "$TEST_SUBSCRIPTION_ID" && -n "$TEST_RESOURCE_ID" && "$TEST_PRINCIPAL_ID" != "$DEV_PRINCIPAL_ID" ]]; then
            TEST_CONFIGURED=true
          fi

          echo "dev_client_id=$DEV_CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "dev_tenant_id=$DEV_TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "dev_subscription_id=$DEV_SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "test_identity_configured=$TEST_CONFIGURED" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(jq -r '.spec.azure.resourceGroup' "$TEST_CLUSTER")" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(jq -r '.spec.azure.clusterName' "$TEST_CLUSTER")" >> "$GITHUB_OUTPUT"
          echo "flux_name=$(jq -r '.spec.flux.configurationName' "$TEST_CLUSTER")" >> "$GITHUB_OUTPUT"
          echo "flux_branch=$(jq -r '.spec.flux.branch' "$TEST_CLUSTER")" >> "$GITHUB_OUTPUT"
          echo "artifact_repository=$(jq -r '.spec.artifactRepository' "$DEV_RELEASE")" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.spec.artifactDigest' "$DEV_RELEASE")" >> "$GITHUB_OUTPUT"

      - name: Azure login with DEV inventory identity
        uses: azure/login@v3
        with:
          client-id: ${{ steps.contract.outputs.dev_client_id }}
          tenant-id: ${{ steps.contract.outputs.dev_tenant_id }}
          subscription-id: ${{ steps.contract.outputs.dev_subscription_id }}

      - name: Install Flux extension
        shell: bash
        run: az extension add --name k8s-configuration --upgrade --yes

      - name: Inventory Azure TEST state
        id: azure
        shell: bash
        env:
          RG: ${{ steps.contract.outputs.resource_group }}
          CLUSTER: ${{ steps.contract.outputs.cluster_name }}
          FLUX_NAME: ${{ steps.contract.outputs.flux_name }}
          FLUX_BRANCH: ${{ steps.contract.outputs.flux_branch }}
          ARTIFACT_REPOSITORY: ${{ steps.contract.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ steps.contract.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p test-readiness-base
          az aks show --resource-group "$RG" --name "$CLUSTER" -o json > test-readiness-base/aks.json
          az k8s-configuration flux list --resource-group "$RG" --cluster-name "$CLUSTER" --cluster-type managedClusters -o json > test-readiness-base/flux.json

          FLUX_EXISTS="$(jq -r --arg name "$FLUX_NAME" '[.[] | select(.name == $name)] | length > 0' test-readiness-base/flux.json)"
          BRANCH_MATCH=false
          if [[ "$FLUX_EXISTS" == true ]]; then
            BRANCH_MATCH="$(jq -r --arg name "$FLUX_NAME" --arg branch "$FLUX_BRANCH" '[.[] | select(.name == $name and (.gitRepository.repositoryRef.branch // "") == $branch)] | length > 0' test-readiness-base/flux.json)"
          fi

          ACR_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${ARTIFACT_REPOSITORY#*.azurecr.io/}@$ARTIFACT_DIGEST" --query digest -o tsv)"
          test "$ACR_DIGEST" = "$ARTIFACT_DIGEST"

          echo "test_flux_exists=$FLUX_EXISTS" >> "$GITHUB_OUTPUT"
          echo "test_flux_branch_match=$BRANCH_MATCH" >> "$GITHUB_OUTPUT"
          echo "artifact_available=true" >> "$GITHUB_OUTPUT"

      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Set DEV non-admin context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ steps.contract.outputs.resource_group }}
          cluster-name: ${{ steps.contract.outputs.cluster_name }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Prove DEV inventory identity remains namespace scoped
        id: k8s
        shell: bash
        run: |
          set -euo pipefail
          kubectl auth can-i get deployments.apps --namespace cicd-dev | grep -Fx yes
          set +e
          kubectl get namespaces >/tmp/namespaces.out 2>/tmp/namespaces.err
          RC=$?
          set -e
          if [[ "$RC" -eq 0 ]]; then VISIBLE=true; else VISIBLE=false; fi
          echo "cluster_scope_visible=$VISIBLE" >> "$GITHUB_OUTPUT"

      - name: Save base evidence
        shell: bash
        env:
          TEST_IDENTITY_CONFIGURED: ${{ steps.contract.outputs.test_identity_configured }}
          TEST_FLUX_EXISTS: ${{ steps.azure.outputs.test_flux_exists }}
          TEST_FLUX_BRANCH_MATCH: ${{ steps.azure.outputs.test_flux_branch_match }}
          ARTIFACT_AVAILABLE: ${{ steps.azure.outputs.artifact_available }}
          DEV_CLUSTER_SCOPE_VISIBLE: ${{ steps.k8s.outputs.cluster_scope_visible }}
          ARTIFACT_REPOSITORY: ${{ steps.contract.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ steps.contract.outputs.artifact_digest }}
        run: |
          jq -n --argjson testIdentityConfigured "$TEST_IDENTITY_CONFIGURED" --argjson testFluxExists "$TEST_FLUX_EXISTS" --argjson testFluxBranchMatch "$TEST_FLUX_BRANCH_MATCH" --argjson artifactAvailable "$ARTIFACT_AVAILABLE" --argjson devClusterScopeVisible "$DEV_CLUSTER_SCOPE_VISIBLE" --arg repository "$ARTIFACT_REPOSITORY" --arg digest "$ARTIFACT_DIGEST" '{testIdentityConfigured:$testIdentityConfigured,testFluxExists:$testFluxExists,testFluxBranchMatch:$testFluxBranchMatch,artifactAvailable:$artifactAvailable,devClusterScopeVisible:$devClusterScopeVisible,artifactRepository:$repository,artifactDigest:$digest}' > test-readiness-base/base.json
          cat test-readiness-base/base.json

      - uses: actions/upload-artifact@v4
        with:
          name: test-readiness-base-${{ github.run_id }}
          path: test-readiness-base/
          if-no-files-found: error
          retention-days: 90

  test-identity-probe:
    needs: inventory
    if: needs.inventory.outputs.test_identity_configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    outputs:
      probe_passed: ${{ steps.verify.outputs.probe_passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve TEST identity
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID="$(jq -r '.environments.test.identities.githubOidc.clientId' "$BINDING")"
          PRINCIPAL_ID="$(jq -r '.environments.test.identities.githubOidc.principalId' "$BINDING")"
          TENANT_ID="$(jq -r '.environments.test.identities.githubOidc.tenantId' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.test.identities.githubOidc.subscriptionId' "$BINDING")"
          DEV_PRINCIPAL_ID="$(jq -r '.environments.dev.identities.githubOidc.principalId' "$BINDING")"
          test "$PRINCIPAL_ID" != "$DEV_PRINCIPAL_ID"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Azure login with TEST OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.auth.outputs.client_id }}
          tenant-id: ${{ steps.auth.outputs.tenant_id }}
          subscription-id: ${{ steps.auth.outputs.subscription_id }}

      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Set TEST non-admin context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ needs.inventory.outputs.resource_group }}
          cluster-name: ${{ needs.inventory.outputs.cluster_name }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Prove TEST read-only boundary and artifact access
        id: verify
        shell: bash
        env:
          ARTIFACT_REPOSITORY: ${{ needs.inventory.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ needs.inventory.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p test-identity-probe

          READ_DEPLOY="$(kubectl auth can-i get deployments.apps --namespace cicd-test 2>&1 || true)"
          READ_ENDPOINT="$(kubectl auth can-i get endpointslices.discovery.k8s.io --namespace cicd-test 2>&1 || true)"
          CREATE_DEPLOY="$(kubectl auth can-i create deployments.apps --namespace cicd-test 2>&1 || true)"
          PATCH_DEPLOY="$(kubectl auth can-i patch deployments.apps --namespace cicd-test 2>&1 || true)"
          DELETE_DEPLOY="$(kubectl auth can-i delete deployments.apps --namespace cicd-test 2>&1 || true)"

          grep -Eq '^yes([[:space:]]|$)' <<<"$READ_DEPLOY"
          grep -Eq '^yes([[:space:]]|$)' <<<"$READ_ENDPOINT"
          grep -Eq '^no([[:space:]-]|$)' <<<"$CREATE_DEPLOY"
          grep -Eq '^no([[:space:]-]|$)' <<<"$PATCH_DEPLOY"
          grep -Eq '^no([[:space:]-]|$)' <<<"$DELETE_DEPLOY"

          ACR_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${ARTIFACT_REPOSITORY#*.azurecr.io/}@$ARTIFACT_DIGEST" --query digest -o tsv)"
          test "$ACR_DIGEST" = "$ARTIFACT_DIGEST"

          jq -n --arg principalId '${{ steps.auth.outputs.principal_id }}' --arg deploymentRead "$READ_DEPLOY" --arg endpointRead "$READ_ENDPOINT" --arg deploymentCreate "$CREATE_DEPLOY" --arg deploymentPatch "$PATCH_DEPLOY" --arg deploymentDelete "$DELETE_DEPLOY" --arg digest "$ARTIFACT_DIGEST" '{testOidcLogin:true,testPrincipalId:$principalId,namespace:"cicd-test",checks:{deploymentRead:$deploymentRead,endpointSliceRead:$endpointRead,deploymentCreate:$deploymentCreate,deploymentPatch:$deploymentPatch,deploymentDelete:$deploymentDelete,artifactDigest:$digest,artifactRead:true}}' > test-identity-probe/probe.json
          echo 'probe_passed=true' >> "$GITHUB_OUTPUT"
          cat test-identity-probe/probe.json

      - uses: actions/upload-artifact@v4
        with:
          name: test-identity-probe-${{ github.run_id }}
          path: test-identity-probe/
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: [inventory, test-identity-probe]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: test-readiness-base-${{ github.run_id }}
          path: test-readiness-evidence

      - name: Emit final readiness evidence
        shell: bash
        env:
          TEST_IDENTITY_CONFIGURED: ${{ needs.inventory.outputs.test_identity_configured }}
          TEST_PROBE_RESULT: ${{ needs.test-identity-probe.result }}
          TEST_FLUX_EXISTS: ${{ needs.inventory.outputs.test_flux_exists }}
          TEST_FLUX_BRANCH_MATCH: ${{ needs.inventory.outputs.test_flux_branch_match }}
          ARTIFACT_AVAILABLE: ${{ needs.inventory.outputs.artifact_available }}
          DEV_CLUSTER_SCOPE_VISIBLE: ${{ needs.inventory.outputs.dev_cluster_scope_visible }}
          ARTIFACT_REPOSITORY: ${{ needs.inventory.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ needs.inventory.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          BLOCKERS='[]'
          PROBE_PASSED=false

          [[ "$TEST_IDENTITY_CONFIGURED" == true ]] || BLOCKERS="$(jq -c '. + ["missing-test-github-oidc-binding"]' <<<"$BLOCKERS")"
          if [[ "$TEST_IDENTITY_CONFIGURED" == true ]]; then
            if [[ "$TEST_PROBE_RESULT" == success ]]; then PROBE_PASSED=true; else BLOCKERS="$(jq -c '. + ["test-oidc-or-rbac-probe-failed"]' <<<"$BLOCKERS")"; fi
          fi
          [[ "$TEST_FLUX_EXISTS" == true ]] || BLOCKERS="$(jq -c '. + ["missing-test-flux-configuration"]' <<<"$BLOCKERS")"
          [[ "$TEST_FLUX_BRANCH_MATCH" == true ]] || BLOCKERS="$(jq -c '. + ["test-flux-branch-mismatch"]' <<<"$BLOCKERS")"
          [[ "$ARTIFACT_AVAILABLE" == true ]] || BLOCKERS="$(jq -c '. + ["dev-approved-artifact-unavailable"]' <<<"$BLOCKERS")"
          [[ "$DEV_CLUSTER_SCOPE_VISIBLE" == false ]] || BLOCKERS="$(jq -c '. + ["dev-inventory-identity-has-unexpected-cluster-scope"]' <<<"$BLOCKERS")"

          if [[ "$(jq 'length' <<<"$BLOCKERS")" -eq 0 ]]; then STATUS=ready; else STATUS=blocked; fi

          jq -n --arg status "$STATUS" --arg repository "$ARTIFACT_REPOSITORY" --arg digest "$ARTIFACT_DIGEST" --argjson testIdentityConfigured "$TEST_IDENTITY_CONFIGURED" --argjson testIdentityProbePassed "$PROBE_PASSED" --argjson testFluxExists "$TEST_FLUX_EXISTS" --argjson testFluxBranchMatch "$TEST_FLUX_BRANCH_MATCH" --argjson artifactAvailable "$ARTIFACT_AVAILABLE" --argjson devClusterScopeVisible "$DEV_CLUSTER_SCOPE_VISIBLE" --argjson blockers "$BLOCKERS" '{apiVersion:"platform.activation/v1",kind:"EnvironmentReadiness",metadata:{environment:"test",mode:"logical-environment-on-shared-aks"},spec:{status:$status,artifact:{repository:$repository,digest:$digest,available:$artifactAvailable},checks:{testGithubOidcBinding:$testIdentityConfigured,testOidcAndNamespaceRbacProbe:$testIdentityProbePassed,testFluxConfiguration:$testFluxExists,testFluxBranchMatch:$testFluxBranchMatch,devInventoryIdentityClusterScopeVisible:$devClusterScopeVisible},blockers:$blockers}}' > readiness.json
          cat readiness.json
          test "$STATUS" = ready

      - uses: actions/upload-artifact@v4
        with:
          name: test-readiness-${{ github.run_id }}
          path: readiness.json
          if-no-files-found: error
          retention-days: 90
