name: Azure TEST Readiness Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
    paths:
      - '.github/workflows/azure-test-readiness-inventory.yml'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/contracts/environment-contract.json'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-test/cluster.json'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'
      - 'enterprise-cicd/activation/test/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/azure-test-readiness-inventory.yml'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/contracts/environment-contract.json'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-test/cluster.json'
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'
      - 'enterprise-cicd/activation/test/**'

permissions:
  contents: read
  id-token: write

env:
  ENV_BINDING: enterprise-cicd/contracts/environment-bindings.json
  ENV_CONTRACT: enterprise-cicd/contracts/environment-contract.json
  TEST_CLUSTER_BINDING: enterprise-cicd/gitops/clusters/aks-automatic-lab-test/cluster.json
  DEV_RELEASE_REQUEST: enterprise-cicd/release-requests/platform-smoke-api-to-dev.json
  ACR_NAME: acrcicdc12c3a3699d8

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    outputs:
      test_identity_configured: ${{ steps.contract.outputs.test_identity_configured }}
      resource_group: ${{ steps.contract.outputs.resource_group }}
      cluster_name: ${{ steps.contract.outputs.cluster_name }}
      test_flux_exists: ${{ steps.azure.outputs.test_flux_exists }}
      test_flux_branch_match: ${{ steps.azure.outputs.test_flux_branch_match }}
      artifact_available: ${{ steps.azure.outputs.artifact_available }}
      artifact_repository: ${{ steps.contract.outputs.artifact_repository }}
      artifact_digest: ${{ steps.contract.outputs.artifact_digest }}
      dev_cluster_scope_visible: ${{ steps.kubernetes.outputs.cluster_scope_visible }}
    steps:
      - name: Checkout platform branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve read-only inventory identity and TEST contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ENV_BINDING"
          test -f "$ENV_CONTRACT"
          test -f "$TEST_CLUSTER_BINDING"
          test -f "$DEV_RELEASE_REQUEST"

          test "$(jq -r '.lab_mapping.logical_only_environments | index("test") != null' "$ENV_CONTRACT")" = "true"
          test "$(jq -r '.metadata.environment' "$TEST_CLUSTER_BINDING")" = "test"
          test "$(jq -r '.spec.flux.branch' "$TEST_CLUSTER_BINDING")" = "gitops/test"
          test "$(jq -r '.spec.azure.resourceGroup' "$TEST_CLUSTER_BINDING")" = "group-test"
          test "$(jq -r '.spec.azure.clusterName' "$TEST_CLUSTER_BINDING")" = "k8s-test-cicd"

          git ls-remote --exit-code --heads origin refs/heads/gitops/test >/dev/null
          git fetch origin gitops/test:refs/remotes/origin/gitops/test
          git show origin/gitops/test:enterprise-cicd/gitops/environments/test/namespace.yaml | grep -F 'name: cicd-test'
          git show origin/gitops/test:enterprise-cicd/gitops/environments/test/kustomization.yaml >/dev/null

          CLIENT_ID="$(jq -r '.environments.dev.identities.githubOidc.clientId // empty' "$ENV_BINDING")"
          TENANT_ID="$(jq -r '.environments.dev.identities.githubOidc.tenantId // empty' "$ENV_BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.dev.identities.githubOidc.subscriptionId // empty' "$ENV_BINDING")"
          test -n "$CLIENT_ID"
          test -n "$TENANT_ID"
          test -n "$SUBSCRIPTION_ID"

          TEST_CLIENT_ID="$(jq -r '.environments.test.identities.githubOidc.clientId // empty' "$ENV_BINDING")"
          TEST_PRINCIPAL_ID="$(jq -r '.environments.test.identities.githubOidc.principalId // empty' "$ENV_BINDING")"
          TEST_TENANT_ID="$(jq -r '.environments.test.identities.githubOidc.tenantId // empty' "$ENV_BINDING")"
          TEST_SUBSCRIPTION_ID="$(jq -r '.environments.test.identities.githubOidc.subscriptionId // empty' "$ENV_BINDING")"
          TEST_RESOURCE_ID="$(jq -r '.environments.test.identities.githubOidc.resourceId // empty' "$ENV_BINDING")"
          if [[ -n "$TEST_CLIENT_ID" && -n "$TEST_PRINCIPAL_ID" && -n "$TEST_TENANT_ID" && -n "$TEST_SUBSCRIPTION_ID" && -n "$TEST_RESOURCE_ID" ]]; then
            TEST_IDENTITY_CONFIGURED=true
          else
            TEST_IDENTITY_CONFIGURED=false
          fi

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "test_identity_configured=$TEST_IDENTITY_CONFIGURED" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(jq -r '.spec.azure.resourceGroup' "$TEST_CLUSTER_BINDING")" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(jq -r '.spec.azure.clusterName' "$TEST_CLUSTER_BINDING")" >> "$GITHUB_OUTPUT"
          echo "cluster_type=$(jq -r '.spec.azure.clusterType' "$TEST_CLUSTER_BINDING")" >> "$GITHUB_OUTPUT"
          echo "test_flux_name=$(jq -r '.spec.flux.configurationName' "$TEST_CLUSTER_BINDING")" >> "$GITHUB_OUTPUT"
          echo "test_flux_branch=$(jq -r '.spec.flux.branch' "$TEST_CLUSTER_BINDING")" >> "$GITHUB_OUTPUT"
          echo "artifact_repository=$(jq -r '.spec.artifactRepository' "$DEV_RELEASE_REQUEST")" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$(jq -r '.spec.artifactDigest' "$DEV_RELEASE_REQUEST")" >> "$GITHUB_OUTPUT"

      - name: Azure login with existing DEV OIDC for inventory only
        uses: azure/login@v3
        with:
          client-id: ${{ steps.contract.outputs.client_id }}
          tenant-id: ${{ steps.contract.outputs.tenant_id }}
          subscription-id: ${{ steps.contract.outputs.subscription_id }}

      - name: Install Azure Flux extension
        shell: bash
        run: az extension add --name k8s-configuration --upgrade --yes

      - name: Inventory real AKS, Flux and ACR state
        id: azure
        shell: bash
        env:
          RG: ${{ steps.contract.outputs.resource_group }}
          CLUSTER: ${{ steps.contract.outputs.cluster_name }}
          CLUSTER_TYPE: ${{ steps.contract.outputs.cluster_type }}
          TEST_FLUX_NAME: ${{ steps.contract.outputs.test_flux_name }}
          TEST_FLUX_BRANCH: ${{ steps.contract.outputs.test_flux_branch }}
          ARTIFACT_REPOSITORY: ${{ steps.contract.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ steps.contract.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p test-readiness-base

          az aks show --resource-group "$RG" --name "$CLUSTER" --output json > test-readiness-base/aks.json
          az k8s-configuration flux list \
            --resource-group "$RG" \
            --cluster-name "$CLUSTER" \
            --cluster-type "$CLUSTER_TYPE" \
            --output json > test-readiness-base/flux-configurations.json

          TEST_FLUX_EXISTS="$(jq -r --arg name "$TEST_FLUX_NAME" '[.[] | select(.name == $name)] | length > 0' test-readiness-base/flux-configurations.json)"
          TEST_FLUX_BRANCH_MATCH=false
          if [[ "$TEST_FLUX_EXISTS" == "true" ]]; then
            TEST_FLUX_BRANCH_MATCH="$(jq -r --arg name "$TEST_FLUX_NAME" --arg branch "$TEST_FLUX_BRANCH" '[.[] | select(.name == $name and (.gitRepository.repositoryRef.branch // "") == $branch)] | length > 0' test-readiness-base/flux-configurations.json)"
          fi

          ACR_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${ARTIFACT_REPOSITORY#*.azurecr.io/}@$ARTIFACT_DIGEST" --query digest -o tsv)"
          test "$ACR_DIGEST" = "$ARTIFACT_DIGEST"

          echo "test_flux_exists=$TEST_FLUX_EXISTS" >> "$GITHUB_OUTPUT"
          echo "test_flux_branch_match=$TEST_FLUX_BRANCH_MATCH" >> "$GITHUB_OUTPUT"
          echo "artifact_available=true" >> "$GITHUB_OUTPUT"

      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Set DEV namespace-scoped read context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ steps.contract.outputs.resource_group }}
          cluster-name: ${{ steps.contract.outputs.cluster_name }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Verify DEV inventory identity remains namespace scoped
        id: kubernetes
        shell: bash
        run: |
          set -euo pipefail
          kubectl auth can-i get deployments.apps --namespace cicd-dev | grep -Fx yes
          kubectl --namespace cicd-dev get deployment platform-smoke-api -o json > test-readiness-base/dev-deployment.json

          set +e
          kubectl get namespaces -o json > test-readiness-base/namespaces.json 2> test-readiness-base/cluster-scope-denied.txt
          rc=$?
          set -e
          if [[ "$rc" == "0" ]]; then
            CLUSTER_SCOPE_VISIBLE=true
          else
            CLUSTER_SCOPE_VISIBLE=false
            rm -f test-readiness-base/namespaces.json
          fi
          echo "cluster_scope_visible=$CLUSTER_SCOPE_VISIBLE" >> "$GITHUB_OUTPUT"

      - name: Record base inventory facts
        shell: bash
        env:
          TEST_IDENTITY_CONFIGURED: ${{ steps.contract.outputs.test_identity_configured }}
          TEST_FLUX_EXISTS: ${{ steps.azure.outputs.test_flux_exists }}
          TEST_FLUX_BRANCH_MATCH: ${{ steps.azure.outputs.test_flux_branch_match }}
          ARTIFACT_AVAILABLE: ${{ steps.azure.outputs.artifact_available }}
          DEV_CLUSTER_SCOPE_VISIBLE: ${{ steps.kubernetes.outputs.cluster_scope_visible }}
          ARTIFACT_REPOSITORY: ${{ steps.contract.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ steps.contract.outputs.artifact_digest }}
        run: |
          jq -n \
            --argjson testIdentityConfigured "$TEST_IDENTITY_CONFIGURED" \
            --argjson testFluxExists "$TEST_FLUX_EXISTS" \
            --argjson testFluxBranchMatch "$TEST_FLUX_BRANCH_MATCH" \
            --argjson artifactAvailable "$ARTIFACT_AVAILABLE" \
            --argjson devClusterScopeVisible "$DEV_CLUSTER_SCOPE_VISIBLE" \
            --arg repository "$ARTIFACT_REPOSITORY" \
            --arg digest "$ARTIFACT_DIGEST" \
            '{testIdentityConfigured:$testIdentityConfigured,testFluxExists:$testFluxExists,testFluxBranchMatch:$testFluxBranchMatch,artifactAvailable:$artifactAvailable,devClusterScopeVisible:$devClusterScopeVisible,artifactRepository:$repository,artifactDigest:$digest}' \
            > test-readiness-base/base-facts.json
          cat test-readiness-base/base-facts.json

      - name: Upload base inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-readiness-base-${{ github.run_id }}
          path: test-readiness-base/
          if-no-files-found: error
          retention-days: 90

  test-identity-probe:
    needs: inventory
    if: needs.inventory.outputs.test_identity_configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    outputs:
      probe_passed: ${{ steps.verify.outputs.probe_passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve dedicated TEST OIDC binding
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          CLIENT_ID="$(jq -r '.environments.test.identities.githubOidc.clientId // empty' "$BINDING")"
          PRINCIPAL_ID="$(jq -r '.environments.test.identities.githubOidc.principalId // empty' "$BINDING")"
          TENANT_ID="$(jq -r '.environments.test.identities.githubOidc.tenantId // empty' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.test.identities.githubOidc.subscriptionId // empty' "$BINDING")"
          DEV_PRINCIPAL="$(jq -r '.environments.dev.identities.githubOidc.principalId // empty' "$BINDING")"
          test -n "$CLIENT_ID"
          test -n "$PRINCIPAL_ID"
          test -n "$TENANT_ID"
          test -n "$SUBSCRIPTION_ID"
          test "$PRINCIPAL_ID" != "$DEV_PRINCIPAL"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"

      - name: Azure login with TEST environment OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.auth.outputs.client_id }}
          tenant-id: ${{ steps.auth.outputs.tenant_id }}
          subscription-id: ${{ steps.auth.outputs.subscription_id }}

      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Set TEST non-admin AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ needs.inventory.outputs.resource_group }}
          cluster-name: ${{ needs.inventory.outputs.cluster_name }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Prove TEST namespace read-only RBAC and artifact access
        id: verify
        shell: bash
        env:
          ARTIFACT_REPOSITORY: ${{ needs.inventory.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ needs.inventory.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p test-identity-probe

          kubectl auth can-i get deployments.apps --namespace cicd-test | grep -Fx yes
          kubectl auth can-i get endpointslices.discovery.k8s.io --namespace cicd-test | grep -Fx yes
          test "$(kubectl auth can-i create deployments.apps --namespace cicd-test)" = no
          test "$(kubectl auth can-i patch deployments.apps --namespace cicd-test)" = no
          test "$(kubectl auth can-i delete deployments.apps --namespace cicd-test)" = no

          ACR_DIGEST="$(az acr repository show --name "$ACR_NAME" --image "${ARTIFACT_REPOSITORY#*.azurecr.io/}@$ARTIFACT_DIGEST" --query digest -o tsv)"
          test "$ACR_DIGEST" = "$ARTIFACT_DIGEST"

          jq -n \
            --arg principalId '${{ steps.auth.outputs.principal_id }}' \
            --arg digest "$ARTIFACT_DIGEST" \
            '{testOidcLogin:true,testPrincipalId:$principalId,namespace:"cicd-test",deploymentRead:true,endpointSliceRead:true,deploymentCreate:false,deploymentPatch:false,deploymentDelete:false,artifactDigest:$digest,artifactRead:true}' \
            > test-identity-probe/probe.json
          echo 'probe_passed=true' >> "$GITHUB_OUTPUT"
          cat test-identity-probe/probe.json

      - name: Upload TEST identity probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-identity-probe-${{ github.run_id }}
          path: test-identity-probe/
          if-no-files-found: error
          retention-days: 90

  finalize:
    needs: [inventory, test-identity-probe]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download base inventory evidence
        uses: actions/download-artifact@v5
        with:
          name: test-readiness-base-${{ github.run_id }}
          path: test-readiness-evidence

      - name: Download TEST identity probe evidence
        if: needs.inventory.outputs.test_identity_configured == 'true' && needs.test-identity-probe.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: test-identity-probe-${{ github.run_id }}
          path: test-readiness-evidence/test-identity-probe

      - name: Emit final TEST readiness evidence
        shell: bash
        env:
          TEST_IDENTITY_CONFIGURED: ${{ needs.inventory.outputs.test_identity_configured }}
          TEST_IDENTITY_PROBE_RESULT: ${{ needs.test-identity-probe.result }}
          TEST_FLUX_EXISTS: ${{ needs.inventory.outputs.test_flux_exists }}
          TEST_FLUX_BRANCH_MATCH: ${{ needs.inventory.outputs.test_flux_branch_match }}
          ARTIFACT_AVAILABLE: ${{ needs.inventory.outputs.artifact_available }}
          DEV_CLUSTER_SCOPE_VISIBLE: ${{ needs.inventory.outputs.dev_cluster_scope_visible }}
          ARTIFACT_REPOSITORY: ${{ needs.inventory.outputs.artifact_repository }}
          ARTIFACT_DIGEST: ${{ needs.inventory.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          blockers='[]'
          TEST_IDENTITY_PROBE_PASSED=false

          if [[ "$TEST_IDENTITY_CONFIGURED" != "true" ]]; then
            blockers="$(jq -c '. + ["missing-test-github-oidc-binding"]' <<<"$blockers")"
          elif [[ "$TEST_IDENTITY_PROBE_RESULT" != "success" ]]; then
            blockers="$(jq -c '. + ["test-oidc-or-rbac-probe-failed"]' <<<"$blockers")"
          else
            TEST_IDENTITY_PROBE_PASSED=true
          fi

          if [[ "$TEST_FLUX_EXISTS" != "true" ]]; then
            blockers="$(jq -c '. + ["missing-test-flux-configuration"]' <<<"$blockers")"
          elif [[ "$TEST_FLUX_BRANCH_MATCH" != "true" ]]; then
            blockers="$(jq -c '. + ["test-flux-branch-mismatch"]' <<<"$blockers")"
          fi

          if [[ "$ARTIFACT_AVAILABLE" != "true" ]]; then
            blockers="$(jq -c '. + ["dev-approved-artifact-unavailable"]' <<<"$blockers")"
          fi
          if [[ "$DEV_CLUSTER_SCOPE_VISIBLE" == "true" ]]; then
            blockers="$(jq -c '. + ["dev-inventory-identity-has-unexpected-cluster-scope"]' <<<"$blockers")"
          fi

          if [[ "$(jq 'length' <<<"$blockers")" == "0" ]]; then
            STATUS=ready
          else
            STATUS=blocked
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg repository "$ARTIFACT_REPOSITORY" \
            --arg digest "$ARTIFACT_DIGEST" \
            --argjson testIdentityConfigured "$TEST_IDENTITY_CONFIGURED" \
            --argjson testIdentityProbePassed "$TEST_IDENTITY_PROBE_PASSED" \
            --argjson testFluxExists "$TEST_FLUX_EXISTS" \
            --argjson testFluxBranchMatch "$TEST_FLUX_BRANCH_MATCH" \
            --argjson artifactAvailable "$ARTIFACT_AVAILABLE" \
            --argjson devClusterScopeVisible "$DEV_CLUSTER_SCOPE_VISIBLE" \
            --argjson blockers "$blockers" \
            '{
              apiVersion:"platform.activation/v1",
              kind:"EnvironmentReadiness",
              metadata:{environment:"test",mode:"logical-environment-on-shared-aks"},
              spec:{
                status:$status,
                physicalBoundary:"shared-lab-aks",
                logicalBoundaries:{githubEnvironment:"test",gitopsBranch:"gitops/test",namespace:"cicd-test",fluxConfiguration:"enterprise-cicd-test"},
                artifact:{repository:$repository,digest:$digest,available:$artifactAvailable},
                checks:{
                  testGithubOidcBinding:$testIdentityConfigured,
                  testOidcAndNamespaceRbacProbe:$testIdentityProbePassed,
                  testFluxConfiguration:$testFluxExists,
                  testFluxBranchMatch:$testFluxBranchMatch,
                  devInventoryIdentityClusterScopeVisible:$devClusterScopeVisible
                },
                blockers:$blockers
              }
            }' > test-readiness-evidence/readiness.json

          cat test-readiness-evidence/readiness.json
          {
            echo '## TEST readiness inventory'
            echo "- Status: \`$STATUS\`"
            echo "- Same DEV-approved digest: \`$ARTIFACT_DIGEST\`"
            echo "- TEST OIDC binding configured: \`$TEST_IDENTITY_CONFIGURED\`"
            echo "- TEST OIDC + namespace RBAC probe passed: \`$TEST_IDENTITY_PROBE_PASSED\`"
            echo "- TEST Flux configuration exists: \`$TEST_FLUX_EXISTS\`"
            echo "- TEST Flux branch matches gitops/test: \`$TEST_FLUX_BRANCH_MATCH\`"
            echo "- DEV inventory identity has cluster-scope namespace visibility: \`$DEV_CLUSTER_SCOPE_VISIBLE\`"
            echo "- Blockers: \`$(jq -c .spec.blockers test-readiness-evidence/readiness.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final TEST readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: test-readiness-${{ github.run_id }}
          path: test-readiness-evidence/
          if-no-files-found: error
          retention-days: 90
