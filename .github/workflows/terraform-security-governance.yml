name: Terraform Security Governance

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  terraform-security-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.9'

      - name: Terraform fmt
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/production
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        working-directory: infrastructure/terraform
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Run Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        continue-on-error: false
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif

  terraform-policy-gate:
    name: Terraform Policy as Code Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Conftest
        uses: princespaghetti/setup-conftest@v1

      - name: Generate Terraform JSON Plan
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.9'

      - name: Terraform Init Without Backend
        working-directory: infrastructure/terraform/environments/production
        run: terraform init -backend=false -input=false

      - name: Terraform Plan JSON
        working-directory: infrastructure/terraform/environments/production
        env:
          TF_VAR_database_admin_username: ${{ secrets.DATABASE_ADMIN_USERNAME }}
          TF_VAR_database_admin_password: ${{ secrets.DATABASE_ADMIN_PASSWORD }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json

      - name: OPA Policy Validation
        run: |
          conftest test tfplan.json --policy policy/terraform
