name: Terraform Security Governance

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'policy/terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  terraform-security-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Terraform Format Check
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.9'

      - name: Terraform fmt
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Run Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif

  terraform-policy-gate:
    name: Terraform Policy as Code Gate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Conftest
        uses: princespaghetti/setup-conftest@v1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.9'

      - name: Terraform Init Without Backend
        working-directory: infrastructure/terraform/environments/production
        run: terraform init -backend=false -input=false

      - name: Terraform Plan JSON
        working-directory: infrastructure/terraform/environments/production
        run: |
          terraform plan -input=false -refresh=false -lock=false -out=tfplan
          terraform show -json tfplan > tfplan.json

      - name: OPA Policy Validation
        run: |
          conftest test infrastructure/terraform/environments/production/tfplan.json \
            --policy policy/terraform

      - name: Explain Gate Contract
        if: failure()
        run: |
          echo "Terraform Policy Gate failed."
          echo "请根据 PGxxx 规则编号修复 Terraform 变更，而不是绕过 Policy。"
