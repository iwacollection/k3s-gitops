name: Platform Smoke DEV Promotion

on:
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
    paths:
      - 'enterprise-cicd/release-requests/platform-smoke-api-to-dev.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    uses: ./.github/workflows/gitops-promotion.yml
    with:
      release_request: enterprise-cicd/release-requests/platform-smoke-api-to-dev.json
