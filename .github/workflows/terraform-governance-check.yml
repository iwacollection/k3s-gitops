name: Terraform Governance Check

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/terraform/**'
      - '.github/workflows/**terraform**'

permissions:
  contents: read

jobs:
  governance:
    name: Terraform Governance Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Terraform CLI check
        run: terraform version

      - name: Module contract check
        run: |
          if [ -f tests/terraform/module-contract-check.sh ]; then
            bash tests/terraform/module-contract-check.sh
          else
            echo "module contract check not found, skip"
          fi

      - name: Production safety script check
        run: |
          for file in \
            scripts/terraform/safety/destroy-guard.py \
            scripts/terraform/safety/replace-guard.py; do
            if [ ! -f "$file" ]; then
              echo "missing safety guard: $file"
              exit 1
            fi
          done
          echo "terraform governance baseline passed"
