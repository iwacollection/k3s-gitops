name: IaC Platform Foundation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]
      operation:
        description: Plan only or protected Apply
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      plan_client_id: ${{ steps.resolve.outputs.plan_client_id }}
      apply_client_id: ${{ steps.resolve.outputs.apply_client_id }}
      plan_environment: ${{ steps.resolve.outputs.plan_environment }}
      apply_environment: ${{ steps.resolve.outputs.apply_environment }}
      tenant_id: ${{ steps.resolve.outputs.tenant_id }}
      subscription_id: ${{ steps.resolve.outputs.subscription_id }}
      state_rg: ${{ steps.resolve.outputs.state_rg }}
      state_storage: ${{ steps.resolve.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve foundation desired state and OIDC bindings
        id: resolve
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          env=os.environ['TARGET_ENV']; operation=os.environ['OPERATION']
          desired=json.loads(Path('enterprise-cicd/contracts/iac-platform-foundation.json').read_text())
          if env not in desired['environments']:
              raise SystemExit(f'foundation desired state missing environment={env}')
          binding=json.loads(Path('enterprise-cicd/contracts/iac-runtime-bindings.json').read_text())
          runtime=binding['environments'][env]
          plan=runtime.get('plan') or {}
          if runtime.get('activationStatus') != 'ready' or not plan.get('clientId'):
              raise SystemExit(f'{env} Plan runtime is not activated')
          if plan.get('githubEnvironment') != f'iac-{env}-plan':
              raise SystemExit('Plan GitHub Environment mismatch')
          if plan.get('resourceWriteAccess') is not False:
              raise SystemExit('Plan identity must remain resource read-only')
          foundation=runtime.get('foundation') or {}
          apply_client=''
          if operation == 'apply':
              if foundation.get('activationStatus') != 'ready':
                  raise SystemExit(f'{env} Foundation Apply is not activated: {foundation.get("activationStatus")}')
              if foundation.get('githubEnvironment') != f'iac-{env}-foundation-apply':
                  raise SystemExit('Foundation Apply GitHub Environment mismatch')
              for key in ('publicIpWrite','natGatewayWrite','loadBalancerWrite','vpnGatewayWrite','privateEndpointWrite','workloadServiceWrite','roleAssignmentWrite'):
                  if foundation.get(key) is not False:
                      raise SystemExit(f'Foundation privilege guard failed: {key}')
              apply_client=foundation.get('clientId') or ''
              if not apply_client:
                  raise SystemExit('Foundation Apply binding has no real clientId')
          state=binding['state']; azure=binding['azure']
          if state.get('authentication') != 'MicrosoftEntraID' or state.get('sharedKeyAccess') is not False:
              raise SystemExit('state must remain Entra-only')
          values={
            'environment':env,'plan_client_id':plan['clientId'],'apply_client_id':apply_client,
            'plan_environment':f'iac-{env}-plan','apply_environment':f'iac-{env}-foundation-apply',
            'tenant_id':azure['tenantId'],'subscription_id':azure['subscriptionId'],
            'state_rg':state['resourceGroup'],'state_storage':state['storageAccount']
          }
          for key,value in values.items(): print(f'{key}={value}')
          PY

  real-plan:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.plan_environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        stack: [connectivity, observability]
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.resolve.outputs.plan_client_id }}
      ARM_TENANT_ID: ${{ needs.resolve.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.resolve.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve.outputs.state_storage }}
      TARGET_ENV: ${{ needs.resolve.outputs.environment }}
      FOUNDATION_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ needs.resolve.outputs.plan_client_id }}
          tenant-id: ${{ needs.resolve.outputs.tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.subscription_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Render environment foundation tfvars and isolated backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-foundation-plan
          python - <<'PY'
          import json, os
          desired=json.load(open('enterprise-cicd/contracts/iac-platform-foundation.json'))['environments'][os.environ['TARGET_ENV']]
          stack=os.environ['FOUNDATION_STACK']
          values=dict(desired[stack])
          values['location']=desired['location']
          values['tags']={'managed_by':'terraform','environment':os.environ['TARGET_ENV'],'platform_scope':'foundation'}
          json.dump(values,open('/tmp/iac-foundation-plan/request.tfvars.json','w'),indent=2)
          PY
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope platform --stack "$FOUNDATION_STACK" --environment "$TARGET_ENV" --auth oidc \
            --output /tmp/iac-foundation-plan/backend.hcl
      - name: Real remote-state foundation Plan
        shell: bash
        run: |
          set -euo pipefail
          STACK="enterprise-cicd/terraform/stacks/platform/${FOUNDATION_STACK}"
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config=/tmp/iac-foundation-plan/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false \
            -var-file=/tmp/iac-foundation-plan/request.tfvars.json -out=/tmp/iac-foundation-plan/plan.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-foundation-plan/plan.tfplan > /tmp/iac-foundation-plan/plan.json
      - name: Enforce foundation resource boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/iac-foundation-plan/plan-summary.json
          import json, os
          stack=os.environ['FOUNDATION_STACK']; p=json.load(open('/tmp/iac-foundation-plan/plan.json'))
          changes=[]
          for rc in p.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              if actions != ['no-op']: changes.append({'address':rc.get('address'),'type':rc.get('type'),'actions':actions})
          destructive=[x for x in changes if 'delete' in x['actions']]
          if destructive: raise SystemExit(f'destructive foundation Plan forbidden: {destructive}')
          allowed={
            'connectivity':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet','azurerm_private_dns_zone','azurerm_private_dns_zone_virtual_network_link'},
            'observability':{'azurerm_resource_group','azurerm_log_analytics_workspace','azurerm_monitor_workspace'},
          }[stack]
          unexpected=sorted({x['type'] for x in changes}-allowed)
          if unexpected: raise SystemExit(f'{stack}: unexpected foundation types: {unexpected}')
          print(json.dumps({'environment':os.environ['TARGET_ENV'],'stack':stack,'changes':changes,'destructive':[],'unexpectedResourceTypes':[],'realRemoteStatePlan':True,'status':'passed'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iac-${{ needs.resolve.outputs.environment }}-foundation-plan-${{ matrix.stack }}
          path: /tmp/iac-foundation-plan
          retention-days: 30

  protected-apply:
    if: ${{ inputs.operation == 'apply' }}
    needs: [resolve, real-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.resolve.outputs.apply_environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        stack: [connectivity, observability]
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.resolve.outputs.apply_client_id }}
      ARM_TENANT_ID: ${{ needs.resolve.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.resolve.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve.outputs.state_storage }}
      TARGET_ENV: ${{ needs.resolve.outputs.environment }}
      FOUNDATION_STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ needs.resolve.outputs.apply_client_id }}
          tenant-id: ${{ needs.resolve.outputs.tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.subscription_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Render foundation desired state and backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-foundation-apply
          python - <<'PY'
          import json, os
          desired=json.load(open('enterprise-cicd/contracts/iac-platform-foundation.json'))['environments'][os.environ['TARGET_ENV']]
          values=dict(desired[os.environ['FOUNDATION_STACK']]); values['location']=desired['location']
          values['tags']={'managed_by':'terraform','environment':os.environ['TARGET_ENV'],'platform_scope':'foundation'}
          json.dump(values,open('/tmp/iac-foundation-apply/request.tfvars.json','w'),indent=2)
          PY
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope platform --stack "$FOUNDATION_STACK" --environment "$TARGET_ENV" --auth oidc \
            --output /tmp/iac-foundation-apply/backend.hcl
      - name: Exact re-plan, apply and require convergence
        shell: bash
        run: |
          set -euo pipefail
          STACK="enterprise-cicd/terraform/stacks/platform/${FOUNDATION_STACK}"
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config=/tmp/iac-foundation-apply/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false \
            -var-file=/tmp/iac-foundation-apply/request.tfvars.json -out=/tmp/iac-foundation-apply/apply.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-foundation-apply/apply.tfplan > /tmp/iac-foundation-apply/plan.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/iac-foundation-apply/plan.json'))
          bad=[]
          for rc in p.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              if 'delete' in actions: bad.append({'address':rc.get('address'),'actions':actions})
          if bad: raise SystemExit(f'destructive foundation Apply forbidden: {bad}')
          PY
          terraform -chdir="$STACK" apply -input=false -auto-approve /tmp/iac-foundation-apply/apply.tfplan
          terraform -chdir="$STACK" output -json > /tmp/iac-foundation-apply/terraform-outputs.json
          set +e
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false -detailed-exitcode \
            -var-file=/tmp/iac-foundation-apply/request.tfvars.json -out=/tmp/iac-foundation-apply/post-apply.tfplan
          rc=$?
          set -e
          test "$rc" -eq 0 || { echo "foundation did not converge; post-Apply plan rc=$rc" >&2; exit 1; }
          printf '{"status":"passed","postApplyPlan":"no-changes","remoteStateConverged":true}\n' > /tmp/iac-foundation-apply/convergence-summary.json
      - name: Verify platform foundation Azure resources
        shell: bash
        run: |
          set -euo pipefail
          DESIRED=enterprise-cicd/contracts/iac-platform-foundation.json
          if [ "$FOUNDATION_STACK" = connectivity ]; then
            RG="$(jq -r ".environments.${TARGET_ENV}.connectivity.resource_group_name" "$DESIRED")"
            VNET="$(jq -r ".environments.${TARGET_ENV}.connectivity.virtual_network_name" "$DESIRED")"
            az network vnet show -g "$RG" -n "$VNET" -o json > /tmp/iac-foundation-apply/vnet.json
            for subnet in snet-private-endpoints snet-postgresql; do
              az network vnet subnet show -g "$RG" --vnet-name "$VNET" -n "$subnet" -o json >> /tmp/iac-foundation-apply/subnets.jsonl
            done
            while IFS= read -r zone; do
              az network private-dns zone show -g "$RG" -n "$zone" -o json >> /tmp/iac-foundation-apply/private-dns.jsonl
            done < <(jq -r ".environments.${TARGET_ENV}.connectivity.private_dns_zone_names[]" "$DESIRED")
          else
            RG="$(jq -r ".environments.${TARGET_ENV}.observability.resource_group_name" "$DESIRED")"
            LAW="$(jq -r ".environments.${TARGET_ENV}.observability.log_analytics_name" "$DESIRED")"
            AMW="$(jq -r ".environments.${TARGET_ENV}.observability.monitor_workspace_name" "$DESIRED")"
            az monitor log-analytics workspace show -g "$RG" -n "$LAW" -o json > /tmp/iac-foundation-apply/log-analytics.json
            az resource show -g "$RG" -n "$AMW" --resource-type Microsoft.Monitor/accounts -o json > /tmp/iac-foundation-apply/monitor-workspace.json
          fi
          printf '{"status":"passed","stack":"%s","azureReadback":true,"postApplyPlan":"no-changes"}\n' "$FOUNDATION_STACK" > /tmp/iac-foundation-apply/verification-summary.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: iac-${{ needs.resolve.outputs.environment }}-foundation-apply-${{ matrix.stack }}
          path: /tmp/iac-foundation-apply
          retention-days: 90
