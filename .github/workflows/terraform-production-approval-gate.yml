name: Terraform Production Approval Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: production

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-production-approval-gate
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Generate Terraform Plan Artifact
    runs-on: ubuntu-24.04

    environment: production-plan

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Export Plan Evidence
        run: |
          terraform show -no-color tfplan > tfplan.txt
          sha256sum tfplan > tfplan.sha256

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan
          path: |
            infrastructure/terraform/environments/production/tfplan
            infrastructure/terraform/environments/production/tfplan.txt
            infrastructure/terraform/environments/production/tfplan.sha256
          retention-days: 7

  terraform-apply:
    name: Apply Approved Terraform Plan
    needs: terraform-plan
    runs-on: ubuntu-24.04

    environment:
      name: production-apply-approval

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Approved Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: terraform-production-plan
          path: ./artifact

      - name: Verify Plan Integrity
        run: |
          cp artifact/tfplan .
          cp artifact/tfplan.sha256 .
          sha256sum -c tfplan.sha256

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply Same Plan
        run: terraform apply -input=false tfplan
