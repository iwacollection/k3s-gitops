name: Terraform Safety Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  terraform-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Terraform Validate
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform Destroy Guard
        run: |
          echo "Destroy detection gate enabled"
          echo "Production apply must review delete/replace operations before approval"
