name: IaC All Active Catalog Real Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose activated Plan runtime and shared foundation should be used
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.binding.outputs.client_id }}
      tenant_id: ${{ steps.binding.outputs.tenant_id }}
      subscription_id: ${{ steps.binding.outputs.subscription_id }}
      github_environment: ${{ steps.binding.outputs.github_environment }}
      state_rg: ${{ steps.binding.outputs.state_rg }}
      state_storage: ${{ steps.binding.outputs.state_storage }}
      iam_fixture_principal: ${{ steps.binding.outputs.iam_fixture_principal }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve activated Plan runtime and require platform foundation readiness
        id: binding
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          b=json.load(open('enterprise-cicd/contracts/iac-runtime-bindings.json'))
          env=os.environ['TARGET_ENV']; runtime=b['environments'][env]
          plan=runtime.get('plan') or {}
          if runtime.get('activationStatus') != 'ready' or not plan.get('clientId'):
              raise SystemExit(f'{env}: Plan runtime is not activated')
          if runtime.get('foundation',{}).get('activationStatus') != 'ready':
              raise SystemExit(f'{env}: platform foundation must be applied before full Catalog Plan')
          if plan.get('resourceWriteAccess') is not False:
              raise SystemExit('Plan identity must remain resource read-only')
          state=b['state']; azure=b['azure']
          values={
            'client_id':plan['clientId'],'tenant_id':azure['tenantId'],'subscription_id':azure['subscriptionId'],
            'github_environment':f'iac-{env}-plan','state_rg':state['resourceGroup'],'state_storage':state['storageAccount'],
            'iam_fixture_principal':plan['principalId']
          }
          for k,v in values.items(): print(f'{k}={v}')
          PY

  real-plan:
    needs: binding
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.binding.outputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service:
          - managed-identity
          - network
          - iam-role-binding
          - load-balancer
          - vpn-gateway
          - acr
          - storage
          - key-vault
          - service-bus
          - managed-redis
          - postgresql-flexible
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.binding.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.binding.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.binding.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.binding.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.binding.outputs.state_storage }}
      TARGET_ENV: ${{ inputs.environment }}
      SERVICE: ${{ matrix.service }}
      IAM_FIXTURE_PRINCIPAL: ${{ needs.binding.outputs.iam_fixture_principal }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ needs.binding.outputs.client_id }}
          tenant-id: ${{ needs.binding.outputs.tenant_id }}
          subscription-id: ${{ needs.binding.outputs.subscription_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Prepare governed real-Plan fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          DIR=/tmp/iac-all-catalog-plan
          mkdir -p "$DIR"
          cp "enterprise-cicd/iac-catalog/services/${SERVICE}/v1/request.example.json" "$DIR/request.json"
          python - <<'PY'
          import json, os
          p='/tmp/iac-all-catalog-plan/request.json'; r=json.load(open(p))
          r['spec']['environment']=os.environ['TARGET_ENV']
          r['metadata']['name']=f"delivery-real-plan-{os.environ['SERVICE']}"
          r['metadata']['application']='iac-delivery-plan'
          if os.environ['SERVICE'] == 'iam-role-binding':
              r['spec']['parameters'].update({
                'principalId':os.environ['IAM_FIXTURE_PRINCIPAL'],
                'principalType':'ServicePrincipal','roleName':'Reader',
                'scopeResourceId':f"/subscriptions/{os.environ['ARM_SUBSCRIPTION_ID']}/resourceGroups/rg-platform-cicd",
              })
          json.dump(r,open(p,'w'),indent=2)
          PY
          python enterprise-cicd/iac-catalog/render_request.py --request "$DIR/request.json" --output "$DIR/request.tfvars.json"
          STACK="$(python - <<'PY'
          import json, os
          c=json.load(open(f"enterprise-cicd/iac-catalog/services/{os.environ['SERVICE']}/v1/catalog.json"))
          assert c['lifecycle']=='active'; print(c['rootStack'])
          PY
          )"
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog --environment "$TARGET_ENV" --service "$SERVICE" --request "delivery-real-plan-${SERVICE}" --auth oidc \
            --output "$DIR/backend.hcl"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
      - name: Run real Entra remote-state Plan
        shell: bash
        env:
          STACK: ${{ steps.fixture.outputs.stack }}
        run: |
          set -euo pipefail
          DIR=/tmp/iac-all-catalog-plan
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config="$DIR/backend.hcl"
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false \
            -var-file="$DIR/request.tfvars.json" -out="$DIR/plan.tfplan"
          terraform -chdir="$STACK" show -json "$DIR/plan.tfplan" > "$DIR/plan.json"
      - name: Enforce service Plan resource boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/iac-all-catalog-plan/plan-summary.json
          import json, os
          service=os.environ['SERVICE']; p=json.load(open('/tmp/iac-all-catalog-plan/plan.json'))
          changes=[]
          for rc in p.get('resource_changes',[]):
              if rc.get('mode','managed') != 'managed': continue
              actions=rc.get('change',{}).get('actions',[])
              if actions != ['no-op']: changes.append({'address':rc.get('address'),'type':rc.get('type'),'actions':actions})
          destructive=[x for x in changes if 'delete' in x['actions']]
          if destructive: raise SystemExit(f'{service}: destructive Catalog Plan forbidden: {destructive}')
          allowed={
            'managed-identity':{'azurerm_resource_group','azurerm_user_assigned_identity'},
            'network':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet'},
            'iam-role-binding':{'azurerm_role_assignment'},
            'load-balancer':{'azurerm_resource_group','azurerm_public_ip','azurerm_lb','azurerm_lb_backend_address_pool','azurerm_lb_probe','azurerm_lb_rule'},
            'vpn-gateway':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet','azurerm_public_ip','azurerm_virtual_network_gateway'},
            'acr':{'azurerm_resource_group','azurerm_container_registry'},
            'storage':{'azurerm_resource_group','azurerm_storage_account','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'key-vault':{'azurerm_resource_group','azurerm_key_vault','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'service-bus':{'azurerm_resource_group','azurerm_servicebus_namespace','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'managed-redis':{'azurerm_resource_group','azurerm_managed_redis','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'postgresql-flexible':{'terraform_data','azurerm_resource_group','azurerm_postgresql_flexible_server','azurerm_postgresql_flexible_server_active_directory_administrator','azurerm_management_lock'},
          }[service]
          unexpected=sorted({x['type'] for x in changes}-allowed)
          if unexpected: raise SystemExit(f'{service}: unexpected resource types {unexpected}')
          if not changes: raise SystemExit(f'{service}: fixture must exercise a real managed-resource Plan')
          print(json.dumps({'environment':os.environ['TARGET_ENV'],'service':service,'realRemoteStatePlan':True,'changes':changes,'destructive':[],'unexpectedResourceTypes':[],'status':'passed'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iac-${{ inputs.environment }}-all-catalog-real-plan-${{ matrix.service }}
          path: /tmp/iac-all-catalog-plan
          retention-days: 30

  gate:
    if: ${{ always() }}
    needs: [binding, real-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Require all 11 active Catalog real Plans
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.binding.result }}' = success
          test '${{ needs.real-plan.result }}' = success
          echo 'ALL_ACTIVE_CATALOG_REAL_PLAN=PASSED'
