name: Azure DEV GitOps Activation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Open the governed promotion PR, or observe after Flux has reconciled the merged PR
        required: true
        default: promote
        type: choice
        options:
          - promote
          - observe
      release_request:
        description: Committed DEV Release Request under enterprise-cicd/release-requests/
        required: true
        default: enterprise-cicd/release-requests/go-smoke-to-dev.example.json
        type: string
      cluster_binding:
        description: Governed AKS cluster binding used by the read-only observation workflow
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.request.outputs.application }}
      environment: ${{ steps.request.outputs.environment }}
      artifact_repository: ${{ steps.request.outputs.artifact_repository }}
      artifact_digest: ${{ steps.request.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@v4
      - id: request
        name: Resolve and validate DEV release request
        shell: bash
        env:
          REQUEST: ${{ inputs.release_request }}
        run: |
          set -euo pipefail
          case "$REQUEST" in
            enterprise-cicd/release-requests/*.json) ;;
            *) echo "Release request must be committed under enterprise-cicd/release-requests/." >&2; exit 1 ;;
          esac
          test -f "$REQUEST"
          test "$(jq -r .spec.to "$REQUEST")" = dev
          DIGEST="$(jq -r .spec.artifactDigest "$REQUEST")"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "application=$(jq -r .metadata.application "$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "environment=dev" >> "$GITHUB_OUTPUT"
          echo "artifact_repository=$(jq -r .spec.artifactRepository "$REQUEST")" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$DIGEST" >> "$GITHUB_OUTPUT"

  promote:
    if: ${{ inputs.phase == 'promote' }}
    needs: resolve
    uses: ./.github/workflows/gitops-promotion.yml
    with:
      release_request: ${{ inputs.release_request }}

  observe:
    if: ${{ inputs.phase == 'observe' }}
    needs: resolve
    uses: ./.github/workflows/reusable-cd-post-deploy-v1.yml
    with:
      cluster_binding: ${{ inputs.cluster_binding }}
      application: ${{ needs.resolve.outputs.application }}
      environment: ${{ needs.resolve.outputs.environment }}
      artifact_repository: ${{ needs.resolve.outputs.artifact_repository }}
      artifact_digest: ${{ needs.resolve.outputs.artifact_digest }}
    secrets: inherit
