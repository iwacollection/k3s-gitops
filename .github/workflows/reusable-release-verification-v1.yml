name: Reusable Release Verification v1

on:
  workflow_call:
    inputs:
      observation_artifact_name:
        required: true
        type: string
      observation_file:
        required: false
        type: string
        default: deployment-observation.json
    outputs:
      verification_status:
        description: passed or failed
        value: ${{ jobs.verify.outputs.status }}

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.evaluate.outputs.status }}
      application: ${{ steps.evaluate.outputs.application }}
      environment: ${{ steps.evaluate.outputs.environment }}
    steps:
      - name: Checkout approved GitOps state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download read-only deployment observation
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.observation_artifact_name }}
          path: .platform-verification

      - name: Evaluate deployment gates
        id: evaluate
        shell: bash
        env:
          OBSERVATION_FILE: ${{ inputs.observation_file }}
        run: |
          set -euo pipefail
          observation=".platform-verification/$OBSERVATION_FILE"
          result=".platform-verification/verification-result.json"
          test -f "$observation"

          set +e
          python enterprise-cicd/promotion/verification/evaluate.py \
            --observation "$observation" \
            --output "$result"
          rc=$?
          set -e

          if [[ "$rc" != "0" && "$rc" != "2" ]]; then
            exit "$rc"
          fi

          status=$(jq -r .spec.status "$result")
          application=$(jq -r .metadata.application "$result")
          environment=$(jq -r .metadata.environment "$result")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      - name: Record passed release as approved state
        if: steps.evaluate.outputs.status == 'passed'
        shell: bash
        run: |
          set -euo pipefail
          python enterprise-cicd/promotion/record_approved_release.py \
            --verification-result .platform-verification/verification-result.json

      - name: Render rollback to previous approved digest
        if: steps.evaluate.outputs.status == 'failed'
        shell: bash
        env:
          APP: ${{ steps.evaluate.outputs.application }}
          ENVIRONMENT: ${{ steps.evaluate.outputs.environment }}
        run: |
          set -euo pipefail
          python enterprise-cicd/promotion/render_rollback.py \
            --application "$APP" \
            --environment "$ENVIRONMENT" \
            --verification-result .platform-verification/verification-result.json
          kubectl kustomize "enterprise-cicd/gitops/environments/$ENVIRONMENT" > /tmp/rollback-rendered.yaml
          if grep -nE 'image: .*:latest([[:space:]]|$)' /tmp/rollback-rendered.yaml; then
            echo 'Mutable latest image is forbidden in rollback desired state.' >&2
            exit 1
          fi

      - name: Open governed evidence or rollback PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.evaluate.outputs.status }}
          APP: ${{ steps.evaluate.outputs.application }}
          ENVIRONMENT: ${{ steps.evaluate.outputs.environment }}
        run: |
          set -euo pipefail
          if git diff --quiet -- enterprise-cicd/gitops; then
            echo 'No GitOps audit state change was produced.' >&2
            exit 1
          fi

          branch="cd/${STATUS}/${APP}/${ENVIRONMENT}/${GITHUB_RUN_ID}"
          git config user.name enterprise-cicd-bot
          git config user.email enterprise-cicd-bot@users.noreply.github.com
          git checkout -b "$branch"
          git add enterprise-cicd/gitops
          git commit -m "chore(cd): ${STATUS} ${APP} in ${ENVIRONMENT}"
          git push origin "$branch"

          if [[ "$STATUS" == "passed" ]]; then
            title="chore(cd): approve ${APP} in ${ENVIRONMENT}"
            action='Record the verified digest as the approved rollback baseline.'
          else
            title="revert(cd): rollback ${APP} in ${ENVIRONMENT}"
            action='Restore the previous approved digest because verification gates failed.'
          fi

          cat > /tmp/cd-pr.md <<EOF
          ## CD verification result

          - Application: \`${APP}\`
          - Environment: \`${ENVIRONMENT}\`
          - Status: \`${STATUS}\`
          - Action: ${action}

          The workflow changes Git desired/audit state only. Kubernetes reconciliation remains owned by Flux.
          EOF

          gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/cd-pr.md

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ steps.evaluate.outputs.application }}-${{ steps.evaluate.outputs.environment }}-${{ github.run_id }}
          path: .platform-verification/
          if-no-files-found: error
          retention-days: 90
