name: Enterprise Security Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  runner-security:
    name: Runner Security Baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate workflow security controls
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking GitHub Actions governance baseline"
          test -d .github/workflows

  dependency-security:
    name: Dependency and Supply Chain Scan
    runs-on: ubuntu-24.04
    needs: runner-security
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

      # GitHub Dependency Review requires Dependency Graph to be enabled in
      # repository settings. Keep the capability explicit rather than failing
      # every PR when that repository feature is unavailable.
      - name: Dependency Review
        if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@v4

      - name: Dependency Review capability notice
        if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW != 'true'
        shell: bash
        run: |
          echo 'Dependency Review is not enforced yet.'
          echo 'Enable GitHub Dependency Graph and set repository variable ENABLE_DEPENDENCY_REVIEW=true to activate it.'

  secret-governance:
    name: Secret Governance Check
    runs-on: ubuntu-24.04
    needs: runner-security
    steps:
      - name: Checkout full history for Gitleaks range scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-security:
    name: Container Supply Chain Security
    runs-on: ubuntu-24.04
    needs: runner-security
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  oidc-governance:
    name: OIDC Federation Governance
    runs-on: ubuntu-24.04
    needs: runner-security
    steps:
      - name: Validate OIDC boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Production workflows must use short-lived OIDC credentials."
          echo "Long-lived cloud access keys must not be introduced."

  security-gate:
    name: Enterprise Security Gate
    runs-on: ubuntu-24.04
    needs:
      - dependency-security
      - secret-governance
      - container-security
      - oidc-governance
    steps:
      - name: Security approval gate passed
        run: echo "All enterprise security governance checks passed"
