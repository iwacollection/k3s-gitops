name: Terraform Policy Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'policy/terraform/**'
      - '.github/workflows/terraform-policy-gate.yml'

permissions:
  contents: read

jobs:
  policy:
    name: Terraform Policy Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/production
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Install Checkov
        run: pip install --disable-pip-version-check 'checkov>=3,<4'

      - name: IaC Security Scan
        run: checkov -d infrastructure/terraform --framework terraform

      - name: Install Conftest 0.69.0
        shell: bash
        run: |
          set -euo pipefail
          version='0.69.0'
          archive="conftest_${version}_Linux_x86_64.tar.gz"
          base_url="https://github.com/open-policy-agent/conftest/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base_url/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base_url/checksums.txt" --output checksums.txt
          grep "  $archive$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" -C /tmp conftest
          install -m 0755 /tmp/conftest /usr/local/bin/conftest
          conftest --version

      - name: Policy rule regression test
        shell: bash
        run: |
          set -euo pipefail
          fixture='policy/terraform/tests/production-plan-policy-fixture.json'
          output='/tmp/conftest-policy-output.txt'

          set +e
          conftest test \
            --policy policy/terraform \
            --namespace terraform \
            --output stdout \
            "$fixture" >"$output" 2>&1
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo '::error::Policy regression fixture unexpectedly passed. Fail-closed policy tests are broken.'
            cat "$output"
            exit 1
          fi

          for policy_id in PG001 PG002 PG003 PG004 PG005 PG006 PG007 PG008 PG009; do
            if ! grep -q "$policy_id" "$output"; then
              echo "::error::Expected $policy_id was not triggered by the regression fixture."
              cat "$output"
              exit 1
            fi
          done

          echo 'All PG001-PG009 policy rules are executable and fail closed on the negative fixture.'
          cat "$output"

      - name: Policy enforcement boundary
        shell: bash
        run: |
          cat <<'EOF'
          This PR job validates the Rego policy engine with a deterministic negative fixture.
          It intentionally does not claim to be an Azure-backed production Plan.
          The production enforcement boundary must evaluate the actual remote-state Plan JSON
          immediately before production Apply.
          EOF
