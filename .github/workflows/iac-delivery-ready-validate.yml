name: IaC Delivery Ready Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/activation/iac/activate-iac-delivery-capabilities.sh'
      - 'enterprise-cicd/activation/iac/activate-iac-edge-network-capability.sh'
      - 'enterprise-cicd/activation/iac/activate-iac-iam-capability.sh'
      - 'enterprise-cicd/iac-catalog/README.md'
      - 'enterprise-cicd/iac-requests/README.md'
      - '.github/workflows/iac-delivery-ready-validate.yml'
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
    paths:
      - 'enterprise-cicd/activation/iac/activate-iac-delivery-capabilities.sh'
      - 'enterprise-cicd/activation/iac/activate-iac-edge-network-capability.sh'
      - 'enterprise-cicd/activation/iac/activate-iac-iam-capability.sh'
      - 'enterprise-cicd/iac-catalog/README.md'
      - 'enterprise-cicd/iac-requests/README.md'
      - '.github/workflows/iac-delivery-ready-validate.yml'

permissions:
  contents: read

jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate delivery activation scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            enterprise-cicd/activation/iac/activate-iac-delivery-capabilities.sh \
            enterprise-cicd/activation/iac/activate-iac-edge-network-capability.sh \
            enterprise-cicd/activation/iac/activate-iac-iam-capability.sh; do
            bash -n "$script"
          done

      - name: Validate delivery entry point and developer contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          wrapper = (root / 'enterprise-cicd/activation/iac/activate-iac-delivery-capabilities.sh').read_text()
          catalog_readme = (root / 'enterprise-cicd/iac-catalog/README.md').read_text()
          request_readme = (root / 'enterprise-cicd/iac-requests/README.md').read_text()

          for token in (
              '--environment dev|test|prod',
              '--apply',
              'activate-iac-edge-network-capability.sh',
              'activate-iac-iam-capability.sh',
              'READY_FOR_IAC_EDGE_GITHUB_BINDING',
              'READY_FOR_IAC_IAM_GITHUB_BINDING',
              'READY_FOR_IAC_DELIVERY_BINDINGS',
              'PLAN ONLY - no Azure mutation',
          ):
              assert token in wrapper, f'delivery wrapper missing contract token: {token}'

          services = (
              'network',
              'managed-identity',
              'iam-role-binding',
              'load-balancer',
              'vpn-gateway',
          )
          for service in services:
              catalog = root / f'enterprise-cicd/iac-catalog/services/{service}/v1/catalog.json'
              assert catalog.is_file(), f'missing V1 delivery catalog: {service}'
              data = json.loads(catalog.read_text())
              assert data.get('lifecycle') == 'active', f'{service}/v1 must be active'
              assert service in catalog_readme, f'catalog README missing {service}'
              assert service in request_readme, f'developer README missing {service}'

          for token in (
              'real Terraform Plan',
              'Entra-only remote backend',
              'Deleting an InfrastructureRequest is **not** a destroy mechanism',
              'Owner',
              'Contributor',
              'VPN Connection/PSK',
          ):
              assert token in request_readme, f'developer delivery contract missing: {token}'

          print('IaC V1 delivery entry point and developer request contract are valid.')
          PY
