name: Terraform Production Plan Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-plan-artifact.yml'

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Generate Terraform Plan Artifact
    runs-on: ubuntu-24.04
    environment: production

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.9'

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=production.tfplan

      - name: Export Plan JSON
        run: terraform show -json production.tfplan > production.tfplan.json

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan
          path: |
            infrastructure/terraform/environments/production/production.tfplan
            infrastructure/terraform/environments/production/production.tfplan.json
          retention-days: 7
