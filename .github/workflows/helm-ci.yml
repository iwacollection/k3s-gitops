name: Helm CI

on:
  pull_request:
    paths:
      - 'helm/**'

jobs:
  helm-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint helm/enterprise-cmdb
      - name: Helm template validation
        run: helm template enterprise-cmdb helm/enterprise-cmdb >/tmp/rendered.yaml
