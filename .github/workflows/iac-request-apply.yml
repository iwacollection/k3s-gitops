name: IaC Request Canonical Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, prod]
      request_path:
        description: Committed InfrastructureRequest path
        required: true
        type: string
      confirm_billable:
        description: Required when catalog billingImpact= billable
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      service: ${{ steps.resolve.outputs.service }}
      request_name: ${{ steps.resolve.outputs.request_name }}
      stack: ${{ steps.resolve.outputs.stack }}
      apply_mode: ${{ steps.resolve.outputs.apply_mode }}
      capability: ${{ steps.resolve.outputs.capability }}
      client_id: ${{ steps.resolve.outputs.client_id }}
      tenant_id: ${{ steps.resolve.outputs.tenant_id }}
      subscription_id: ${{ steps.resolve.outputs.subscription_id }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      state_rg: ${{ steps.resolve.outputs.state_rg }}
      state_storage: ${{ steps.resolve.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve catalog to one isolated Apply plane
        id: resolve
        env:
          TARGET_ENV: ${{ inputs.environment }}
          REQUEST_PATH: ${{ inputs.request_path }}
          CONFIRM_BILLABLE: ${{ inputs.confirm_billable }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path, PurePosixPath

          env=os.environ['TARGET_ENV']
          raw=os.environ['REQUEST_PATH'].strip()
          confirmed=os.environ['CONFIRM_BILLABLE'].lower() == 'true'
          if env not in {'dev','test','prod'}:
              raise SystemExit('unsupported environment')
          if not raw or raw.startswith('/') or '..' in PurePosixPath(raw).parts:
              raise SystemExit('unsafe request_path')
          if not raw.startswith(f'enterprise-cicd/iac-requests/{env}/') or not raw.endswith('.json') or raw.endswith('.example.json'):
              raise SystemExit(f'request_path must be a committed {env} InfrastructureRequest')
          path=Path(raw)
          if not path.is_file():
              raise SystemExit(f'request missing at current ref: {raw}')
          req=json.loads(path.read_text()); spec=req['spec']; meta=req['metadata']
          if req.get('apiVersion') != 'platform.iac/v1' or req.get('kind') != 'InfrastructureRequest':
              raise SystemExit('invalid InfrastructureRequest envelope')
          if spec['environment'] != env:
              raise SystemExit('request environment mismatch')

          service=spec['service']; version=spec['templateVersion']
          catalog_path=Path(f'enterprise-cicd/iac-catalog/services/{service}/{version}/catalog.json')
          if not catalog_path.is_file():
              raise SystemExit(f'catalog not found: {service}/{version}')
          catalog=json.loads(catalog_path.read_text())
          if catalog.get('lifecycle') != 'active':
              raise SystemExit(f'{service}/{version} is not active')
          apply_mode=catalog.get('applyMode')
          routes={
              'standard-oidc':'apply',
              'protected-edge-oidc':'edge',
              'dedicated-iam-oidc':'iam',
              'protected-workload-oidc':'workload',
          }
          if apply_mode not in routes:
              raise SystemExit(f'active catalog has no supported Apply route: {service}/{version} applyMode={apply_mode!r}')
          capability=routes[apply_mode]
          if catalog.get('billingImpact') == 'billable' and not confirmed:
              raise SystemExit(f'{service} is billable; rerun with confirm_billable=true after reviewing the Terraform Plan')

          binding=json.loads(Path('enterprise-cicd/contracts/iac-runtime-bindings.json').read_text())
          runtime=binding['environments'][env]
          if capability == 'apply':
              if runtime.get('activationStatus') != 'ready':
                  raise SystemExit(f'{env} standard runtime is not activated')
              plane=runtime.get('apply') or {}
              github_env=f'iac-{env}-apply'
              if service == 'network':
                  nf=runtime.get('networkFoundation') or {}
                  if nf.get('activationStatus') != 'ready':
                      raise SystemExit(f'{env} network foundation capability is not activated')
          else:
              plane=runtime.get(capability) or {}
              github_env=f'iac-{env}-{capability}-apply'
              if plane.get('activationStatus') != 'ready':
                  raise SystemExit(f'{env}/{capability} Apply plane is not activated: {plane.get("activationStatus")}')

          if plane.get('githubEnvironment') != github_env:
              raise SystemExit(f'GitHub Environment mismatch: expected {github_env}')
          if plane.get('stateDataRole') != 'Storage Blob Data Contributor' or plane.get('stateScope') != 'container':
              raise SystemExit('Apply plane must have container-scoped Storage Blob Data Contributor')
          if not plane.get('clientId'):
              raise SystemExit(f'{env}/{capability} binding has no real clientId')
          if capability in {'apply','edge','workload'} and plane.get('roleAssignmentWrite') is not False:
              raise SystemExit(f'{capability} plane must not receive RBAC write')
          if capability == 'edge':
              for key in ('genericNetworkContributor','peeringWrite','natGatewayWrite','applicationGatewayWrite','vpnConnectionWrite'):
                  if plane.get(key) is not False: raise SystemExit(f'edge guard failed: {key}')
          if capability == 'iam':
              if plane.get('delegation') != 'conditioned-rbac-administrator': raise SystemExit('IAM delegation changed')
              if plane.get('allowedPrincipalType') != 'ServicePrincipal': raise SystemExit('IAM principal type widened')
              if set(plane.get('allowedRoles',[])) != {'Reader','AcrPull','Storage Blob Data Reader','Key Vault Secrets User'}:
                  raise SystemExit('IAM role allowlist changed')
          if capability == 'workload':
              expected={'acr','storage','key-vault','service-bus','managed-redis','postgresql-flexible'}
              if service not in expected or set(plane.get('supportedServices',[])) != expected:
                  raise SystemExit('workload service coverage mismatch')
              for key in ('serviceCredentialRead','keyVaultSecretDataAccess','genericNetworkContributor'):
                  if plane.get(key) is not False: raise SystemExit(f'workload guard failed: {key}')

          azure=binding['azure']; state=binding['state']
          if state.get('authentication') != 'MicrosoftEntraID' or state.get('sharedKeyAccess') is not False:
              raise SystemExit('state must remain Entra-only')
          values={
              'environment':env,'service':service,'request_name':meta['name'],'stack':catalog['rootStack'],
              'apply_mode':apply_mode,'capability':capability,'client_id':plane['clientId'],
              'tenant_id':azure['tenantId'],'subscription_id':azure['subscriptionId'],'github_environment':github_env,
              'state_rg':state['resourceGroup'],'state_storage':state['storageAccount']
          }
          for key,value in values.items(): print(f'{key}={value}')
          PY

  exact-plan-apply:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ needs.resolve.outputs.github_environment }}
    concurrency:
      group: iac-${{ needs.resolve.outputs.environment }}-${{ needs.resolve.outputs.capability }}-canonical-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.resolve.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.resolve.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.resolve.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve.outputs.state_storage }}
      REQUEST_PATH: ${{ inputs.request_path }}
      TARGET_ENV: ${{ needs.resolve.outputs.environment }}
      SERVICE: ${{ needs.resolve.outputs.service }}
      REQUEST_NAME: ${{ needs.resolve.outputs.request_name }}
      STACK: ${{ needs.resolve.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login using resolved isolated Apply OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ needs.resolve.outputs.client_id }}
          tenant-id: ${{ needs.resolve.outputs.tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.subscription_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Render request and Entra-only state backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-canonical-apply
          python enterprise-cicd/iac-catalog/render_request.py --request "$REQUEST_PATH" --output /tmp/iac-canonical-apply/request.tfvars.json
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog --environment "$TARGET_ENV" --service "$SERVICE" --request "$REQUEST_NAME" --auth oidc \
            --output /tmp/iac-canonical-apply/backend.hcl

      - name: Exact re-plan with native state lock
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config=/tmp/iac-canonical-apply/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false \
            -var-file=/tmp/iac-canonical-apply/request.tfvars.json -out=/tmp/iac-canonical-apply/apply.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-canonical-apply/apply.tfplan > /tmp/iac-canonical-apply/plan.json

      - name: Enforce service resource boundary and forbid delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/iac-canonical-apply/plan-summary.json
          import json, os
          service=os.environ['SERVICE']
          plan=json.load(open('/tmp/iac-canonical-apply/plan.json'))
          changes=[]
          for rc in plan.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              if actions != ['no-op']:
                  changes.append({'address':rc.get('address'),'type':rc.get('type'),'actions':actions})
          destructive=[x for x in changes if 'delete' in x['actions']]
          if destructive:
              raise SystemExit(f'destructive Apply forbidden; use governed decommission: {destructive}')
          allowed={
            'managed-identity':{'azurerm_resource_group','azurerm_user_assigned_identity'},
            'network':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet'},
            'iam-role-binding':{'azurerm_role_assignment'},
            'load-balancer':{'azurerm_resource_group','azurerm_public_ip','azurerm_lb','azurerm_lb_backend_address_pool','azurerm_lb_probe','azurerm_lb_rule'},
            'vpn-gateway':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet','azurerm_public_ip','azurerm_virtual_network_gateway'},
            'acr':{'azurerm_resource_group','azurerm_container_registry'},
            'storage':{'azurerm_resource_group','azurerm_storage_account','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'key-vault':{'azurerm_resource_group','azurerm_key_vault','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'service-bus':{'azurerm_resource_group','azurerm_servicebus_namespace','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'managed-redis':{'azurerm_resource_group','azurerm_managed_redis','azurerm_private_endpoint','azurerm_private_dns_zone_group','azurerm_monitor_diagnostic_setting','azurerm_management_lock'},
            'postgresql-flexible':{'terraform_data','azurerm_resource_group','azurerm_postgresql_flexible_server','azurerm_postgresql_flexible_server_active_directory_administrator','azurerm_management_lock'},
          }[service]
          unexpected=sorted({x['type'] for x in changes}-allowed)
          if unexpected:
              raise SystemExit(f'{service}: unexpected Terraform resource types: {unexpected}')
          print(json.dumps({'service':service,'changes':changes,'destructive':[],'unexpectedResourceTypes':[],'stateLock':True,'exactSavedPlan':True,'status':'approved-for-apply'},indent=2))
          PY

      - name: Apply exact saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" apply -input=false -auto-approve /tmp/iac-canonical-apply/apply.tfplan
          terraform -chdir="$STACK" output -json > /tmp/iac-canonical-apply/terraform-outputs.json

      - name: Require post-Apply Terraform convergence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false -detailed-exitcode \
            -var-file=/tmp/iac-canonical-apply/request.tfvars.json -out=/tmp/iac-canonical-apply/post-apply.tfplan
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            terraform -chdir="$STACK" show -json /tmp/iac-canonical-apply/post-apply.tfplan > /tmp/iac-canonical-apply/post-apply-plan.json
            printf '{"status":"passed","postApplyPlan":"no-changes","remoteStateConverged":true}\n' | tee /tmp/iac-canonical-apply/convergence-summary.json
          elif [ "$rc" -eq 2 ]; then
            terraform -chdir="$STACK" show -json /tmp/iac-canonical-apply/post-apply.tfplan > /tmp/iac-canonical-apply/post-apply-plan.json
            echo 'Apply completed but Terraform still proposes changes; refusing delivery success.' >&2
            exit 1
          else
            echo "post-Apply plan failed rc=$rc" >&2
            exit "$rc"
          fi

      - name: Verify primary Azure resources are readable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/iac-canonical-apply/resource-ids.txt
          import json, re
          outputs=json.load(open('/tmp/iac-canonical-apply/terraform-outputs.json'))
          def walk(value):
              if isinstance(value,str) and value.lower().startswith('/subscriptions/') and '/providers/' in value.lower():
                  yield value
              elif isinstance(value,dict):
                  for v in value.values(): yield from walk(v)
              elif isinstance(value,list):
                  for v in value: yield from walk(v)
          ids=[]
          for output in outputs.values(): ids.extend(walk(output.get('value')))
          for rid in sorted(set(ids)):
              print(rid)
          PY
          : > /tmp/iac-canonical-apply/azure-resource-verification.jsonl
          while IFS= read -r rid; do
            [ -n "$rid" ] || continue
            if [[ "$rid" == *"/providers/Microsoft.Authorization/roleAssignments/"* ]]; then
              az rest --method get --url "https://management.azure.com${rid}?api-version=2022-04-01" -o json >> /tmp/iac-canonical-apply/azure-resource-verification.jsonl
            else
              az resource show --ids "$rid" -o json >> /tmp/iac-canonical-apply/azure-resource-verification.jsonl
            fi
          done < /tmp/iac-canonical-apply/resource-ids.txt
          printf '{"status":"passed","azureReadback":true,"postApplyPlan":"no-changes"}\n' | tee /tmp/iac-canonical-apply/verification-summary.json

      - name: Publish canonical Apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iac-${{ needs.resolve.outputs.environment }}-canonical-apply-${{ needs.resolve.outputs.request_name }}
          path: /tmp/iac-canonical-apply
          if-no-files-found: error
          retention-days: 90
