name: Build Platform Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/build-images/**'
      - 'enterprise-cicd/ci-catalog/**'
      - 'enterprise-cicd/ci-scripts/**'
      - 'enterprise-cicd/dependency-proxy/**'
      - 'enterprise-cicd/security/**'
      - 'enterprise-cicd/github-actions/reusable/**'
      - 'enterprise-cicd/github-actions/policies/**'
      - 'enterprise-cicd/testing/contracts/validate_build_platform.py'
      - '.github/workflows/reusable-application-ci-v2.yml'
      - '.github/workflows/reusable-application-ci-matrix-v2.yml'
      - '.github/workflows/reusable-application-ci-v1.yml'
      - '.github/workflows/reusable-application-ci-matrix-v1.yml'
      - '.github/workflows/enterprise-ci-reusable.yml'
      - '.github/workflows/build-platform-validate.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise-cicd/build-images/**'
      - 'enterprise-cicd/ci-catalog/**'
      - 'enterprise-cicd/ci-scripts/**'
      - 'enterprise-cicd/dependency-proxy/**'
      - 'enterprise-cicd/security/**'
      - 'enterprise-cicd/github-actions/reusable/**'
      - 'enterprise-cicd/github-actions/policies/**'
      - 'enterprise-cicd/testing/contracts/validate_build_platform.py'
      - '.github/workflows/reusable-application-ci-v2.yml'
      - '.github/workflows/reusable-application-ci-matrix-v2.yml'
      - '.github/workflows/reusable-application-ci-v1.yml'
      - '.github/workflows/reusable-application-ci-matrix-v1.yml'
      - '.github/workflows/enterprise-ci-reusable.yml'
      - '.github/workflows/build-platform-validate.yml'

permissions:
  contents: read

jobs:
  validate-build-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build image/profile/security/DAG contracts
        run: python enterprise-cicd/testing/contracts/validate_build_platform.py

      - name: Compile Python platform helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            enterprise-cicd/ci-scripts/common/resolve_application.py \
            enterprise-cicd/ci-scripts/common/prepare_build_env.py \
            enterprise-cicd/testing/contracts/validate_build_platform.py

      - name: Verify canonical CI v2 never deploys to Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/reusable-application-ci-v2.yml
          if grep -nE 'kubectl[[:space:]]+apply|helm[[:space:]]+(upgrade|install)|az[[:space:]]+aks[[:space:]]+get-credentials|terraform[[:space:]]+apply' "$workflow"; then
            echo 'Canonical Application CI v2 must not contain infrastructure or Kubernetes deployment commands.' >&2
            exit 1
          fi

      - name: Verify immutable artifact and builder contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/reusable-application-ci-v2.yml
          grep -F 'GITHUB_SHA' "$workflow"
          grep -F -- '--sbom=true' "$workflow"
          grep -F -- '--provenance=mode=max' "$workflow"
          grep -F 'cosign sign --yes' "$workflow"
          grep -F 'COMMITTED_DIGEST' "$workflow"
          grep -F 'LIVE_DIGEST' "$workflow"
          grep -F '@$COMMITTED_DIGEST' "$workflow"
          grep -F 'builder:{image:$buildImage,digest:$buildImageDigest}' "$workflow"
          grep -F 'BuildImageDigestBinding' enterprise-cicd/build-images/digests/active.json
          grep -F '"mutableTagExecutionAllowed": false' enterprise-cicd/build-images/digests/active.json

      - name: Verify monorepo and dependency-cache isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/reusable-application-ci-v2.yml
          grep -F 'source_path:' "$workflow"
          grep -F 'scan-ref:' "$workflow"
          grep -F -- '--workspace' "$workflow"
          grep -F 'cache_restore_prefix=' "$workflow"
          grep -F 'cacheRestorePrefix' enterprise-cicd/ci-scripts/common/prepare_build_env.py
          grep -F 'buildImageDigest' enterprise-cicd/ci-scripts/common/prepare_build_env.py
          grep -F 'tar --exclude=' "$workflow"
          grep -F 'docker pull "$IMAGE_REF"' "$workflow"
          if grep -F 'docker pull "$LOGIN_SERVER/build/' "$workflow"; then
            echo 'Mutable build-image tag execution is forbidden.' >&2
            exit 1
          fi

      - name: Verify v2 DAG and matrix orchestration
        shell: bash
        run: |
          set -euo pipefail
          dag=.github/workflows/reusable-application-ci-v2.yml
          matrix=.github/workflows/reusable-application-ci-matrix-v2.yml

          grep -F 'needs: [resolve, source-scan, build-test]' "$dag"
          grep -F 'needs: [resolve, image-build, image-scan, sbom]' "$dag"
          grep -F 'needs: [resolve, image-build, image-scan, sbom, sign]' "$dag"
          grep -F 'needs: [resolve, build-test, image-build, image-scan, sbom, sign]' "$dag"
          grep -F 'strategy:' "$matrix"
          grep -F 'matrix:' "$matrix"
          grep -F 'max-parallel: 4' "$matrix"
          grep -F 'length > 20' "$matrix"
          grep -F 'uses: ./.github/workflows/reusable-application-ci-v2.yml' "$matrix"
          grep -F 'github_environment:' "$matrix"

      - name: Verify caller/reusable separation and platform OIDC ownership
        shell: bash
        run: |
          set -euo pipefail
          policy=enterprise-cicd/github-actions/policies/reusable-workflow-consumption.json
          caller=enterprise-cicd/github-actions/policies/application-caller.example.yml
          test ! -e enterprise-cicd/github-actions/reusable/application-ci.yml
          grep -F '"singleApplicationWorkflow": ".github/workflows/reusable-application-ci-v2.yml"' "$policy"
          grep -F '"matrixWorkflow": ".github/workflows/reusable-application-ci-matrix-v2.yml"' "$policy"
          grep -F '"azureAuthentication": "platform-environment-oidc-binding"' "$policy"
          grep -F '"callerSuppliedAzureIdentitySecretsAllowed": false' "$policy"
          grep -F 'reusable-application-ci-v2.yml@PLATFORM_RELEASE_REF' "$caller"
          if grep -E 'AZURE_CLIENT_ID|AZURE_TENANT_ID|AZURE_SUBSCRIPTION_ID' "$caller"; then
            echo 'Canonical application callers must not supply Azure identity secrets.' >&2
            exit 1
          fi
          grep -F 'enterprise-ci-reusable-deprecated' .github/workflows/enterprise-ci-reusable.yml
          grep -F 'Reject deprecated arbitrary-command CI entrypoint' .github/workflows/enterprise-ci-reusable.yml
          if grep -F 'inputs.build_command' .github/workflows/enterprise-ci-reusable.yml; then
            echo 'Deprecated reusable must never execute caller-supplied build_command.' >&2
            exit 1
          fi
