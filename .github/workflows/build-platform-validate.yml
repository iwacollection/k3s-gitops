name: Build Platform Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/build-images/**'
      - 'enterprise-cicd/ci-catalog/**'
      - 'enterprise-cicd/ci-scripts/**'
      - 'enterprise-cicd/dependency-proxy/**'
      - 'enterprise-cicd/security/**'
      - 'enterprise-cicd/github-actions/reusable/**'
      - 'enterprise-cicd/github-actions/policies/**'
      - 'enterprise-cicd/testing/contracts/validate_build_platform.py'
      - '.github/workflows/reusable-application-ci-v1.yml'
      - '.github/workflows/reusable-application-ci-matrix-v1.yml'
      - '.github/workflows/enterprise-ci-reusable.yml'
      - '.github/workflows/build-platform-validate.yml'
  push:
    branches: [main]
    paths:
      - 'enterprise-cicd/build-images/**'
      - 'enterprise-cicd/ci-catalog/**'
      - 'enterprise-cicd/ci-scripts/**'
      - 'enterprise-cicd/dependency-proxy/**'
      - 'enterprise-cicd/security/**'
      - 'enterprise-cicd/github-actions/reusable/**'
      - 'enterprise-cicd/github-actions/policies/**'
      - 'enterprise-cicd/testing/contracts/validate_build_platform.py'
      - '.github/workflows/reusable-application-ci-v1.yml'
      - '.github/workflows/reusable-application-ci-matrix-v1.yml'
      - '.github/workflows/enterprise-ci-reusable.yml'

permissions:
  contents: read

jobs:
  validate-build-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build image/profile/security/DAG contracts
        run: python enterprise-cicd/testing/contracts/validate_build_platform.py

      - name: Compile Python platform helpers
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            enterprise-cicd/ci-scripts/common/resolve_application.py \
            enterprise-cicd/ci-scripts/common/prepare_build_env.py \
            enterprise-cicd/testing/contracts/validate_build_platform.py

      - name: Verify callable CI workflow never deploys to Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/reusable-application-ci-v1.yml
          if grep -nE 'kubectl[[:space:]]+apply|helm[[:space:]]+(upgrade|install)|az[[:space:]]+aks[[:space:]]+get-credentials|terraform[[:space:]]+apply' "$workflow"; then
            echo 'Application CI must not contain infrastructure or Kubernetes deployment commands.' >&2
            exit 1
          fi

      - name: Verify immutable artifact build contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/reusable-application-ci-v1.yml
          grep -F 'GITHUB_SHA' "$workflow"
          grep -F -- '--sbom=true' "$workflow"
          grep -F -- '--provenance=mode=max' "$workflow"
          grep -F 'cosign sign --yes' "$workflow"

      - name: Verify monorepo and dependency-cache isolation contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/reusable-application-ci-v1.yml
          grep -F 'source_path: ${{ steps.resolve.outputs.source_path }}' "$workflow"
          grep -F 'scan-ref: ${{ needs.resolve.outputs.source_path }}' "$workflow"
          grep -F -- "--workspace '${{ needs.resolve.outputs.source_path }}'" "$workflow"
          grep -F '${{ steps.prepare.outputs.cache_restore_prefix }}' "$workflow"
          grep -F 'tar -C "$source_dir" -czf /tmp/build-workspace.tgz .' "$workflow"
          if grep -F '${{ runner.os }}-${{ runner.arch }}-platform-ci-' "$workflow"; then
            echo 'Global cross-profile dependency-cache restore fallback is forbidden.' >&2
            exit 1
          fi

      - name: Verify DAG and matrix orchestration
        shell: bash
        run: |
          set -euo pipefail
          dag=.github/workflows/reusable-application-ci-v1.yml
          matrix=.github/workflows/reusable-application-ci-matrix-v1.yml

          grep -F 'needs: [resolve, source-scan, build-test]' "$dag"
          grep -F 'needs: [resolve, image-build, image-scan, sbom]' "$dag"
          grep -F 'needs: [resolve, image-build, image-scan, sbom, sign]' "$dag"
          grep -F 'strategy:' "$matrix"
          grep -F 'matrix:' "$matrix"
          grep -F 'uses: ./.github/workflows/reusable-application-ci-v1.yml' "$matrix"

      - name: Verify caller/reusable separation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e enterprise-cicd/github-actions/reusable/application-ci.yml
          grep -F 'mainBranchAllowedForProduction' enterprise-cicd/github-actions/policies/reusable-workflow-consumption.json
          grep -F 'reusable-application-ci-v1.yml@PLATFORM_RELEASE_REF' enterprise-cicd/github-actions/policies/application-caller.example.yml
          grep -F 'enterprise-ci-reusable-deprecated' .github/workflows/enterprise-ci-reusable.yml
          grep -F 'Reject deprecated arbitrary-command CI entrypoint' .github/workflows/enterprise-ci-reusable.yml
          if grep -F '${{ inputs.build_command }}' .github/workflows/enterprise-ci-reusable.yml; then
            echo 'Deprecated reusable must never execute caller-supplied build_command.' >&2
            exit 1
          fi
