name: PROD Activation Runtime Gate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/activation/prod/**'
      - 'enterprise-cicd/gitops/clusters/aks-automatic-lab-prod/**'
      - '.github/workflows/prod-activation-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  binding-gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.binding.outputs.ready }}
      client_id: ${{ steps.binding.outputs.client_id }}
      tenant_id: ${{ steps.binding.outputs.tenant_id }}
      subscription_id: ${{ steps.binding.outputs.subscription_id }}
      principal_id: ${{ steps.binding.outputs.principal_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve real PROD binding or stay fail-closed before activation
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          CLIENT_ID="$(jq -r '.environments.prod.identities.githubOidc.clientId // empty' "$BINDING")"
          TENANT_ID="$(jq -r '.environments.prod.identities.githubOidc.tenantId // empty' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.prod.identities.githubOidc.subscriptionId // empty' "$BINDING")"
          PRINCIPAL_ID="$(jq -r '.environments.prod.identities.githubOidc.principalId // empty' "$BINDING")"
          DEV_PRINCIPAL="$(jq -r '.environments.dev.identities.githubOidc.principalId // empty' "$BINDING")"
          TEST_PRINCIPAL="$(jq -r '.environments.test.identities.githubOidc.principalId // empty' "$BINDING")"
          EXPECTED_ENV="$(jq -r '.environments.prod.identities.githubOidc.environment' "$BINDING")"
          EXPECTED_NAME="$(jq -r '.environments.prod.identities.githubOidc.name' "$BINDING")"
          test "$EXPECTED_ENV" = prod
          test "$EXPECTED_NAME" = k3s-gitops-prod-uami
          if [[ -z "$CLIENT_ID" || -z "$TENANT_ID" || -z "$SUBSCRIPTION_ID" || -z "$PRINCIPAL_ID" ]]; then
            echo 'PROD runtime binding is not activated yet; runtime job will remain skipped.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$PRINCIPAL_ID" != "$DEV_PRINCIPAL"
          test "$PRINCIPAL_ID" != "$TEST_PRINCIPAL"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "principal_id=$PRINCIPAL_ID" >> "$GITHUB_OUTPUT"

  runtime-readiness:
    needs: binding-gate
    if: ${{ needs.binding-gate.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with dedicated PROD OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ needs.binding-gate.outputs.client_id }}
          tenant-id: ${{ needs.binding-gate.outputs.tenant_id }}
          subscription-id: ${{ needs.binding-gate.outputs.subscription_id }}

      - uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: v0.2.19

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.35.7

      - name: Verify ARM Managed Namespace and Flux through read-only ARM access
        shell: bash
        env:
          SUBSCRIPTION_ID: ${{ needs.binding-gate.outputs.subscription_id }}
        run: |
          set -euo pipefail
          mkdir -p prod-readiness
          AKS_PARENT="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/group-test/providers/Microsoft.ContainerService/managedClusters/k8s-test-cicd"
          NS_URL="https://management.azure.com${AKS_PARENT}/managedNamespaces/cicd-prod?api-version=2026-01-01"
          FLUX_URL="https://management.azure.com${AKS_PARENT}/providers/Microsoft.KubernetesConfiguration/fluxConfigurations/enterprise-cicd-prod?api-version=2025-04-01"

          az rest --method get --url "$NS_URL" \
            --query '{name:name,state:properties.provisioningState,adoptionPolicy:properties.adoptionPolicy,deletePolicy:properties.deletePolicy,tags:tags}' \
            -o json > prod-readiness/namespace.json
          az rest --method get --url "$FLUX_URL" \
            --query '{name:name,namespace:properties.namespace,state:properties.provisioningState,compliance:properties.complianceState,branch:properties.gitRepository.repositoryRef.branch,sourceCommit:properties.sourceSyncedCommitId,error:properties.errorMessage}' \
            -o json > prod-readiness/flux.json

          jq -e '.name=="cicd-prod" and .state=="Succeeded" and .adoptionPolicy=="IfIdentical" and .deletePolicy=="Keep" and .tags.ownership=="arm-only-not-flux"' prod-readiness/namespace.json >/dev/null
          jq -e '.name=="enterprise-cicd-prod" and .namespace=="enterprise-cicd-prod" and .state=="Succeeded" and .compliance=="Compliant" and .branch=="gitops/prod" and (.error==null or .error=="")' prod-readiness/flux.json >/dev/null

      - name: Prove PROD namespace read access and Deployment mutation denial
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group group-test --name k8s-test-cicd --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          READ_NAMESPACE="$(kubectl auth can-i get namespace cicd-prod 2>&1 || true)"
          READ_DEPLOY="$(kubectl auth can-i get deployments.apps --namespace cicd-prod 2>&1 || true)"
          READ_PODS="$(kubectl auth can-i get pods --namespace cicd-prod 2>&1 || true)"
          CREATE_DEPLOY="$(kubectl auth can-i create deployments.apps --namespace cicd-prod 2>&1 || true)"
          PATCH_DEPLOY="$(kubectl auth can-i patch deployments.apps --namespace cicd-prod 2>&1 || true)"
          DELETE_DEPLOY="$(kubectl auth can-i delete deployments.apps --namespace cicd-prod 2>&1 || true)"

          {
            echo "namespace_read=$READ_NAMESPACE"
            echo "deployment_read=$READ_DEPLOY"
            echo "pods_read=$READ_PODS"
            echo "deployment_create=$CREATE_DEPLOY"
            echo "deployment_patch=$PATCH_DEPLOY"
            echo "deployment_delete=$DELETE_DEPLOY"
          } | tee prod-readiness/rbac.txt

          grep -Eq '^yes([[:space:]]|$)' <<<"$READ_NAMESPACE"
          grep -Eq '^yes([[:space:]]|$)' <<<"$READ_DEPLOY"
          grep -Eq '^yes([[:space:]]|$)' <<<"$READ_PODS"
          grep -Eq '^no([[:space:]-]|$)' <<<"$CREATE_DEPLOY"
          grep -Eq '^no([[:space:]-]|$)' <<<"$PATCH_DEPLOY"
          grep -Eq '^no([[:space:]-]|$)' <<<"$DELETE_DEPLOY"

      - name: Emit PROD runtime readiness evidence
        shell: bash
        env:
          PRINCIPAL_ID: ${{ needs.binding-gate.outputs.principal_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg principalId "$PRINCIPAL_ID" \
            --slurpfile namespace prod-readiness/namespace.json \
            --slurpfile flux prod-readiness/flux.json \
            '{apiVersion:"platform.activation/v1",kind:"ProdRuntimeReadiness",environment:"prod",principalId:$principalId,namespace:$namespace[0],flux:$flux[0],rbac:{namespaceRead:true,deploymentRead:true,podsRead:true,deploymentCreate:false,deploymentPatch:false,deploymentDelete:false},kubernetesWritePlane:"flux-only",status:"ready-for-release-promotion"}' \
            > prod-readiness/readiness.json
          cat prod-readiness/readiness.json

      - uses: actions/upload-artifact@v4
        with:
          name: prod-activation-runtime-readiness-${{ github.run_id }}
          path: prod-readiness/
          if-no-files-found: error
          retention-days: 365

  readiness-gate:
    if: ${{ always() }}
    needs: [binding-gate, runtime-readiness]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce fail-closed PROD runtime activation
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ needs.binding-gate.outputs.ready }}' != 'true' ]; then
            echo 'PROD_RUNTIME=NOT_ACTIVATED'
            exit 0
          fi
          test '${{ needs.runtime-readiness.result }}' = success
          echo 'PROD_RUNTIME=READY_FOR_RELEASE_PROMOTION'
