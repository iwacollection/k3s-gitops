name: enterprise-ci-reusable-deprecated

on:
  workflow_call:
    inputs:
      language:
        description: Deprecated compatibility input.
        required: true
        type: string
      build_command:
        description: Deprecated compatibility input; never executed.
        required: true
        type: string
      working_directory:
        description: Deprecated compatibility input.
        required: false
        default: .
        type: string

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject deprecated arbitrary-command CI entrypoint
        shell: bash
        run: |
          set -euo pipefail
          echo 'enterprise-ci-reusable.yml is retired because caller-supplied build commands bypass the governed CI catalog.' >&2
          echo 'Migrate the caller to .github/workflows/reusable-application-ci-v1.yml with a committed enterprise-cicd/application-definitions/*.json definition.' >&2
          exit 1
