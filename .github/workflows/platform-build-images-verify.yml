name: Platform Build Images Verify

on:
  pull_request:
    paths:
      - '.github/workflows/platform-build-images-verify.yml'
      - 'enterprise-cicd/activation/requests/platform-build-images-dev.json'
      - 'enterprise-cicd/contracts/environment-bindings.json'
      - 'enterprise-cicd/build-images/**'

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Resolve DEV OIDC binding
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/environment-bindings.json
          echo "client_id=$(jq -r '.environments.dev.identities.githubOidc.clientId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$(jq -r '.environments.dev.identities.githubOidc.tenantId' "$BINDING")" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$(jq -r '.environments.dev.identities.githubOidc.subscriptionId' "$BINDING")" >> "$GITHUB_OUTPUT"

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ steps.auth.outputs.client_id }}
          tenant-id: ${{ steps.auth.outputs.tenant_id }}
          subscription-id: ${{ steps.auth.outputs.subscription_id }}

      - name: Verify committed immutable build-image digest bindings against DEV ACR
        shell: bash
        run: |
          set -euo pipefail
          REQUEST=enterprise-cicd/activation/requests/platform-build-images-dev.json
          BINDING=enterprise-cicd/build-images/digests/active.json
          REGISTRY=enterprise-cicd/build-images/versions.json

          ACR_NAME="$(jq -r '.acrName' "$REQUEST")"
          BOUND_ACR_NAME="$(jq -r '.spec.acrName' "$BINDING")"
          test "$BOUND_ACR_NAME" = "$ACR_NAME" || {
            echo "Build-image digest binding targets unexpected ACR: binding=$BOUND_ACR_NAME request=$ACR_NAME" >&2
            exit 1
          }

          python - "$REGISTRY" "$BINDING" <<'PY'
          import json
          import re
          import sys

          registry = json.load(open(sys.argv[1]))
          binding = json.load(open(sys.argv[2]))
          images = set((registry.get('images') or {}).keys())
          bound = (binding.get('spec') or {}).get('images') or {}
          if set(bound) != images:
              raise SystemExit(
                  f'active digest binding must cover exact build-image registry: missing={sorted(images-set(bound))} unexpected={sorted(set(bound)-images)}'
              )
          if (binding.get('spec') or {}).get('promotionByDigest') is not True:
              raise SystemExit('promotionByDigest must remain true')
          if (binding.get('spec') or {}).get('mutableTagExecutionAllowed') is not False:
              raise SystemExit('mutableTagExecutionAllowed must remain false')
          for name, digest in bound.items():
              if not isinstance(digest, str) or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit(f'invalid committed digest for {name}: {digest!r}')
          print(f'Committed digest binding contract valid for {len(bound)} platform build images.')
          PY

          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          : > /tmp/platform-image-digests.tsv

          while IFS=$'\t' read -r key expected_digest; do
            name="${key%:*}"
            version="${key##*:}"
            repository="build/$name"
            actual_digest="$(az acr repository show \
              --name "$ACR_NAME" \
              --image "$repository:$version" \
              --query digest -o tsv)"
            test -n "$actual_digest"
            case "$actual_digest" in sha256:*) ;; *) echo "Invalid live digest for $repository:$version: $actual_digest" >&2; exit 1 ;; esac
            if [ "$actual_digest" != "$expected_digest" ]; then
              echo "Build-image tag drift detected: $repository:$version" >&2
              echo "committed=$expected_digest" >&2
              echo "live=$actual_digest" >&2
              exit 1
            fi
            printf '%s\t%s\n' "$LOGIN_SERVER/$repository:$version" "$actual_digest" | tee -a /tmp/platform-image-digests.tsv
          done < <(jq -r '.spec.images | to_entries | sort_by(.key)[] | [.key,.value] | @tsv' "$BINDING")

          test "$(wc -l < /tmp/platform-image-digests.tsv)" -eq "$(jq '.spec.images | length' "$BINDING")"

      - name: Publish digest evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Platform Build Images DEV v1'
            echo
            echo '| Image tag | Committed/live immutable digest |'
            echo '|---|---|'
            while IFS=$'\t' read -r image digest; do
              echo "| \`$image\` | \`$digest\` |"
            done < /tmp/platform-image-digests.tsv
            echo
            echo '- OIDC only: PASS'
            echo '- Committed digest binding: PASS'
            echo '- Live tag equals committed digest: PASS'
            echo '- Runtime mutable-tag execution: FORBIDDEN'
            echo '- Four-language image set: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
