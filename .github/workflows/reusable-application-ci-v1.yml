name: Reusable Application CI v1

on:
  workflow_call:
    inputs:
      application_definition:
        description: Path to platform Application definition JSON.
        required: true
        type: string
      acr_name:
        description: Azure Container Registry name used for build and application images.
        required: true
        type: string
    outputs:
      application:
        description: Resolved application name.
        value: ${{ jobs.resolve.outputs.application }}
      artifact_repository:
        description: Resolved artifact repository.
        value: ${{ jobs.resolve.outputs.artifact_repository }}
      artifact_digest:
        description: Immutable container digest.
        value: ${{ jobs.image-build.outputs.artifact_digest }}
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      MAVEN_PROXY_URL:
        required: false
      PYPI_INDEX_URL:
        required: false
      GO_PROXY_URL:
        required: false
      CONAN_REMOTE_URL:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.resolve.outputs.application }}
      owner: ${{ steps.resolve.outputs.owner }}
      source_path: ${{ steps.resolve.outputs.source_path }}
      build_image: ${{ steps.resolve.outputs.build_image }}
      prepare_command: ${{ steps.resolve.outputs.prepare_command }}
      verify_command: ${{ steps.resolve.outputs.verify_command }}
      package_command: ${{ steps.resolve.outputs.package_command }}
      artifact_type: ${{ steps.resolve.outputs.artifact_type }}
      artifact_repository: ${{ steps.resolve.outputs.artifact_repository }}
      dockerfile: ${{ steps.resolve.outputs.dockerfile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve governed application definition
        id: resolve
        shell: bash
        env:
          APPLICATION_DEFINITION: ${{ inputs.application_definition }}
        run: |
          set -euo pipefail
          case "$APPLICATION_DEFINITION" in
            enterprise-cicd/application-definitions/*.json) ;;
            *)
              echo 'Application definition must be committed under enterprise-cicd/application-definitions/.' >&2
              exit 1
              ;;
          esac

          python enterprise-cicd/ci-scripts/common/resolve_application.py \
            --application "$APPLICATION_DEFINITION" \
            --output /tmp/application-resolved.json

          artifact_type=$(jq -r .artifactType /tmp/application-resolved.json)
          if [[ "$artifact_type" != "container" ]]; then
            echo "Reusable Application CI v1 currently executes container artifacts only; got: $artifact_type" >&2
            exit 1
          fi

          echo "application=$(jq -r .application /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "owner=$(jq -r .owner /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "source_path=$(jq -r .sourcePath /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "build_image=$(jq -r .buildImage /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "prepare_command=$(jq -r .prepareCommand /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "verify_command=$(jq -r .verifyCommand /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "package_command=$(jq -r .packageCommand /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_type=$artifact_type" >> "$GITHUB_OUTPUT"
          echo "artifact_repository=$(jq -r .artifactRepository /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(jq -r .dockerfile /tmp/application-resolved.json)" >> "$GITHUB_OUTPUT"

  source-scan:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source security scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ needs.resolve.outputs.source_path }}
          scanners: vuln,secret,misconfig
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  build-test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dependency cache and proxy configuration
        id: prepare
        shell: bash
        env:
          MAVEN_PROXY_URL: ${{ secrets.MAVEN_PROXY_URL }}
          PYPI_INDEX_URL: ${{ secrets.PYPI_INDEX_URL }}
          GO_PROXY_URL: ${{ secrets.GO_PROXY_URL }}
          CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
        run: |
          set -euo pipefail
          python enterprise-cicd/ci-scripts/common/prepare_build_env.py \
            --application '${{ inputs.application_definition }}' \
            --workspace '${{ needs.resolve.outputs.source_path }}' \
            --output /tmp/platform-build.json \
            --env-file /tmp/platform-build.env \
            --config-dir /tmp/platform-config
          echo "cache_key=$(jq -r .cacheKey /tmp/platform-build.json)" >> "$GITHUB_OUTPUT"
          echo "cache_restore_prefix=$(jq -r .cacheRestorePrefix /tmp/platform-build.json)" >> "$GITHUB_OUTPUT"
          echo "cache_dir=$(jq -r .cacheDir /tmp/platform-build.json)" >> "$GITHUB_OUTPUT"
          echo "pre_command=$(jq -r .preCommand /tmp/platform-build.json)" >> "$GITHUB_OUTPUT"

      - name: Restore profile-scoped dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.prepare.outputs.cache_dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.cache_key }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.prepare.outputs.cache_restore_prefix }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        id: acr
        shell: bash
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Compile, test and package in platform build image
        shell: bash
        env:
          SOURCE_PATH: ${{ needs.resolve.outputs.source_path }}
          BUILD_IMAGE: ${{ needs.resolve.outputs.build_image }}
          PREPARE_COMMAND: ${{ needs.resolve.outputs.prepare_command }}
          VERIFY_COMMAND: ${{ needs.resolve.outputs.verify_command }}
          PACKAGE_COMMAND: ${{ needs.resolve.outputs.package_command }}
          PRE_COMMAND: ${{ steps.prepare.outputs.pre_command }}
          CACHE_DIR: ${{ steps.prepare.outputs.cache_dir }}
          LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/$SOURCE_PATH"
          test -d "$source_dir"
          image="$LOGIN_SERVER/build/$BUILD_IMAGE"
          docker pull "$image"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env-file /tmp/platform-build.env \
            -v "$source_dir:/workspace" \
            -v "$CACHE_DIR:/platform-cache" \
            -v "/tmp/platform-config:/platform-config:ro" \
            -w /workspace \
            "$image" \
            sh -c "$PRE_COMMAND && $PREPARE_COMMAND && $VERIFY_COMMAND && $PACKAGE_COMMAND"

      - name: Package application source for downstream image build
        shell: bash
        env:
          SOURCE_PATH: ${{ needs.resolve.outputs.source_path }}
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/$SOURCE_PATH"
          test -d "$source_dir"
          tar -C "$source_dir" -czf /tmp/build-workspace.tgz .

      - name: Upload compiled workspace
        uses: actions/upload-artifact@v4
        with:
          name: compiled-workspace-${{ needs.resolve.outputs.application }}-${{ github.sha }}
          path: /tmp/build-workspace.tgz
          if-no-files-found: error
          retention-days: 1

  image-build:
    needs: [resolve, source-scan, build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.digest }}
      login_server: ${{ steps.acr.outputs.login_server }}
      image_ref: ${{ steps.artifact.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled workspace
        uses: actions/download-artifact@v5
        with:
          name: compiled-workspace-${{ needs.resolve.outputs.application }}-${{ github.sha }}
          path: /tmp/compiled-workspace

      - name: Restore isolated application build context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/application-source
          mkdir -p /tmp/application-source
          tar -xzf /tmp/compiled-workspace/build-workspace.tgz -C /tmp/application-source

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        id: acr
        shell: bash
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build immutable application image with SBOM and provenance
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          REPOSITORY: ${{ needs.resolve.outputs.artifact_repository }}
          DOCKERFILE: ${{ needs.resolve.outputs.dockerfile }}
        run: |
          set -euo pipefail
          source_dir=/tmp/application-source
          test -f "$source_dir/$DOCKERFILE"
          image="$LOGIN_SERVER/$REPOSITORY:$GITHUB_SHA"
          docker buildx build \
            --pull \
            --push \
            --sbom=true \
            --provenance=mode=max \
            -f "$source_dir/$DOCKERFILE" \
            -t "$image" \
            "$source_dir"

      - name: Resolve immutable artifact digest
        id: artifact
        shell: bash
        env:
          ACR_NAME: ${{ inputs.acr_name }}
          LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          REPOSITORY: ${{ needs.resolve.outputs.artifact_repository }}
        run: |
          set -euo pipefail
          digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$REPOSITORY:$GITHUB_SHA" \
            --query digest -o tsv)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=$LOGIN_SERVER/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

  image-scan:
    needs: [resolve, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name '${{ inputs.acr_name }}'

      - name: Container vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ needs.image-build.outputs.image_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sbom:
    needs: [resolve, image-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name '${{ inputs.acr_name }}'

      - name: Generate evidence SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ needs.image-build.outputs.image_ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ needs.resolve.outputs.application }}-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

  sign:
    needs: [resolve, image-build, image-scan, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name '${{ inputs.acr_name }}'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign immutable artifact with GitHub OIDC
        env:
          IMAGE: ${{ needs.image-build.outputs.image_ref }}
        run: cosign sign --yes "$IMAGE"

  release-evidence:
    needs: [resolve, image-build, image-scan, sbom, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download SBOM evidence
        uses: actions/download-artifact@v5
        with:
          name: sbom-${{ needs.resolve.outputs.application }}-${{ github.sha }}
          path: .platform-release

      - name: Emit release metadata
        shell: bash
        env:
          APP: ${{ needs.resolve.outputs.application }}
          OWNER: ${{ needs.resolve.outputs.owner }}
          REPOSITORY: ${{ needs.image-build.outputs.login_server }}/${{ needs.resolve.outputs.artifact_repository }}
          DIGEST: ${{ needs.image-build.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg application "$APP" \
            --arg owner "$OWNER" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg repository "$REPOSITORY" \
            --arg digest "$DIGEST" \
            '{apiVersion:"platform.release/v1",kind:"BuildArtifact",application:$application,owner:$owner,sourceCommit:$sourceCommit,artifact:{repository:$repository,digest:$digest},evidence:{sbom:"sbom.spdx.json",signed:true,provenance:true,sourceScan:true,containerScan:true}}' \
            > .platform-release/artifact.json
          cat .platform-release/artifact.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ needs.resolve.outputs.application }}-${{ github.sha }}
          path: .platform-release/
          if-no-files-found: error
          retention-days: 30
