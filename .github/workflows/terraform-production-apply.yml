name: Terraform Production Apply

on:
  workflow_dispatch:

concurrency:
  group: terraform-production-apply
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Approved Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Terraform Preflight
        run: |
          set -e
          if ! command -v terraform >/dev/null; then
            echo "terraform cli missing"
            exit 1
          fi
          terraform version

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: production-tfplan

      - name: Validate approved plan artifact
        run: |
          set -e
          test -f tfplan || { echo "Approved terraform plan artifact is missing"; exit 1; }
          sha256sum tfplan
          echo "Approved plan artifact verified"

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/production
        run: terraform init -input=false

      - name: Terraform Apply Approved Plan
        working-directory: infrastructure/terraform/environments/production
        run: terraform apply -input=false tfplan

      - name: Post Apply Verification
        working-directory: infrastructure/terraform/environments/production
        run: |
          set +e
          terraform plan -refresh-only -detailed-exitcode
          code=$?
          set -e

          if [ "$code" = "2" ]; then
            echo "Terraform state drift detected after apply"
            exit 1
          fi

          if [ "$code" != "0" ]; then
            echo "Terraform verification failed"
            exit 1
          fi

          echo "Production apply verification completed"
