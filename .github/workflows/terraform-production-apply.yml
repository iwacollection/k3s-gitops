name: Terraform Production Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Approved Terraform Apply
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: production-tfplan

      - name: Validate plan artifact
        run: |
          if [ ! -f tfplan ]; then
            echo "Approved terraform plan artifact is missing"
            exit 1
          fi
          echo "Plan artifact verified"

      - name: Terraform Init
        working-directory: infrastructure/terraform/environments/production
        run: terraform init

      - name: Terraform Apply Approved Plan
        working-directory: infrastructure/terraform/environments/production
        run: terraform apply -input=false tfplan

      - name: Post Apply Verification
        working-directory: infrastructure/terraform/environments/production
        run: |
          terraform plan -refresh-only -detailed-exitcode || code=$?
          if [ "${code:-0}" = "2" ]; then
            echo "Terraform state drift detected after apply"
            exit 1
          fi
          echo "Production apply verification completed"
