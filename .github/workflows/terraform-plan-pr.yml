name: Terraform PR Plan

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    uses: ./.github/workflows/terraform-reusable-enterprise.yml
    with:
      working_directory: infrastructure/terraform/environments/dev
      command: plan
