name: IaC Request DEV Apply

on:
  push:
    branches:
      - design/azure-enterprise-control-plane-v1
      - main
    paths:
      - 'enterprise-cicd/iac-requests/dev/**.json'
      - 'enterprise-cicd/contracts/iac-runtime-bindings.json'
      - '.github/workflows/iac-request-dev-apply.yml'

permissions:
  contents: read

concurrency:
  group: iac-dev-apply
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      requests: ${{ steps.changed.outputs.requests }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover added or modified merged DEV requests
        id: changed
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          from pathlib import Path

          before = os.environ['BEFORE_SHA']
          after = os.environ['AFTER_SHA']
          if not before or set(before) == {'0'}:
              changed = subprocess.check_output(
                  ['git', 'show', '--pretty=', '--name-only', after], text=True
              ).splitlines()
          else:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', before, after], text=True
              ).splitlines()

          candidates = sorted({
              path for path in changed
              if path.startswith('enterprise-cicd/iac-requests/dev/')
              and path.endswith('.json')
              and not path.endswith('.example.json')
          })
          deleted = [path for path in candidates if not Path(path).is_file()]
          if deleted:
              raise SystemExit(
                  'request deletion cannot auto-destroy infrastructure; use governed decommission flow: '
                  + ', '.join(deleted)
              )
          requests = [path for path in candidates if Path(path).is_file()]
          print('requests=' + json.dumps(requests, separators=(',', ':')))
          print('count=' + str(len(requests)))
          PY

  binding-gate:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.binding.outputs.client_id }}
      tenant_id: ${{ steps.binding.outputs.tenant_id }}
      subscription_id: ${{ steps.binding.outputs.subscription_id }}
      state_rg: ${{ steps.binding.outputs.state_rg }}
      state_storage: ${{ steps.binding.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4

      - name: Require activated dedicated DEV Apply identity and state backend
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/iac-runtime-bindings.json
          STATUS="$(jq -r '.environments.dev.activationStatus // empty' "$BINDING")"
          CLIENT_ID="$(jq -r '.environments.dev.apply.clientId // empty' "$BINDING")"
          TENANT_ID="$(jq -r '.environments.dev.apply.tenantId // empty' "$BINDING")"
          SUBSCRIPTION_ID="$(jq -r '.environments.dev.apply.subscriptionId // empty' "$BINDING")"
          GITHUB_ENV="$(jq -r '.environments.dev.apply.githubEnvironment // empty' "$BINDING")"
          STATE_WRITE="$(jq -r '.environments.dev.apply.stateWriteAccess' "$BINDING")"
          GENERIC_CONTRIBUTOR="$(jq -r '.environments.dev.apply.genericContributor' "$BINDING")"
          ROLE_WRITE="$(jq -r '.environments.dev.apply.roleAssignmentWrite' "$BINDING")"
          STATE_RG="$(jq -r '.state.resourceGroup // empty' "$BINDING")"
          STATE_STORAGE="$(jq -r '.state.storageAccount // empty' "$BINDING")"
          SHARED_KEY="$(jq -r '.state.sharedKeyAccess' "$BINDING")"

          test "$STATUS" = ready || { echo "DEV IaC runtime is not activated: status=$STATUS" >&2; exit 1; }
          test "$GITHUB_ENV" = iac-dev-apply
          test "$STATE_WRITE" = true
          test "$GENERIC_CONTRIBUTOR" = false
          test "$ROLE_WRITE" = false
          test "$SHARED_KEY" = false
          test -n "$CLIENT_ID" && test -n "$TENANT_ID" && test -n "$SUBSCRIPTION_ID"
          test -n "$STATE_RG" && test -n "$STATE_STORAGE"

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "tenant_id=$TENANT_ID" >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUBSCRIPTION_ID" >> "$GITHUB_OUTPUT"
          echo "state_rg=$STATE_RG" >> "$GITHUB_OUTPUT"
          echo "state_storage=$STATE_STORAGE" >> "$GITHUB_OUTPUT"

  protected-apply:
    needs: [discover, binding-gate]
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        request: ${{ fromJSON(needs.discover.outputs.requests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: iac-dev-apply
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.binding-gate.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.binding-gate.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.binding-gate.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.binding-gate.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.binding-gate.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve governed merged request metadata
        id: request
        shell: bash
        env:
          REQUEST_PATH: ${{ matrix.request }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['REQUEST_PATH'])
          req = json.loads(path.read_text())
          spec = req['spec']
          meta = req['metadata']
          assert spec['environment'] == 'dev'
          service = spec['service']
          version = spec['templateVersion']
          supported_services = {'managed-identity', 'network'}
          if service not in supported_services:
              raise SystemExit(
                  f'GitHub DEV Apply is intentionally capability-scoped; service={service} is not activated; supported={sorted(supported_services)}'
              )
          catalog = json.loads(Path(f'enterprise-cicd/iac-catalog/services/{service}/{version}/catalog.json').read_text())
          assert catalog['lifecycle'] == 'active'
          print(f"service={service}")
          print(f"request_name={meta['name']}")
          print(f"stack={catalog['rootStack']}")
          PY

      - name: Azure login using dedicated IaC Apply OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ needs.binding-gate.outputs.client_id }}
          tenant-id: ${{ needs.binding-gate.outputs.tenant_id }}
          subscription-id: ${{ needs.binding-gate.outputs.subscription_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Render request and Entra-only remote backend
        shell: bash
        env:
          REQUEST_PATH: ${{ matrix.request }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-apply
          python enterprise-cicd/iac-catalog/render_request.py \
            --request "$REQUEST_PATH" \
            --output /tmp/iac-apply/request.tfvars.json
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog \
            --environment dev \
            --service '${{ steps.request.outputs.service }}' \
            --request '${{ steps.request.outputs.request_name }}' \
            --auth oidc \
            --output /tmp/iac-apply/backend.hcl

      - name: Merge-time re-plan with state lock
        shell: bash
        env:
          STACK: ${{ steps.request.outputs.stack }}
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" init \
            -reconfigure \
            -input=false \
            -backend-config=/tmp/iac-apply/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan \
            -lock=true \
            -lock-timeout=5m \
            -input=false \
            -var-file=/tmp/iac-apply/request.tfvars.json \
            -out=/tmp/iac-apply/apply.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-apply/apply.tfplan > /tmp/iac-apply/plan.json

      - name: Reject destructive automatic Apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/iac-apply/plan-summary.json
          import json
          plan = json.load(open('/tmp/iac-apply/plan.json'))
          changes = []
          for rc in plan.get('resource_changes', []):
              actions = rc.get('change', {}).get('actions', [])
              if actions != ['no-op']:
                  changes.append({'address': rc.get('address'), 'actions': actions})
          destructive = [x for x in changes if 'delete' in x['actions']]
          if destructive:
              raise SystemExit(f'destructive automatic Apply is forbidden: {destructive}')
          print(json.dumps({
              'request': '${{ steps.request.outputs.request_name }}',
              'service': '${{ steps.request.outputs.service }}',
              'changes': changes,
              'destructive': [],
              'status': 'approved-for-exact-saved-plan-apply'
          }, indent=2))
          PY

      - name: Apply exact merge-time saved plan
        shell: bash
        env:
          STACK: ${{ steps.request.outputs.stack }}
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" apply \
            -input=false \
            -auto-approve \
            /tmp/iac-apply/apply.tfplan

      - name: Verify Azure resource and remote Terraform outputs
        shell: bash
        env:
          STACK: ${{ steps.request.outputs.stack }}
          SERVICE: ${{ steps.request.outputs.service }}
        run: |
          set -euo pipefail
          RG="$(jq -r '.resource_group_name' /tmp/iac-apply/request.tfvars.json)"

          az group show --name "$RG" \
            --query '{id:id,name:name,location:location,provisioningState:properties.provisioningState,tags:tags}' \
            -o json > /tmp/iac-apply/resource-group-verification.json

          terraform -chdir="$STACK" output -json > /tmp/iac-apply/terraform-outputs.json

          if [ "$SERVICE" = "managed-identity" ]; then
            IDENTITY="$(jq -r '.identity_name' /tmp/iac-apply/request.tfvars.json)"
            az identity show --resource-group "$RG" --name "$IDENTITY" \
              --query '{id:id,name:name,location:location,clientId:clientId,principalId:principalId,tags:tags}' \
              -o json > /tmp/iac-apply/managed-identity-verification.json

            python - <<'PY' | tee /tmp/iac-apply/verification-summary.json
          import json
          tfvars = json.load(open('/tmp/iac-apply/request.tfvars.json'))
          rg = json.load(open('/tmp/iac-apply/resource-group-verification.json'))
          identity = json.load(open('/tmp/iac-apply/managed-identity-verification.json'))
          outputs = json.load(open('/tmp/iac-apply/terraform-outputs.json'))
          assert rg['name'] == tfvars['resource_group_name']
          assert identity['name'] == tfvars['identity_name']
          assert identity['id'] == outputs['identity_id']['value']
          assert identity['principalId'] == outputs['identity_principal_id']['value']
          print(json.dumps({
              'status': 'passed',
              'service': 'managed-identity',
              'resourceGroup': rg['name'],
              'identity': identity['name'],
              'identityId': identity['id'],
              'principalId': identity['principalId'],
              'remoteState': True,
              'exactSavedPlanApplied': True
          }, indent=2))
          PY

          elif [ "$SERVICE" = "network" ]; then
            VNET="$(jq -r '.virtual_network_name' /tmp/iac-apply/request.tfvars.json)"
            SUBNET="$(jq -r '.subnets | keys[0]' /tmp/iac-apply/request.tfvars.json)"

            az network vnet show --resource-group "$RG" --name "$VNET" \
              --query '{id:id,name:name,location:location,addressSpace:addressSpace.addressPrefixes,tags:tags,peerings:virtualNetworkPeerings}' \
              -o json > /tmp/iac-apply/network-verification.json

            az network vnet subnet show --resource-group "$RG" --vnet-name "$VNET" --name "$SUBNET" \
              --query '{id:id,name:name,addressPrefixes:addressPrefixes,natGateway:natGateway,networkSecurityGroup:networkSecurityGroup,routeTable:routeTable,serviceEndpoints:serviceEndpoints}' \
              -o json > /tmp/iac-apply/subnet-verification.json

            python - <<'PY' | tee /tmp/iac-apply/verification-summary.json
          import json
          tfvars = json.load(open('/tmp/iac-apply/request.tfvars.json'))
          rg = json.load(open('/tmp/iac-apply/resource-group-verification.json'))
          vnet = json.load(open('/tmp/iac-apply/network-verification.json'))
          subnet = json.load(open('/tmp/iac-apply/subnet-verification.json'))
          outputs = json.load(open('/tmp/iac-apply/terraform-outputs.json'))
          subnet_name = next(iter(tfvars['subnets']))
          assert rg['name'] == tfvars['resource_group_name']
          assert vnet['name'] == tfvars['virtual_network_name']
          assert vnet['id'] == outputs['virtual_network_id']['value']
          assert sorted(vnet['addressSpace']) == sorted(tfvars['address_space'])
          assert not (vnet.get('peerings') or [])
          assert subnet['name'] == subnet_name
          assert subnet['id'] == outputs['subnet_ids']['value'][subnet_name]
          assert sorted(subnet['addressPrefixes']) == sorted(tfvars['subnets'][subnet_name]['address_prefixes'])
          assert subnet.get('natGateway') is None
          assert subnet.get('networkSecurityGroup') is None
          assert subnet.get('routeTable') is None
          assert not (subnet.get('serviceEndpoints') or [])
          assert tfvars['nat_gateway'] is None
          assert tfvars['network_security_groups'] == {}
          assert tfvars['route_tables'] == {}
          assert tfvars['private_dns_zone_names'] == []
          print(json.dumps({
              'status': 'passed',
              'service': 'network',
              'resourceGroup': rg['name'],
              'virtualNetwork': vnet['name'],
              'virtualNetworkId': vnet['id'],
              'subnet': subnet['name'],
              'subnetId': subnet['id'],
              'paidNetworkAddOnsDetected': False,
              'remoteState': True,
              'exactSavedPlanApplied': True
          }, indent=2))
          PY
          else
            echo "Unsupported verification service: $SERVICE" >&2
            exit 1
          fi

      - name: Publish DEV IaC Apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iac-dev-apply-${{ steps.request.outputs.request_name }}
          path: /tmp/iac-apply
          if-no-files-found: error
          retention-days: 30

  apply-gate:
    if: ${{ always() }}
    needs: [discover, binding-gate, protected-apply]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful protected Apply for merged DEV requests
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ needs.discover.outputs.count }}' = '0' ]; then
            echo 'No newly merged DEV InfrastructureRequest requires Apply.'
            exit 0
          fi
          test '${{ needs.binding-gate.result }}' = success
          test '${{ needs.protected-apply.result }}' = success
