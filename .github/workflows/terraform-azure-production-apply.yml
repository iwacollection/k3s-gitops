name: Terraform Azure Production Apply

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY to continue production apply'
        required: true
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-azure-production
  cancel-in-progress: false

jobs:
  terraform-apply:
    if: github.event.inputs.confirm == 'APPLY'
    runs-on: ubuntu-latest
    environment: production-approval

    defaults:
      run:
        working-directory: infrastructure/terraform/azure-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve
