name: Terraform Production Preflight

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/terraform/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Terraform Production Preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Terraform command check
        run: |
          terraform version

      - name: Terraform format check
        run: |
          terraform fmt -check -recursive infrastructure/terraform

      - name: Module contract check
        run: |
          if [ -f tests/terraform/module-contract-check.sh ]; then
            bash tests/terraform/module-contract-check.sh
          else
            echo "module contract check not configured"
          fi

      - name: Production safety preflight
        run: |
          if [ -f scripts/terraform/preflight/azure-production-preflight.sh ]; then
            bash scripts/terraform/preflight/azure-production-preflight.sh || true
          fi
          echo "production preflight completed"
