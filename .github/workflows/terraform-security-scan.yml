name: Terraform Security Scan

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform format check
        uses: hashicorp/setup-terraform@v3

      - name: Validate terraform files exist
        run: |
          test -d infrastructure/terraform
          echo "Terraform repository structure detected"

      - name: Resource change review reminder
        run: |
          echo "Production changes require plan review and approval"
