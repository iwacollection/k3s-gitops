name: Terraform Adoption Governance

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/terraform/**'

jobs:
  adoption-governance:
    name: Validate Terraform production safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terraform Plan Safety Reminder
        run: |
          echo "Production Terraform changes require adoption safety validation"
          echo "Expected for existing resource onboarding:"
          echo "create=0"
          echo "destroy=0"
          echo "replace=0"

      - name: Check Adoption Script Exists
        run: |
          test -f scripts/terraform/resource-adoption-check.sh
          echo "adoption gate available"
