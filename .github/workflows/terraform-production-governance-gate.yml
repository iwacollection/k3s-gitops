name: Terraform Production Governance Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-governance:
    name: Terraform Governance Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init Validation
        working-directory: infrastructure/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate

      - name: Production Change Safety Reminder
        run: |
          echo "Production IaC safety rules:"
          echo "- Existing resources must be imported before management"
          echo "- Unexpected destroy is forbidden"
          echo "- Unexpected replace is forbidden"
