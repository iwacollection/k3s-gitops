name: Terraform Azure Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: production
  push:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/environments/production/**'
      - 'infrastructure/terraform/modules/**'
      - '.github/workflows/terraform-azure-apply.yml'

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: terraform-azure-production-apply
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply Azure
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production

    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      AZURE_QUOTA_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_APPLY_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_database_admin_username: ${{ secrets.TF_DATABASE_ADMIN_USERNAME }}
      TF_VAR_database_admin_password: ${{ secrets.TF_DATABASE_ADMIN_PASSWORD }}

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'

      - name: Validate required production secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_QUOTA_CLIENT_ID" || { echo 'AZURE_CLIENT_ID is missing'; exit 1; }
          test -n "$AZURE_APPLY_CLIENT_ID" || { echo 'AZURE_APPLY_CLIENT_ID is missing'; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo 'AZURE_TENANT_ID is missing'; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo 'AZURE_SUBSCRIPTION_ID is missing'; exit 1; }
          test -n "$TF_VAR_database_admin_username" || { echo 'TF_DATABASE_ADMIN_USERNAME is missing'; exit 1; }
          test -n "$TF_VAR_database_admin_password" || { echo 'TF_DATABASE_ADMIN_PASSWORD is missing'; exit 1; }

      # The Apply identity already has User Access Administrator. Use it first
      # to converge the subscription-scoped quota RBAC through Terraform. This
      # avoids permanently widening the normal Plan identity outside IaC.
      - name: Azure Login OIDC with Apply Identity for IaC bootstrap
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap and initialize protected Terraform state backend
        shell: bash
        run: |
          set -euo pipefail

          STATE_RG='rg-platform-cicd'
          WORKLOAD_RG='rg-k3s-production'
          LOCATION='eastus'
          STATE_CONTAINER='tfstate'
          STATE_KEY_NAME='k3s-production.tfstate'
          SUB_COMPACT="${AZURE_SUBSCRIPTION_ID//-/}"
          STATE_ACCOUNT="stk3stfstate${SUB_COMPACT:0:12}"
          STATE_ACCOUNT="${STATE_ACCOUNT:0:24}"

          az group show --name "$STATE_RG" --output none || { echo "Missing state resource group: $STATE_RG"; exit 1; }
          az group show --name "$WORKLOAD_RG" --output none || { echo "Missing workload resource group: $WORKLOAD_RG"; exit 1; }

          if ! az storage account show --resource-group "$STATE_RG" --name "$STATE_ACCOUNT" >/dev/null 2>&1; then
            az storage account create \
              --resource-group "$STATE_RG" \
              --name "$STATE_ACCOUNT" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --https-only true \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --output none
          fi

          # Reconcile safety controls on pre-existing backends as well as new ones.
          az storage account update \
            --resource-group "$STATE_RG" \
            --name "$STATE_ACCOUNT" \
            --https-only true \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --output none

          # Terraform state is a recovery-critical asset. Keep versions and soft
          # deleted blobs/containers for 30 days before the later OIDC data-plane
          # migration removes shared-key access entirely.
          az storage account blob-service-properties update \
            --resource-group "$STATE_RG" \
            --account-name "$STATE_ACCOUNT" \
            --enable-versioning true \
            --enable-delete-retention true \
            --delete-retention-days 30 \
            --enable-container-delete-retention true \
            --container-delete-retention-days 30 \
            --output none

          STATE_ACCESS_KEY="$(az storage account keys list \
            --resource-group "$STATE_RG" \
            --account-name "$STATE_ACCOUNT" \
            --query '[0].value' \
            --output tsv)"
          test -n "$STATE_ACCESS_KEY"
          echo "::add-mask::$STATE_ACCESS_KEY"

          az storage container create \
            --name "$STATE_CONTAINER" \
            --account-name "$STATE_ACCOUNT" \
            --account-key "$STATE_ACCESS_KEY" \
            --output none

          cat > backend.generated.tf <<'EOF'
          terraform {
            backend "azurerm" {}
          }
          EOF

          # Keep the storage account key scoped to this shell step only. Do not
          # persist it in GITHUB_ENV or pass it visibly on the command line.
          export ARM_ACCESS_KEY="$STATE_ACCESS_KEY"
          terraform init -reconfigure -input=false -lockfile=readonly \
            -backend-config="resource_group_name=${STATE_RG}" \
            -backend-config="storage_account_name=${STATE_ACCOUNT}" \
            -backend-config="container_name=${STATE_CONTAINER}" \
            -backend-config="key=${STATE_KEY_NAME}"
          unset ARM_ACCESS_KEY STATE_ACCESS_KEY

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Quota RBAC Bootstrap Plan
        run: terraform plan -input=false -target=azurerm_role_assignment.quota_request_operator -out=quota-rbac.tfplan

      - name: Reject destructive quota bootstrap plan
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json quota-rbac.tfplan > quota-rbac.tfplan.json
          DELETE_COUNT="$(jq '[.resource_changes[]? | select((.change.actions // []) | index("delete"))] | length' quota-rbac.tfplan.json)"
          echo "Quota bootstrap delete/replacement actions: $DELETE_COUNT"
          if [ "$DELETE_COUNT" -ne 0 ]; then
            echo '::error::Destructive actions detected in quota RBAC bootstrap. Refusing to mutate subscription RBAC.'
            terraform show -no-color quota-rbac.tfplan
            exit 1
          fi

      - name: Terraform Apply Quota RBAC Bootstrap
        run: terraform apply -input=false -auto-approve quota-rbac.tfplan

      - name: Verify Terraform-managed quota RBAC
        shell: bash
        run: |
          set -euo pipefail
          QUOTA_PRINCIPAL_ID="$(terraform output -raw quota_identity_principal_id)"
          SUBSCRIPTION_SCOPE="/subscriptions/${AZURE_SUBSCRIPTION_ID}"

          # `az role assignment list --assignee-object-id` is not supported by
          # every Azure CLI version. Terraform state is authoritative for the
          # creation, while `--assignee` provides a portable Azure-side check.
          terraform state show azurerm_role_assignment.quota_request_operator >/dev/null

          for attempt in $(seq 1 12); do
            COUNT="$(az role assignment list \
              --assignee "$QUOTA_PRINCIPAL_ID" \
              --scope "$SUBSCRIPTION_SCOPE" \
              --query "[?roleDefinitionName=='Quota Request Operator'] | length(@)" \
              --output tsv 2>/dev/null || echo 0)"
            if [ "${COUNT:-0}" -ge 1 ]; then
              echo "Quota Request Operator assignment is visible for principal ${QUOTA_PRINCIPAL_ID}."
              exit 0
            fi
            echo "Quota RBAC is in Terraform state; waiting for Azure list visibility (${attempt}/12)."
            sleep 10
          done

          # Do not block here solely on the list API. The next quota-provider
          # registration/write step is the authoritative permission probe and
          # has its own RBAC propagation retries.
          echo '::warning::Quota RBAC list visibility is delayed; continuing to the quota API permission probe.'

      - name: Azure Login OIDC with Quota Identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS Compute Quota Preflight and Recovery
        shell: bash
        run: bash ./ensure-aks-quota.sh

      - name: Azure Login OIDC with Apply Identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: PostgreSQL Capability Preflight
        shell: bash
        run: bash ./check-postgres-capability.sh

      - name: Adopt subscription Defender pricing into Terraform state
        shell: bash
        run: |
          set -euo pipefail

          adopt_pricing() {
            local address="$1"
            local pricing_name="$2"
            local subscription_id
            subscription_id="$(printf '%s' "$AZURE_SUBSCRIPTION_ID" | tr -d '\r\n')"
            local resource_id="/subscriptions/${subscription_id}/providers/Microsoft.Security/pricings/${pricing_name}"

            if terraform state show "$address" >/dev/null 2>&1; then
              echo "$address is already managed in Terraform state."
              return 0
            fi

            az security pricing show --name "$pricing_name" --output none
            terraform import -input=false "$address" "$resource_id"
          }

          adopt_pricing azurerm_security_center_subscription_pricing.key_vaults KeyVaults
          adopt_pricing azurerm_security_center_subscription_pricing.containers Containers

      - name: Terraform Apply Plan
        run: terraform plan -input=false -out=apply.tfplan

      - name: Reject destructive production plan
        shell: bash
        run: |
          set -euo pipefail
          terraform show -json apply.tfplan > apply.tfplan.json
          DELETE_COUNT="$(jq '[.resource_changes[]? | select((.change.actions // []) | index("delete"))] | length' apply.tfplan.json)"
          echo "Planned resource delete/replacement actions: $DELETE_COUNT"

          if [ "$DELETE_COUNT" -ne 0 ]; then
            echo '::error::Destructive Terraform actions detected. Production apply is blocked to protect existing Azure resources.'
            terraform show -no-color apply.tfplan
            exit 1
          fi

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve apply.tfplan

      - name: Terraform Outputs
        run: terraform output

      - name: Verify Azure resources
        shell: bash
        run: |
          set -euo pipefail
          RG='rg-k3s-production'

          az network vnet show --resource-group "$RG" --name k3s-production-vnet --output none
          az network nsg show --resource-group "$RG" --name k3s-production-aks-nsg --output none
          az network nat gateway show --resource-group "$RG" --name k3s-production-nat --output none
          az aks show --resource-group "$RG" --name k3s-production-aks --output none
          az aks nodepool show --resource-group "$RG" --cluster-name k3s-production-aks --name system --output none
          az aks nodepool show --resource-group "$RG" --cluster-name k3s-production-aks --name workload --output none
          az network lb show --resource-group "$RG" --name k3s-production-lb --output none
          az redis show --resource-group "$RG" --name k3s-production-redis --output none
          az postgres flexible-server show --resource-group "$RG" --name k3s-production-postgres --output none
          az monitor log-analytics workspace show --resource-group "$RG" --workspace-name k3s-production-law --output none

          ACR_NAME="$(az acr list --resource-group "$RG" --query "[?starts_with(name, 'k3sprodacr')].name | [0]" --output tsv)"
          KV_NAME="$(az keyvault list --resource-group "$RG" --query "[?starts_with(name, 'k3s-prod-kv-')].name | [0]" --output tsv)"
          test -n "$ACR_NAME"
          test -n "$KV_NAME"

          az network private-endpoint show --resource-group "$RG" --name k3s-production-acr-pe --output none
          az network private-endpoint show --resource-group "$RG" --name k3s-production-kv-pe --output none
          az network private-endpoint show --resource-group "$RG" --name k3s-production-redis-pe --output none
          az network private-endpoint show --resource-group "$RG" --name k3s-production-postgres-pe --output none

          az network private-dns zone show --resource-group "$RG" --name privatelink.azurecr.io --output none
          az network private-dns zone show --resource-group "$RG" --name privatelink.vaultcore.azure.net --output none
          az network private-dns zone show --resource-group "$RG" --name privatelink.redis.cache.windows.net --output none
          az network private-dns zone show --resource-group "$RG" --name privatelink.postgres.database.azure.com --output none

          az identity show --resource-group "$RG" --name k3s-production-workload-identity --output none
          az identity federated-credential show \
            --resource-group "$RG" \
            --identity-name k3s-production-workload-identity \
            --name k3s-production-workload-federation \
            --output none

          KUBELET_OBJECT_ID="$(az aks show --resource-group "$RG" --name k3s-production-aks --query identityProfile.kubeletidentity.objectId --output tsv)"
          ACR_ID="$(az acr show --resource-group "$RG" --name "$ACR_NAME" --query id --output tsv)"
          WI_PRINCIPAL_ID="$(az identity show --resource-group "$RG" --name k3s-production-workload-identity --query principalId --output tsv)"
          KV_ID="$(az keyvault show --resource-group "$RG" --name "$KV_NAME" --query id --output tsv)"

          test "$(az role assignment list --assignee "$KUBELET_OBJECT_ID" --scope "$ACR_ID" --query "[?roleDefinitionName=='AcrPull'] | length(@)" --output tsv)" -ge 1
          test "$(az role assignment list --assignee "$WI_PRINCIPAL_ID" --scope "$KV_ID" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" --output tsv)" -ge 1

          az monitor activity-log alert show --resource-group "$RG" --name k3s-production-administrative-errors --output none
          az resource show --ids "$(terraform output -raw backup_vault_id)" --output none

          RG_ID="$(az group show --name "$RG" --query id --output tsv)"
          az policy assignment show --name k3s-audit-environment-tag --scope "$RG_ID" --output none
          az security pricing show --name Containers --output none
          az security pricing show --name KeyVaults --output none

          QUOTA_PRINCIPAL_ID="$(terraform output -raw quota_identity_principal_id)"
          test "$(az role assignment list --assignee "$QUOTA_PRINCIPAL_ID" --scope "/subscriptions/${AZURE_SUBSCRIPTION_ID}" --query "[?roleDefinitionName=='Quota Request Operator'] | length(@)" --output tsv)" -ge 1

          az aks get-credentials --resource-group "$RG" --name k3s-production-aks --admin --overwrite-existing
          kubectl wait --for=condition=Ready nodes --all --timeout=10m
          NODE_COUNT="$(kubectl get nodes --no-headers | wc -l)"
          test "$NODE_COUNT" -ge 4
          kubectl get nodes -L agentpool,topology.kubernetes.io/zone

          az resource list \
            --resource-group "$RG" \
            --query "[].{name:name,type:type,location:location}" \
            --output table

      - name: Report Apply Run
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const status = '${{ job.status }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Terraform Azure Apply: **${status.toUpperCase()}**`,
              `Run: ${runUrl}`,
              `Commit: \`${context.sha}\``,
              `Attempt: ${process.env.GITHUB_RUN_ATTEMPT || '1'}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 22,
              body,
            });
