name: Terraform IaC Security Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-iac-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-security:
    name: Terraform Security Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        working-directory: infrastructure/terraform/environments/production
        run: terraform fmt -check -recursive ../../..

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/production
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/production
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint init
        working-directory: infrastructure/terraform
        run: tflint --init

      - name: TFLint
        working-directory: infrastructure/terraform
        run: tflint --recursive

      - name: Run Checkov IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false

      - name: Run Trivy IaC security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          severity: HIGH,CRITICAL
          exit-code: '1'
