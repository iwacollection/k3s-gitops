name: Control Contract Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/contracts/**'
      - 'enterprise-cicd/terraform/state/**'
      - 'enterprise-cicd/activation/iac/**'
      - 'enterprise-cicd/testing/contracts/validate_iac_control_plane.py'
      - '.github/workflows/iac-request-dev-plan.yml'
      - '.github/workflows/iac-request-dev-apply.yml'
      - '.github/workflows/control-contract-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'enterprise-cicd/contracts/**'
      - 'enterprise-cicd/terraform/state/**'
      - 'enterprise-cicd/activation/iac/**'
      - 'enterprise-cicd/testing/contracts/validate_iac_control_plane.py'
      - '.github/workflows/iac-request-dev-plan.yml'
      - '.github/workflows/iac-request-dev-apply.yml'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate control contracts
        run: python enterprise-cicd/contracts/validate_contracts.py

      - name: Validate IaC control-plane security boundaries
        run: python enterprise-cicd/testing/contracts/validate_iac_control_plane.py

      - name: Test platform backend rendering
        env:
          TFSTATE_STORAGE_ACCOUNT: sttfstatecontracttest001
        run: |
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope platform \
            --stack identity \
            --auth oidc \
            --output /tmp/platform-backend.hcl
          grep -F 'key                  = "platform/identity.tfstate"' /tmp/platform-backend.hcl
          grep -F 'use_oidc             = true' /tmp/platform-backend.hcl

      - name: Test workload backend rendering
        env:
          TFSTATE_STORAGE_ACCOUNT: sttfstatecontracttest001
        run: |
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope workload \
            --environment dev \
            --workload payment \
            --auth oidc \
            --output /tmp/workload-backend.hcl
          grep -F 'key                  = "workload/dev/payment.tfstate"' /tmp/workload-backend.hcl

      - name: Test catalog request backend rendering
        env:
          TFSTATE_STORAGE_ACCOUNT: sttfstatecontracttest001
        run: |
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog \
            --environment dev \
            --service acr \
            --request payment-acr \
            --auth oidc \
            --output /tmp/catalog-backend.hcl
          grep -F 'key                  = "catalog/dev/acr/payment-acr.tfstate"' /tmp/catalog-backend.hcl

      - name: Verify no Terraform state is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(terraform\.tfstate|[^/]+\.tfstate(\..*)?)$'; then
            echo 'Terraform state file is tracked by Git.' >&2
            exit 1
          fi

      - name: Verify no committed backend runtime file
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)backend\.hcl$'; then
            echo 'Runtime backend.hcl must not be committed.' >&2
            exit 1
          fi
