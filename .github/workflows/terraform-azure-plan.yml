name: Terraform PR Validation

on:
  pull_request:

# PR validation intentionally has no id-token permission and no production
# environment. A pull request must not receive an Azure production identity
# merely to validate Terraform syntax, repository safety and module wiring.
permissions:
  contents: read

jobs:
  terraform-validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-24.04

    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject unsafe tracked artifacts and duplicate Terraform roots
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail

          root_tf="$(find . -maxdepth 1 -type f -name '*.tf' -print)"
          if [ -n "$root_tf" ]; then
            echo '::error::Root-level Terraform files are forbidden. The canonical root is infrastructure/terraform/environments/production.'
            printf '%s\n' "$root_tf"
            exit 1
          fi

          if [ -d infra/terraform ]; then
            echo '::error::Legacy infra/terraform root detected. Do not reintroduce a second Terraform architecture.'
            exit 1
          fi

          forbidden=()
          while IFS= read -r -d '' path; do
            case "$path" in
              *.tfstate|*.tfstate.*|*.tfplan|*.tfplan.json|*backend.generated.tf|*.pem|*.key|*.p12|*.pfx|*kubeconfig*|*.tfvars|*.tfvars.json|.env|*/.env|.env.*|*/.env.*)
                case "$path" in
                  *.example)
                    ;;
                  *)
                    forbidden+=("$path")
                    ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          if [ "${#forbidden[@]}" -ne 0 ]; then
            echo '::error::Sensitive/generated infrastructure artifacts are tracked by Git.'
            printf ' - %s\n' "${forbidden[@]}"
            exit 1
          fi

      - name: Bash Syntax Check
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking ${script}"
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -check -diff -recursive ../../..

      - name: Terraform Init Without Backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate

      - name: Explain Production Plan Boundary
        shell: bash
        run: |
          cat <<'EOF'
          PR validation completed without Azure credentials and without remote state.
          This job is intentionally NOT a production Terraform plan.
          The authoritative production plan is generated from remote AzureRM state
          immediately before Apply and is protected by the destructive-action gate.
          EOF
