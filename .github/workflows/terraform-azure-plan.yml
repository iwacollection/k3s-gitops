name: Terraform Azure Plan

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-azure-plan.yml'

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    environment: production

    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_VAR_database_admin_username: tfplanadmin
      TF_VAR_database_admin_password: PlanOnly-ChangeMe-1234!

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive ../../..

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
