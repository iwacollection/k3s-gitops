name: Terraform Post Apply Verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        default: production
  workflow_run:
    workflows:
      - Terraform Azure Apply
    types:
      - completed

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: terraform-production-verification
  cancel-in-progress: false

jobs:
  verify-production:
    name: Verify Terraform Apply Result
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: production-verification

    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure Login OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Refresh Terraform State
        run: terraform refresh -input=false

      - name: Capture Terraform State Evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-evidence
          terraform show -no-color > verification-evidence/state-after-apply.txt
          terraform output -json > verification-evidence/terraform-output.json
          sha256sum verification-evidence/* > verification-evidence/checksum.txt

      - name: Drift Detection
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -refresh-only -detailed-exitcode -out=drift-check.tfplan
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo 'No Terraform drift detected.'
          elif [ "$rc" -eq 2 ]; then
            echo '::error::Terraform drift detected after apply.'
            terraform show -no-color drift-check.tfplan
            exit 1
          else
            exit "$rc"
          fi

      - name: Upload Verification Evidence
        uses: actions/upload-artifact@v4
        with:
          name: terraform-post-apply-evidence
          path: infrastructure/terraform/environments/production/verification-evidence
          retention-days: 90

      - name: Create Rollback Evidence Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Terraform post apply verification failed.

            Evidence artifact: terraform-post-apply-evidence

            Required actions:
            1. Review drift or verification failure.
            2. Compare Terraform state and Azure resource state.
            3. Execute rollback through a reviewed Terraform change.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform Production Apply Verification Failed',
              body,
              labels: ['terraform', 'incident', 'rollback-review']
            });
