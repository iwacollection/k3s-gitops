name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: target GitHub environment
        required: true
        default: iac-dev-apply
      working_directory:
        description: terraform working directory
        required: true
        default: infrastructure/terraform/environments/dev

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    environment: ${{ inputs.environment }}
    uses: ./.github/workflows/terraform-reusable-enterprise.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      command: apply
