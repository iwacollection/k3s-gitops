name: Terraform Production Pipeline

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/scripts/terraform-*.sh'
      - '.github/workflows/terraform-production.yml'
  push:
    branches:
      - main
    paths:
      - 'infrastructure/terraform/**'
      - '.github/scripts/terraform-*.sh'
      - '.github/workflows/terraform-production.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Production execution mode
        required: true
        default: plan-and-apply
        type: choice
        options:
          - plan-only
          - plan-and-apply
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: terraform-production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'
  TF_VERSION: '1.15.9'
  TF_ROOT: infrastructure/terraform/environments/production

jobs:
  validate:
    name: Validate and Security Gate
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Repository safety checks
        shell: bash
        run: |
          set -euo pipefail

          test -z "$(find . -maxdepth 1 -type f -name '*.tf' -print)" || {
            echo '::error::Root-level Terraform files are forbidden.'
            exit 1
          }

          forbidden=()
          while IFS= read -r -d '' path; do
            case "$path" in
              *.tfstate|*.tfstate.*|*.tfplan|*.tfplan.json|*.pem|*.key|*.p12|*.pfx|*kubeconfig*|*.tfvars|*.tfvars.json|.env|*/.env|.env.*|*/.env.*)
                case "$path" in
                  *.example) ;;
                  *) forbidden+=("$path") ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          if [ "${#forbidden[@]}" -ne 0 ]; then
            echo '::error::Sensitive/generated infrastructure artifacts are tracked by Git.'
            printf ' - %s\n' "${forbidden[@]}"
            exit 1
          fi

          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find infrastructure/terraform .github/scripts -type f -name '*.sh' -print0 2>/dev/null)

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive infrastructure/terraform

      - name: Terraform init without backend
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Checkov IaC security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/terraform
          framework: terraform
          soft_fail: false

  plan:
    name: Production Plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-plan
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_database_admin_username: ${{ secrets.TF_DATABASE_ADMIN_USERNAME }}
      TF_VAR_database_admin_password: ${{ secrets.TF_DATABASE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login with plan/apply identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify steady-state prerequisites
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/terraform-with-backend.sh \
            terraform state show azurerm_role_assignment.quota_request_operator >/dev/null || {
              echo '::error::Quota Request Operator bootstrap is not managed in Terraform state.'
              echo 'Use recovery/bootstrap procedure before production deployment.'
              exit 1
            }

      - name: PostgreSQL capability preflight
        working-directory: ${{ env.TF_ROOT }}
        run: bash ./check-postgres-capability.sh

      - name: Build production plan
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TF_ROOT/plan-artifact"
          mkdir -p "$TF_ROOT/plan-artifact"

          .github/scripts/terraform-with-backend.sh bash -c '
            terraform plan -input=false -lock-timeout=5m -out=plan-artifact/production.tfplan
            terraform show -json plan-artifact/production.tfplan > /tmp/production.tfplan.json
          '

          DELETE_COUNT="$(jq '[.resource_changes[]? | select((.change.actions // []) | index("delete"))] | length' /tmp/production.tfplan.json)"
          echo "Delete/replacement actions: $DELETE_COUNT"
          if [ "$DELETE_COUNT" -ne 0 ]; then
            echo '::error::Delete or replacement detected. Standard production pipeline refuses destructive changes.'
            exit 1
          fi

          (
            cd "$TF_ROOT/plan-artifact"
            sha256sum production.tfplan > production.tfplan.sha256
            printf 'commit=%s\nrun_id=%s\nrepository=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > metadata.txt
          )

      - name: Upload immutable production plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-production-plan-${{ github.run_id }}
          path: infrastructure/terraform/environments/production/plan-artifact
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Approved Apply Same Plan
    if: |
      needs.plan.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan-and-apply'))
    needs:
      - validate
      - plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-apply-approval
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_database_admin_username: ${{ secrets.TF_DATABASE_ADMIN_USERNAME }}
      TF_VAR_database_admin_password: ${{ secrets.TF_DATABASE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout exact planned revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download approved plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-production-plan-${{ github.run_id }}
          path: infrastructure/terraform/environments/production/plan-artifact

      - name: Verify plan identity and integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "commit=${GITHUB_SHA}" "$TF_ROOT/plan-artifact/metadata.txt"
          grep -Fx "run_id=${GITHUB_RUN_ID}" "$TF_ROOT/plan-artifact/metadata.txt"
          (
            cd "$TF_ROOT/plan-artifact"
            sha256sum -c production.tfplan.sha256
          )

      - name: Azure login with quota identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS quota readiness
        working-directory: ${{ env.TF_ROOT }}
        run: bash ./ensure-aks-quota.sh

      - name: Azure login with apply identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply exact approved plan
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/terraform-with-backend.sh \
            terraform apply -input=false -lock-timeout=5m plan-artifact/production.tfplan

  verify:
    name: Post Apply Verification
    if: needs.apply.result == 'success'
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-verification
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_database_admin_username: ${{ secrets.TF_DATABASE_ADMIN_USERNAME }}
      TF_VAR_database_admin_password: ${{ secrets.TF_DATABASE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login with OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure and AKS resources
        shell: bash
        run: .github/scripts/verify-production.sh

      - name: Post-apply drift check
        shell: bash
        run: |
          set -euo pipefail
          .github/scripts/terraform-with-backend.sh bash -c '
            set +e
            terraform plan -refresh-only -detailed-exitcode -lock-timeout=5m -out=post-apply-drift.tfplan
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "No post-apply drift detected."
            elif [ "$rc" -eq 2 ]; then
              echo "::error::Drift detected immediately after Apply."
              terraform show -no-color post-apply-drift.tfplan
              exit 1
            else
              exit "$rc"
            fi
          '

  drift:
    name: Scheduled Drift Detection
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-verification
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_database_admin_username: ${{ secrets.TF_DATABASE_ADMIN_USERNAME }}
      TF_VAR_database_admin_password: ${{ secrets.TF_DATABASE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login with OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca
        with:
          client-id: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Detect drift
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          set +e
          .github/scripts/terraform-with-backend.sh \
            terraform plan -refresh-only -detailed-exitcode -lock-timeout=5m
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          if [ "$rc" -eq 0 ]; then
            echo 'No drift detected.'
          elif [ "$rc" -eq 2 ]; then
            echo '::error::Terraform drift detected.'
            exit 2
          else
            exit "$rc"
          fi

      - name: Create drift incident
        if: failure() && steps.drift.outputs.exit_code == '2'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform Production Drift Detected',
              body: `Scheduled drift detection found a difference between Terraform and Azure. Review: ${runUrl}`
            });
