name: Terraform Production Apply Gated

on:
  workflow_dispatch:
    inputs:
      plan_artifact:
        description: Terraform plan artifact name
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Production Terraform Apply
    environment:
      name: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan_artifact }}
          path: infrastructure/terraform/plan

      - name: Terraform Apply Approved Plan
        working-directory: infrastructure/terraform
        run: terraform apply -input=false plan/tfplan

      - name: Post Apply Verification
        working-directory: infrastructure/terraform
        run: terraform show -no-color
