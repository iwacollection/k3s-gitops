name: Platform Activation Readiness

on:
  pull_request:
    paths:
      - 'enterprise-cicd/contracts/**'
      - 'enterprise-cicd/build-images/**'
      - 'enterprise-cicd/iac-catalog/services/postgresql-flexible/**'
      - 'enterprise-cicd/activation/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      strict_external_bindings:
        description: Fail unless real external production identity bindings and activation switches are complete
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate code and activation contracts
        shell: bash
        env:
          STRICT: ${{ inputs.strict_external_bindings || false }}
        run: |
          set -euo pipefail
          args=(--output /tmp/platform-activation-readiness.json)
          if [ "$STRICT" = "true" ]; then
            args+=(--strict-external)
          fi
          python enterprise-cicd/activation/validate_readiness.py "${args[@]}"
          {
            echo '## Platform activation readiness'
            echo '```json'
            cat /tmp/platform-activation-readiness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
