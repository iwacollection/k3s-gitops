name: Terraform Resource Adoption Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/terraform/**'

jobs:
  adoption-gate:
    name: Validate no destructive Terraform adoption changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run adoption safety check
        run: |
          if [ -f tfplan.json ]; then
            bash scripts/terraform/resource-adoption-check.sh tfplan.json
          else
            echo "No tfplan.json artifact found. Gate script is installed and ready for Terraform plan integration."
          fi
