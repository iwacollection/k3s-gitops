name: Terraform Production Apply

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Terraform plan artifact name
        required: true
        default: terraform-plan

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved terraform plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Terraform init
        run: |
          terraform -version
          terraform init -backend=false infrastructure/terraform/environments/production

      - name: Terraform apply approved plan
        run: |
          terraform apply -input=false tfplan
