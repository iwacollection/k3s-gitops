name: Terraform Production Apply

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Terraform plan artifact name
        required: true
        default: terraform-plan

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved terraform plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}

      - name: Verify plan artifact
        run: |
          test -f tfplan
          terraform show tfplan > /dev/null

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init production backend
        working-directory: infrastructure/terraform/environments/production
        run: terraform init

      - name: Terraform apply approved plan
        working-directory: infrastructure/terraform/environments/production
        run: terraform apply -input=false ../../../tfplan
