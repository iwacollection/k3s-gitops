name: Terraform Production Risk Gate

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform plan placeholder
        run: |
          echo "Generate terraform plan json in real environment"
          echo "Run destroy-replace-risk-check.py against plan json"

      - name: Production safety reminder
        run: |
          echo "Apply requires reviewed plan artifact and approval"
