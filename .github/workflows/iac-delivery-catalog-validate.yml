name: IaC Delivery Catalog Validate

on:
  pull_request:
    paths:
      - 'enterprise-cicd/terraform/modules/**'
      - 'enterprise-cicd/terraform/stacks/platform/acr/**'
      - 'enterprise-cicd/terraform/stacks/platform/connectivity/**'
      - 'enterprise-cicd/terraform/stacks/workloads/**'
      - 'enterprise-cicd/iac-catalog/services/**'
      - 'enterprise-cicd/iac-catalog/render_request.py'
      - 'enterprise-cicd/contracts/iac-runtime-bindings.json'
      - 'enterprise-cicd/contracts/iac-platform-foundation.json'
      - 'enterprise-cicd/contracts/state-contract.json'
      - 'enterprise-cicd/terraform/state/**'
      - 'enterprise-cicd/activation/iac/**'
      - 'enterprise-cicd/testing/contracts/validate_iac_delivery_catalog.py'
      - 'enterprise-cicd/testing/contracts/validate_iac_apply_coverage.py'
      - '.github/workflows/iac-request-apply.yml'
      - '.github/workflows/iac-request-protected-capability-apply.yml'
      - '.github/workflows/iac-request-workload-capability-apply.yml'
      - '.github/workflows/iac-active-catalog-real-plan.yml'
      - '.github/workflows/iac-platform-foundation.yml'
      - '.github/workflows/iac-delivery-catalog-validate.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate delivery catalog, Apply planes and security contracts
        run: |
          python enterprise-cicd/testing/contracts/validate_iac_delivery_catalog.py
          python enterprise-cicd/testing/contracts/validate_iac_apply_coverage.py

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack:
          - enterprise-cicd/terraform/stacks/workloads/managed-identity
          - enterprise-cicd/terraform/stacks/platform/connectivity
          - enterprise-cicd/terraform/stacks/workloads/iam-role-binding
          - enterprise-cicd/terraform/stacks/workloads/load-balancer
          - enterprise-cicd/terraform/stacks/workloads/vpn-gateway
          - enterprise-cicd/terraform/stacks/platform/acr
          - enterprise-cicd/terraform/stacks/workloads/storage
          - enterprise-cicd/terraform/stacks/workloads/key-vault
          - enterprise-cicd/terraform/stacks/workloads/service-bus
          - enterprise-cicd/terraform/stacks/workloads/managed-redis
          - enterprise-cicd/terraform/stacks/workloads/postgresql-flexible
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Init and validate ${{ matrix.stack }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ matrix.stack }}" init -backend=false -input=false
          terraform -chdir="${{ matrix.stack }}" validate

  plan-binding:
    runs-on: ubuntu-latest
    outputs:
      client_id: ${{ steps.binding.outputs.client_id }}
      tenant_id: ${{ steps.binding.outputs.tenant_id }}
      subscription_id: ${{ steps.binding.outputs.subscription_id }}
      state_rg: ${{ steps.binding.outputs.state_rg }}
      state_storage: ${{ steps.binding.outputs.state_storage }}
      apply_principal_id: ${{ steps.binding.outputs.apply_principal_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve proven DEV Plan identity and remote state
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          BINDING=enterprise-cicd/contracts/iac-runtime-bindings.json
          test "$(jq -r '.environments.dev.activationStatus' "$BINDING")" = ready
          test "$(jq -r '.environments.dev.plan.githubEnvironment' "$BINDING")" = iac-dev-plan
          test "$(jq -r '.environments.dev.plan.resourceWriteAccess' "$BINDING")" = false
          test "$(jq -r '.environments.dev.plan.stateDataRole' "$BINDING")" = 'Storage Blob Data Contributor'
          test "$(jq -r '.environments.dev.plan.stateScope' "$BINDING")" = container
          test "$(jq -r '.state.authentication' "$BINDING")" = MicrosoftEntraID
          test "$(jq -r '.state.sharedKeyAccess' "$BINDING")" = false
          for pair in \
            "client_id:.environments.dev.plan.clientId" \
            "tenant_id:.azure.tenantId" \
            "subscription_id:.azure.subscriptionId" \
            "state_rg:.state.resourceGroup" \
            "state_storage:.state.storageAccount" \
            "apply_principal_id:.environments.dev.apply.principalId"; do
            key="${pair%%:*}"; expr="${pair#*:}"; value="$(jq -r "$expr // empty" "$BINDING")"
            test -n "$value"; echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

  real-plan:
    needs: plan-binding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: iac-dev-plan
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - managed-identity
          - network
          - iam-role-binding
          - load-balancer
          - vpn-gateway
          - acr
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      ARM_CLIENT_ID: ${{ needs.plan-binding.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.plan-binding.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.plan-binding.outputs.subscription_id }}
      TFSTATE_RESOURCE_GROUP: ${{ needs.plan-binding.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.plan-binding.outputs.state_storage }}
      APPLY_PRINCIPAL_ID: ${{ needs.plan-binding.outputs.apply_principal_id }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ needs.plan-binding.outputs.client_id }}
          tenant-id: ${{ needs.plan-binding.outputs.tenant_id }}
          subscription-id: ${{ needs.plan-binding.outputs.subscription_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Prepare governed catalog real-Plan fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          DIR=/tmp/iac-delivery-plan
          mkdir -p "$DIR"
          cp "enterprise-cicd/iac-catalog/services/${SERVICE}/v1/request.example.json" "$DIR/request.json"
          python - <<'PY'
          import json, os
          p='/tmp/iac-delivery-plan/request.json'; r=json.load(open(p))
          r['spec']['environment']='dev'; r['metadata']['name']=f"delivery-plan-{os.environ['SERVICE']}"; r['metadata']['application']='iac-delivery-plan'
          if os.environ['SERVICE']=='iam-role-binding':
              r['spec']['parameters'].update({
                'principalId':os.environ['APPLY_PRINCIPAL_ID'],'principalType':'ServicePrincipal','roleName':'Reader',
                'scopeResourceId':f"/subscriptions/{os.environ['ARM_SUBSCRIPTION_ID']}/resourceGroups/rg-platform-cicd"
              })
          json.dump(r,open(p,'w'),indent=2)
          PY
          python enterprise-cicd/iac-catalog/render_request.py --request "$DIR/request.json" --output "$DIR/${SERVICE}.tfvars.json"
          STACK="$(jq -r .rootStack "enterprise-cicd/iac-catalog/services/${SERVICE}/v1/catalog.json")"
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog --environment dev --service "$SERVICE" --request "delivery-plan-${SERVICE}" --auth oidc \
            --output "$DIR/${SERVICE}.backend.hcl"
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
      - name: Run real remote-state Terraform Plan
        shell: bash
        env:
          STACK: ${{ steps.fixture.outputs.stack }}
        run: |
          set -euo pipefail
          DIR=/tmp/iac-delivery-plan
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config="$DIR/${SERVICE}.backend.hcl"
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false \
            -var-file="$DIR/${SERVICE}.tfvars.json" -out="$DIR/${SERVICE}.tfplan"
          terraform -chdir="$STACK" show -json "$DIR/${SERVICE}.tfplan" > "$DIR/${SERVICE}.plan.json"
      - name: Enforce delivery Plan resource boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "/tmp/iac-delivery-plan/${SERVICE}.plan-summary.json"
          import json, os
          service=os.environ['SERVICE']; plan=json.load(open(f'/tmp/iac-delivery-plan/{service}.plan.json'))
          changes=[]
          for rc in plan.get('resource_changes',[]):
              if rc.get('mode','managed') != 'managed': continue
              actions=rc.get('change',{}).get('actions',[])
              if actions != ['no-op']: changes.append({'address':rc.get('address'),'type':rc.get('type'),'actions':actions})
          if not changes: raise SystemExit(f'{service}: real Plan fixture produced no changes')
          destructive=[x for x in changes if 'delete' in x['actions']]
          if destructive: raise SystemExit(f'{service}: destructive delivery Plan forbidden: {destructive}')
          allowed={
            'managed-identity':{'azurerm_resource_group','azurerm_user_assigned_identity'},
            'network':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet'},
            'iam-role-binding':{'azurerm_role_assignment'},
            'load-balancer':{'azurerm_resource_group','azurerm_public_ip','azurerm_lb','azurerm_lb_backend_address_pool','azurerm_lb_probe','azurerm_lb_rule'},
            'vpn-gateway':{'azurerm_resource_group','azurerm_virtual_network','azurerm_subnet','azurerm_public_ip','azurerm_virtual_network_gateway'},
            'acr':{'azurerm_resource_group','azurerm_container_registry'},
          }[service]
          unexpected=sorted({x['type'] for x in changes}-allowed)
          if unexpected: raise SystemExit(f'{service}: unexpected resource types {unexpected}')
          print(json.dumps({'service':service,'realRemoteStatePlan':True,'resourceMutationAllowed':False,'changes':changes,'destructive':[],'status':'passed'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iac-delivery-real-plan-${{ matrix.service }}
          path: /tmp/iac-delivery-plan
          retention-days: 30

  gate:
    if: ${{ always() }}
    needs: [contract, terraform, plan-binding, real-plan]
    runs-on: ubuntu-latest
    steps:
      - name: Require delivery validation and real Plans
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.contract.result }}' = success
          test '${{ needs.terraform.result }}' = success
          test '${{ needs.plan-binding.result }}' = success
          test '${{ needs.real-plan.result }}' = success
