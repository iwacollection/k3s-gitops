name: IaC Request TEST PROD Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [test, prod]
      request_path:
        description: Committed managed-identity or network InfrastructureRequest path
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      service: ${{ steps.resolve.outputs.service }}
      request_name: ${{ steps.resolve.outputs.request_name }}
      stack: ${{ steps.resolve.outputs.stack }}
      client_id: ${{ steps.resolve.outputs.client_id }}
      tenant_id: ${{ steps.resolve.outputs.tenant_id }}
      subscription_id: ${{ steps.resolve.outputs.subscription_id }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      state_rg: ${{ steps.resolve.outputs.state_rg }}
      state_storage: ${{ steps.resolve.outputs.state_storage }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve standard environment Apply binding
        id: resolve
        env:
          TARGET_ENV: ${{ inputs.environment }}
          REQUEST_PATH: ${{ inputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path, PurePosixPath

          env=os.environ['TARGET_ENV']
          raw=os.environ['REQUEST_PATH'].strip()
          if env not in {'test','prod'}:
              raise SystemExit('standard promoted Apply accepts test or prod only')
          if not raw or raw.startswith('/') or '..' in PurePosixPath(raw).parts:
              raise SystemExit('unsafe request_path')
          if not raw.startswith(f'enterprise-cicd/iac-requests/{env}/') or not raw.endswith('.json') or raw.endswith('.example.json'):
              raise SystemExit(f'request_path must be a committed {env} request')
          path=Path(raw)
          if not path.is_file():
              raise SystemExit(f'request missing at current ref: {raw}')
          req=json.loads(path.read_text()); spec=req['spec']; meta=req['metadata']
          if spec['environment'] != env:
              raise SystemExit('request environment mismatch')
          service=spec['service']
          supported={'managed-identity','network'}
          if service not in supported:
              raise SystemExit(f'service={service} is not a standard Apply service; supported={sorted(supported)}')
          version=spec['templateVersion']
          catalog=json.loads(Path(f'enterprise-cicd/iac-catalog/services/{service}/{version}/catalog.json').read_text())
          if catalog.get('lifecycle') != 'active':
              raise SystemExit('catalog is not active')

          binding=json.loads(Path('enterprise-cicd/contracts/iac-runtime-bindings.json').read_text())
          runtime=binding['environments'][env]
          if runtime.get('activationStatus') != 'ready':
              raise SystemExit(f'{env} IaC runtime is not activated: {runtime.get("activationStatus")}')
          apply=runtime.get('apply') or {}
          if apply.get('githubEnvironment') != f'iac-{env}-apply':
              raise SystemExit('Apply GitHub Environment mismatch')
          if apply.get('stateWriteAccess') is not True:
              raise SystemExit('Apply identity must own state writes')
          if apply.get('stateDataRole') != 'Storage Blob Data Contributor' or apply.get('stateScope') != 'container':
              raise SystemExit('Apply state role must remain container-scoped Blob Data Contributor')
          if apply.get('genericContributor') is not False or apply.get('roleAssignmentWrite') is not False:
              raise SystemExit('standard Apply privilege guard failed')
          if not apply.get('clientId'):
              raise SystemExit(f'{env} Apply binding has no real clientId')
          if service == 'network':
              network=runtime.get('networkFoundation') or {}
              if network.get('activationStatus') != 'ready':
                  raise SystemExit(f'{env} VNet/Subnet capability is not activated')
              for key in ('genericNetworkContributor','publicIpWrite','natGatewayWrite','peeringWrite','vpnGatewayWrite','applicationGatewayWrite','roleAssignmentWrite'):
                  if network.get(key) is not False:
                      raise SystemExit(f'network foundation privilege guard failed: {key}')

          azure=binding['azure']; state=binding['state']
          if state.get('authentication') != 'MicrosoftEntraID' or state.get('sharedKeyAccess') is not False:
              raise SystemExit('state must remain Entra-only')
          values={
              'environment':env,'service':service,'request_name':meta['name'],
              'stack':catalog['rootStack'],'client_id':apply['clientId'],
              'tenant_id':azure['tenantId'],'subscription_id':azure['subscriptionId'],
              'github_environment':f'iac-{env}-apply','state_rg':state['resourceGroup'],
              'state_storage':state['storageAccount']
          }
          for key,value in values.items(): print(f'{key}={value}')
          PY

  exact-plan-apply:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ needs.resolve.outputs.github_environment }}
    concurrency:
      group: iac-${{ needs.resolve.outputs.environment }}-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ needs.resolve.outputs.client_id }}
      ARM_TENANT_ID: ${{ needs.resolve.outputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ needs.resolve.outputs.subscription_id }}
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: 'none'
      TFSTATE_RESOURCE_GROUP: ${{ needs.resolve.outputs.state_rg }}
      TFSTATE_STORAGE_ACCOUNT: ${{ needs.resolve.outputs.state_storage }}
      REQUEST_PATH: ${{ inputs.request_path }}
      TARGET_ENV: ${{ needs.resolve.outputs.environment }}
      SERVICE: ${{ needs.resolve.outputs.service }}
      REQUEST_NAME: ${{ needs.resolve.outputs.request_name }}
      STACK: ${{ needs.resolve.outputs.stack }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login using dedicated environment Apply OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ needs.resolve.outputs.client_id }}
          tenant-id: ${{ needs.resolve.outputs.tenant_id }}
          subscription-id: ${{ needs.resolve.outputs.subscription_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Render request and backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iac-env-apply
          python enterprise-cicd/iac-catalog/render_request.py --request "$REQUEST_PATH" --output /tmp/iac-env-apply/request.tfvars.json
          python enterprise-cicd/terraform/state/render_backend.py \
            --scope catalog --environment "$TARGET_ENV" --service "$SERVICE" --request "$REQUEST_NAME" --auth oidc \
            --output /tmp/iac-env-apply/backend.hcl

      - name: Re-plan with state lock and reject delete
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" init -reconfigure -input=false -backend-config=/tmp/iac-env-apply/backend.hcl
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" plan -lock=true -lock-timeout=5m -input=false \
            -var-file=/tmp/iac-env-apply/request.tfvars.json -out=/tmp/iac-env-apply/apply.tfplan
          terraform -chdir="$STACK" show -json /tmp/iac-env-apply/apply.tfplan > /tmp/iac-env-apply/plan.json
          python - <<'PY' | tee /tmp/iac-env-apply/plan-summary.json
          import json
          p=json.load(open('/tmp/iac-env-apply/plan.json'))
          changes=[]
          for rc in p.get('resource_changes',[]):
              actions=rc.get('change',{}).get('actions',[])
              if actions != ['no-op']: changes.append({'address':rc.get('address'),'actions':actions})
          bad=[x for x in changes if 'delete' in x['actions']]
          if bad: raise SystemExit(f'destructive Apply forbidden; use decommission flow: {bad}')
          print(json.dumps({'changes':changes,'destructive':[],'exactSavedPlan':True,'status':'approved'},indent=2))
          PY

      - name: Apply exact saved plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$STACK" apply -input=false -auto-approve /tmp/iac-env-apply/apply.tfplan
          terraform -chdir="$STACK" output -json > /tmp/iac-env-apply/terraform-outputs.json

      - name: Verify managed identity
        if: ${{ needs.resolve.outputs.service == 'managed-identity' }}
        shell: bash
        run: |
          set -euo pipefail
          RG="$(jq -r '.resource_group_name' /tmp/iac-env-apply/request.tfvars.json)"
          IDENTITY="$(jq -r '.identity_name' /tmp/iac-env-apply/request.tfvars.json)"
          az group show -n "$RG" -o json > /tmp/iac-env-apply/resource-group.json
          az identity show -g "$RG" -n "$IDENTITY" -o json > /tmp/iac-env-apply/managed-identity.json
          python - <<'PY' | tee /tmp/iac-env-apply/verification-summary.json
          import json
          t=json.load(open('/tmp/iac-env-apply/request.tfvars.json'))
          i=json.load(open('/tmp/iac-env-apply/managed-identity.json'))
          o=json.load(open('/tmp/iac-env-apply/terraform-outputs.json'))
          assert i['name'] == t['identity_name'] and i['id'] == o['identity_id']['value']
          assert i['principalId'] == o['identity_principal_id']['value']
          print(json.dumps({'status':'passed','service':'managed-identity','identity':i['name'],'remoteState':True,'exactSavedPlanApplied':True},indent=2))
          PY

      - name: Verify VNet and Subnet only
        if: ${{ needs.resolve.outputs.service == 'network' }}
        shell: bash
        run: |
          set -euo pipefail
          RG="$(jq -r '.resource_group_name' /tmp/iac-env-apply/request.tfvars.json)"
          VNET="$(jq -r '.virtual_network_name' /tmp/iac-env-apply/request.tfvars.json)"
          SUBNET="$(jq -r '.subnets | keys[0]' /tmp/iac-env-apply/request.tfvars.json)"
          az network vnet show -g "$RG" -n "$VNET" -o json > /tmp/iac-env-apply/vnet.json
          az network vnet subnet show -g "$RG" --vnet-name "$VNET" -n "$SUBNET" -o json > /tmp/iac-env-apply/subnet.json
          python - <<'PY' | tee /tmp/iac-env-apply/verification-summary.json
          import json
          t=json.load(open('/tmp/iac-env-apply/request.tfvars.json'))
          v=json.load(open('/tmp/iac-env-apply/vnet.json'))
          s=json.load(open('/tmp/iac-env-apply/subnet.json'))
          o=json.load(open('/tmp/iac-env-apply/terraform-outputs.json'))
          name=next(iter(t['subnets']))
          assert v['id'] == o['virtual_network_id']['value']
          assert s['id'] == o['subnet_ids']['value'][name]
          assert not (v.get('virtualNetworkPeerings') or [])
          assert s.get('natGateway') is None and s.get('networkSecurityGroup') is None and s.get('routeTable') is None
          assert t['nat_gateway'] is None and t['network_security_groups'] == {} and t['route_tables'] == {}
          print(json.dumps({'status':'passed','service':'network','vnet':v['name'],'subnet':s['name'],'paidNetworkAddOnsDetected':False,'remoteState':True,'exactSavedPlanApplied':True},indent=2))
          PY

      - name: Publish promoted environment Apply evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iac-${{ needs.resolve.outputs.environment }}-apply-${{ needs.resolve.outputs.request_name }}
          path: /tmp/iac-env-apply
          if-no-files-found: error
          retention-days: 90
