name: Terraform Production Plan Validation

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terraform format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Terraform validation placeholder
        run: echo "Run terraform init and validate with environment backend configuration"

      - name: Production risk reminder
        run: |
          echo "Review destroy and replace actions before apply"
          echo "Production resources must be imported before management"
