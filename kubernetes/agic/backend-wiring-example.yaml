apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-validation
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-validation
  template:
    metadata:
      labels:
        app: ingress-validation
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-validation
spec:
  selector:
    app: ingress-validation
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-validation
  annotations:
    kubernetes.io/ingress.class: azure-application-gateway
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: validation.example.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ingress-validation
            port:
              number: 80
