name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    # Production repositories should pin this reference to an approved immutable
    # platform release tag or commit SHA. Do not follow @main in production.
    uses: iwacollection/k3s-gitops/.github/workflows/reusable-application-ci-v1.yml@PLATFORM_RELEASE_REF
    with:
      application_definition: enterprise-cicd/application-definitions/payment-api.json
      acr_name: companyacr
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      MAVEN_PROXY_URL: ${{ secrets.MAVEN_PROXY_URL }}
      PYPI_INDEX_URL: ${{ secrets.PYPI_INDEX_URL }}
      GO_PROXY_URL: ${{ secrets.GO_PROXY_URL }}
      CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
