name: Reusable Build Platform Images

on:
  workflow_call:
    inputs:
      acr_name:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          data = json.loads(Path('enterprise-cicd/build-images/versions.json').read_text())
          include = []
          for image, cfg in data['images'].items():
              include.append({'image': image, 'context': cfg['context'], 'dockerfile': cfg['dockerfile']})
          print('matrix=' + json.dumps({'include': include}, separators=(',', ':')))
          PY

  build:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        id: acr
        shell: bash
        env:
          ACR_NAME: ${{ inputs.acr_name }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          echo "login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish versioned build image
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --push \
            --sbom=true \
            --provenance=mode=max \
            -f "$CONTEXT/$DOCKERFILE" \
            -t "$LOGIN_SERVER/build/$IMAGE" \
            "$CONTEXT"

      - name: Scan published build image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.acr.outputs.login_server }}/build/${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
