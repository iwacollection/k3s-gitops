[project]
name = "platform-smoke-api"
version = "0.1.0"
description = "Enterprise CI/CD platform E2E smoke API"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_smoke_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
