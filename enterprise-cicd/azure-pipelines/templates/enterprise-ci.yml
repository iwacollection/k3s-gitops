parameters:
  - name: language
    type: string
    values:
      - go
      - python
      - java
      - cpp
  - name: buildCommand
    type: string
  - name: workingDirectory
    type: string
    default: .

stages:
  - stage: Validate
    displayName: Validate pipeline contract
    jobs:
      - job: ValidateContract
        pool:
          vmImage: ubuntu-latest
        steps:
          - bash: |
              set -euo pipefail
              case '${{ parameters.language }}' in
                go|python|java|cpp) ;;
                *) echo 'unsupported language' >&2; exit 2 ;;
              esac
            displayName: Validate language

  - stage: Build
    displayName: Build
    dependsOn: Validate
    jobs:
      - job: Build
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: |
              set -euo pipefail
              ${{ parameters.buildCommand }}
            workingDirectory: ${{ parameters.workingDirectory }}
            displayName: Execute repository build contract
