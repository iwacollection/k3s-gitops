parameters:
  - name: azureServiceConnection
    type: string
  - name: acrName
    type: string
  - name: resourceGroup
    type: string
    default: group-test
  - name: aksCluster
    type: string
    default: k8s-test-cicd
  - name: namespace
    type: string
    default: cicd-dev

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildAndDeploy
    displayName: Build, push and deploy smoke workload
    jobs:
      - job: EndToEnd
        timeoutInMinutes: 20
        steps:
          - checkout: self
            clean: true

          - task: AzureCLI@2
            displayName: Azure OIDC build and deploy
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                IMAGE_NAME="enterprise-cicd-smoke"
                IMAGE_TAG="$(Build.SourceVersion)"
                LOGIN_SERVER="${{ parameters.acrName }}.azurecr.io"
                IMAGE="${LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"
                CHART_PATH="enterprise-cicd/helm/smoke-service"
                BUILD_CONTEXT="enterprise-cicd/examples/go-service"
                RELEASE="enterprise-cicd-smoke"
                NAMESPACE="${{ parameters.namespace }}"

                echo "[1] Azure identity"
                az account show --query '{subscription:name,id:id,tenant:tenantId}' -o table

                echo "[2] ACR login"
                az acr login --name '${{ parameters.acrName }}'

                echo "[3] Build and push immutable image"
                docker build \
                  --pull \
                  --label "org.opencontainers.image.revision=$(Build.SourceVersion)" \
                  --tag "$IMAGE" \
                  "$BUILD_CONTEXT"
                docker push "$IMAGE"

                DIGEST="$(az acr repository show \
                  --name '${{ parameters.acrName }}' \
                  --image "${IMAGE_NAME}:${IMAGE_TAG}" \
                  --query digest -o tsv)"

                echo "[4] Install AKS clients"
                mkdir -p "$(Agent.TempDirectory)/aks-bin"
                az aks install-cli \
                  --install-location "$(Agent.TempDirectory)/aks-bin/kubectl" \
                  --kubelogin-install-location "$(Agent.TempDirectory)/aks-bin/kubelogin"
                export PATH="$(Agent.TempDirectory)/aks-bin:$PATH"

                echo "[5] AKS non-admin context"
                export KUBECONFIG="$(Agent.TempDirectory)/aks-kubeconfig"
                az aks get-credentials \
                  --resource-group '${{ parameters.resourceGroup }}' \
                  --name '${{ parameters.aksCluster }}' \
                  --file "$KUBECONFIG" \
                  --overwrite-existing
                kubelogin convert-kubeconfig -l azurecli --kubeconfig "$KUBECONFIG"

                echo "[6] Verify namespace permission"
                test "$(kubectl auth can-i create deployments.apps --namespace "$NAMESPACE")" = "yes"

                echo "[7] Helm deploy"
                helm lint "$CHART_PATH"
                helm upgrade --install "$RELEASE" "$CHART_PATH" \
                  --namespace "$NAMESPACE" \
                  --atomic \
                  --wait \
                  --timeout 5m \
                  --set-string image.repository="${LOGIN_SERVER}/${IMAGE_NAME}" \
                  --set-string image.tag="$IMAGE_TAG"

                echo "[8] Verify rollout"
                kubectl rollout status deployment/$RELEASE --namespace "$NAMESPACE" --timeout=180s
                kubectl get deployment,pod,service --namespace "$NAMESPACE" -l app.kubernetes.io/instance=$RELEASE -o wide
                echo "image_digest=$DIGEST"
