apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-smoke
    spec:
      containers:
        - name: app
          image: platform.local/go-smoke:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
