apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-cmdb.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-cmdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-cmdb
    spec:
      containers:
        - name: enterprise-cmdb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.health.readinessPath }}
              port: 8080
          livenessProbe:
            httpGet:
              path: {{ .Values.health.livenessPath }}
              port: 8080
