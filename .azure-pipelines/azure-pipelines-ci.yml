trigger:
  branches:
    include:
      - '*'   # adjust to your branch policy

pr:
  branches:
    include:
      - '*'

variables:
  - name: azureSubscription
    value: '<YOUR-AZURE-SERVICE-CONNECTION-NAME>'
  - name: ACR_NAME
    value: '<your-acr-name>'
  - name: IMAGE_NAME
    value: 'example-service'
  - name: TF_AKS_RG
    value: 'rg-k3s-gitops-dev'
  - name: TF_AKS_CLUSTER
    value: 'k3s-gitops-dev-aks'

stages:
  - stage: Lint
    displayName: Terraform lint & security checks
    jobs:
      - job: TerraformLint
        displayName: Terraform lint & checkov
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Checkout@v4
          - script: |
              echo "Install tflint"
              curl -sL https://github.com/terraform-linters/tflint/releases/download/v0.41.0/tflint_linux_amd64.zip -o /tmp/tflint.zip
              unzip /tmp/tflint.zip -d /tmp
              sudo mv /tmp/tflint /usr/local/bin/
            displayName: 'Install tflint'
          - script: |
              cd infra/terraform
              tflint --module
            displayName: 'Run tflint'
          - script: |
              echo "Run checkov"
              pip install --user checkov
              ~/.local/bin/checkov -d infra/terraform || true
            displayName: 'Run checkov (IaC security scan)'

  - stage: Build
    displayName: Build and push image
    dependsOn: Lint
    jobs:
      - job: Build
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Checkout@v4

          - task: AzureCLI@2
            displayName: 'Login to Azure'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Logged in to Azure"

          - script: |
              IMAGE=${ACR_LOGIN_SERVER}/${IMAGE_NAME}:$(Build.SourceVersion)
              echo "##vso[task.setvariable variable=IMAGE]$IMAGE"
            displayName: 'Set IMAGE variable (preview tag)'

          - task: Docker@2
            displayName: Build and push image to ACR
            inputs:
              command: buildAndPush
              repository: '$(ACR_NAME)/$(IMAGE_NAME)'
              dockerfile: 'apps/example-service/Dockerfile'
              tags: |
                $(Build.SourceVersion)
            env:
              ACR_PASSWORD: $(ACR_PASSWORD)

          - script: |
              echo "Run Trivy scan against pushed image"
              pip install --user trivy
              ~/.local/bin/trivy image --format table $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.SourceVersion) || true
            displayName: 'Trivy image scan'

  - stage: DeployPreview
    displayName: Deploy preview to AKS (PRs)
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Checkout@v4

          - task: AzureCLI@2
            displayName: 'Login to Azure'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo 'Logging in to Azure'

          - script: |
              set -e
              az aks get-credentials --resource-group $(TF_AKS_RG) --name $(TF_AKS_CLUSTER) --overwrite-existing
              PREVIEW_NS=preview-$(System.PullRequest.PullRequestId)
              kubectl create namespace $PREVIEW_NS || true
              IMAGE=$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.SourceVersion)
              # Use kustomize overlay for preview (ensure overlay references placeholder image)
              sed -i "s|REPLACE_IMAGE|$IMAGE|g" apps/example-service/k8s/overlays/preview/kustomization.yaml || true
              kubectl -n $PREVIEW_NS apply -k apps/example-service/k8s/overlays/preview
            displayName: 'Apply preview k8s manifests'

  - stage: CleanupPreview
    displayName: Cleanup preview on PR close (manual or separate trigger)
    dependsOn: []
    condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Cleanup
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Login to Azure'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "This cleanup job is a template. To run cleanup on PR close, configure a separate pipeline or service hook that triggers on PR close and deletes the preview namespace."
